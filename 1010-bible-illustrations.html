{id:866,topic:"పాపము",title:"పాపపు వల",text:"దావీదు యోవాబును తనతో పాపములో కలుపుకోవలసి వచ్చింది.",ref:"రోమీయులు 5:19; 2 సమూయేలు 11:14-17"},
{id:867,topic:"పాపము",title:"ధాన్యములో కలుపు మొక్కలు",text:"యేసు మంచి ధాన్యమును పెకలించకుండా కలుపు మొక్కలను తీసివేయలేమని సూచించాడు.",ref:"మత్తయి 13:24-30"},
{id:868,topic:"పాపము",title:"నిర్దోషుల బాధ",text:"అబీమెలెకు, \"నా హృదయ సమగ్రతలో, నా చేతుల నిర్దోషతలో నేను ఇది చేసాను\" అన్నాడు.",ref:"ఆదికాండము 20:5"},
{id:869,topic:"పాపము",title:"అతను విమోచించ ప్రయత్నించాడు",text:"షేము, యాపెతు \"తమ తండ్రి నగ్నత్వమును కప్పారు.\" ఒక సహోదరుడు గుసగుసలాడాడు; మిగిలినవారు పాపిని విమోచించ ప్రయత్నించారు.",ref:"ఆదికాండము 9:23"},
{id:870,topic:"పాపము",title:"వ్యక్తిగత బాధ్యత",text:"ప్రధాన యాజకులు యూదాతో, \"అది నీ విషయము, మా విషయము కాదు!\" అన్నారు.",ref:"మత్తయి 27:4"},
{id:871,topic:"పాపము",title:"అణచబడని పాపములు",text:"\"మాకు నక్కలను, చిన్న నక్కలను పట్టి ఇమ్ము, అవి ద్రాక్ష తోటలను పాడు చేస్తాయి.\"",ref:"పరమగీతము 2:15"},
{id:872,topic:"పాపము",title:"రహస్య పాపములు లేవు",text:"మోషే ఎవరూ తనను చూడలేదని మొదట కుడికి, ఎడమకు దొంగచూపులు చూచిన తరువాత, ఐగుప్తీయుని చంపాడు.",ref:"నిర్గమకాండము 2:11-14"},
{id:873,topic:"పాపము",title:"విషపు బాణము",text:"ఈ ప్రాచీన ప్రజలకు, ఏ ప్రజలకైనా పాపము ఒక జాతి స్వాతంత్ర్యమును నాశనము చేసి, దాని శక్తిని కలుషితము చేయు విషము.",ref:"2 రాజులు 13:3-7"},
{id:874,topic:"పాపము",title:"వల, ఉచ్చు",text:"\"అతను తన స్వంత కాళ్ళతో ఒక వలలో పడవేయబడతాడు.\"",ref:"యోబు 18:5,7-8,10"},
{id:875,topic:"పాపము",title:"ముళ్ళ పంట",text:"\"మీరు కీడును దున్నారు, విపత్తును కోయారు.\"",ref:"హోషేయ 10:13"},
{id:876,topic:"పాపము",title:"మానవ సందిగ్ధత",text:"\"నేను కోరినది చేయను, కానీ నేను ద్వేషించినదే చేస్తాను.\"",ref:"రోమీయులు 7:15,19-20"},
{id:877,topic:"పాపము",title:"శిలలు రువ్వువారు",text:"\"మీలో పాపము చేయనివాడు మొదట ఆమెపై రాయి రువ్వనివ్వండి.\"",ref:"యోహాను 8:7,11"},
{id:878,topic:"నిద్ర",title:"కానీ యోనా నిద్రించాడు",text:"కానీ ప్రభువు నుండి పారిపోతున్న యోనా నిద్రించుట కొనసాగించాడు.",ref:"యోనా 1:4-6"},
{id:879,topic:"నిద్ర",title:"మీరు కాపలా ఉండలేకపోయారా?",text:"\"ఏమి, మీరు నాతో ఒక గంట కాపలా ఉండలేకపోయారా?\"",ref:"మత్తయి 26:40"},
{id:880,topic:"నిద్ర",title:"యుతుఖు పతనము",text:"\"పౌలు ప్రసంగము కొనసాగుతుండగా, యుతుఖు అనే యువకుడు ... గాఢముగా నిద్రపోయాడు, మూడవ అంతస్తు నుండి పడిపోయాడు.\"",ref:"అపొస్తలుల కార్యములు 20:9"},
{id:881,topic:"దుఃఖము",title:"సమస్త మనుష్యులు ఒకరే",text:"దుఃఖములో సమస్త మనుష్యులు ఒకరే. అబ్రహాము, \"నేను మీతో అపరిచితుడను, వలసవాదిని: నా మృతులను పాతిపెట్టుటకు మీతో ఒక సమాధి స్థలమును ఇమ్ము\" అన్నాడు.",ref:"ఆదికాండము 23:4,6"},
{id:882,topic:"దుఃఖము",title:"నేను వారి దుఃఖములను ఎరుగుదును",text:"దుఃఖించువారికి దేవుడు \"బూడిదకు బదులుగా అందము\" ఇస్తాడు.",ref:"యెషయా 61:3"},
{id:883,topic:"మాట్లాడుట",title:"ద్రోహపు యాస",text:"\"నీ యాస నిన్ను ద్రోహము చేస్తుంది.\"",ref:"మత్తయి 26:73"},
{id:884,topic:"మాట్లాడుట",title:"దేవుని స్వరము",text:"\"ఇది దేవుని స్వరము, మనిషి స్వరము కాదు.\"",ref:"అపొస్తలుల కార్యములు 12:22,24"},
{id:885,topic:"మాట్లాడుట",title:"మాటల సంస్కారము",text:"\"మేము గుర్రాల నోటిలో కళ్ళెములు పెట్టి ... నాలుకతో కూడా అలాగే.\"",ref:"యాకోబు 3:3-5"},
{id:886,topic:"మాట్లాడుట",title:"దైవిక సాధనము",text:"\"నిత్యుడు, ప్రభువు నాకు ఒక శిక్షణ పొందిన నాలుకను ఇచ్చాడు.\"",ref:"యెషయా 50:4"},
{id:887,topic:"మాట్లాడుట",title:"దేవుని పాత్ర",text:"\"అతను నీకు నోరుగా ఉంటాడు, నీవు అతనికి దేవుని పాత్రను నటిస్తావు.\"",ref:"నిర్గమకాండము 4:15-16"},
{id:888,topic:"మాట్లాడుట",title:"వారు అర్థము చేసుకొన్న మాటలు",text:"\"అతను తమ స్వంత భాషలో తమతో మాట్లాడుట వినినప్పుడు, వారు ... ప్రశాంతముగా విన్నారు.\"",ref:"అపొస్తలుల కార్యములు 22:2"},
{id:889,topic:"స్టీవార్డ్షిప్",title:"అంకిత స్పిన్నర్లు",text:"\"తమ సామర్థ్యముపై నమ్మకము కలిగిన స్త్రీలందరూ మేక వెంట్రుకలను వడకారు.\"",ref:"నిర్గమకాండము 35:26"},
{id:890,topic:"స్టీవార్డ్షిప్",title:"రాజు ఏమి ఇచ్చాడు",text:"దావీదు \"మొదట తనను తాను ఇచ్చిన తరువాత, అతను తన ప్రజలను పిలిచాడు: 'ఇప్పుడు నిత్యునికి భక్తిలో ఈ రోజు స్వచ్ఛంద అర్పణ చేయగలవాడు ఎవరు?'\"",ref:"1 దినవృత్తాంతములు 29:2-3,5"},
{id:891,topic:"స్టీవార్డ్షిప్",title:"అతను నైలును సొంతము చేసుకొన్నాడు",text:"ఫరో, \"నా నైలు నాది; నేను దానిని చేసాను\" అన్నాడు.",ref:"యెహెజ్కేలు 29:3"},
{id:892,topic:"స్టీవార్డ్షిప్",title:"లాభ సంపాదన మిషన్",text:"యేసు, \"ఈ వస్తువులను ఇక్కడి నుండి తీసుకొని వెళ్ళండి. నా తండ్రి ఇంటిని ఒక మార్కెట్గా మార్చుటకు సాహసించకుడి!\"",ref:"యోహాను 2:16"},
{id:893,topic:"స్టీవార్డ్షిప్",title:"దైవిక క్రెడిట్",text:"\"నేను ఆశించేది ఈ విధముగా మీ దైవిక క్రెడిట్కు కూడబెట్టు వడ్డీ!\"",ref:"ఫిలిప్పీయులు 4:17"},
{id:894,topic:"అపరిచితుడు",title:"ఆధ్యాత్మిక ఆశ్రయము",text:"దేవుని మందిరము ఎల్లప్పుడూ \"దూరములో ఉన్నవానికి, సమీపములో ఉన్నవానికి\" శాంతిని తెచ్చు ఆధ్యాత్మిక ఆశ్రయము.",ref:"యెషయా 57:19"},
{id:895,topic:"అపరిచితుడు",title:"మీ స్వంత వారిలో ఒకడు",text:"\"మీతో నివసించు అపరిచితుడు మీలో పుట్టినవాని వలె ఉండాలి, నిన్ను నీవు ప్రేమించినట్లు అతనిని ప్రేమించాలి.\"",ref:"లేవీయకాండము 19:34"},
{id:896,topic:"అపరిచితుడు",title:"బయటివారికి స్వాగతము",text:"\"అపరిచితునికి, దేశములో పుట్టినవానికి మీకు ఒకే నియమము ఉండాలి.\"",ref:"సంఖ్యాకాండము 9:14"},
{id:897,topic:"అపరిచితుడు",title:"ఏ విభజన లేదు",text:"\"ప్రభువుతో చేరిన పరదేశీయుడు, 'ప్రభువు నిశ్చయముగా నన్ను తన ప్రజల నుండి వేరు చేస్తాడు' అని అనకూడదు.\"",ref:"యెషయా 56:3"},
{id:898,topic:"అపరిచితుడు",title:"మాతో నివసించుము",text:"\"మాతో నివసించుము: ఎందుకంటే సాయంత్రము అవుతోంది, దినము దాదాపు గడిచిపోయింది.\"",ref:"లూకా 24:29"},
{id:899,topic:"బలము",title:"ప్రయాణమునకు బలము",text:"బలపరచబడి, పోషింపబడి, ఎలీయా నలభై రోజుల ప్రయాణమైన హోరేబు కొండకు వెళ్ళాడు.",ref:"1 రాజులు 19:4-8"},
{id:900,topic:"బలము",title:"కొనసాగు బలము",text:"కాలేబు, \"మోషే నన్ను పంపిన దినమున నాకు బలము ఎలా ఉండెనో, ఇప్పుడు కూడా అలాగే ఉన్నది.\"",ref:"యెహోషువ 14:11"},
{id:901,topic:"బలము",title:"బలపు మూలము",text:"\"మీ బలము నిశ్శబ్ద విశ్వాసము.\"",ref:"యెషయా 30:15"},
{id:902,topic:"బలము",title:"అనియంత్రిత బలము",text:"సమ్సోను అనియంత్రిత బలము అతని నాశనమును తెచ్చింది.",ref:"న్యాయాధిపతులు 15:15-16"},
{id:903,topic:"బలము",title:"మింగివేయు అడవి",text:"\"ఆ రోజు కత్తి కంటే అడవి ఎక్కువ మందిని మింగివేసింది.\"",ref:"2 సమూయేలు 18:8"},
{id:904,topic:"ఆదివారము",title:"రక్షించుటకా లేక నాశనము చేయుటకా?",text:"\"సబ్బాతు రోజున మేలు చేయుట ధర్మమా, కీడు చేయుట ధర్మమా?\"",ref:"లూకా 6:9"},
{id:905,topic:"ఆదివారము",title:"సబ్బాతును ఆచరించుట",text:"\"మేము సబ్బాతున గానీ, పవిత్ర దినమున గానీ వారి నుండి కొనము.\"",ref:"నెహెమ్యా 10:31"},
{id:906,topic:"ఆదివారము",title:"స్పష్ట మార్గములు",text:"\"నేను వారికి నా సబ్బాతును ఇచ్చాను ... నేను, నిత్యుడు, వారిని ప్రత్యేకించువాడను అని వారికి బోధించుటకు.\"",ref:"యెహెజ్కేలు 20:12"},
{id:907,topic:"ప్రతిభ",title:"జీవ నియమము",text:"\"ప్రతి ఒక్కరికి ఉన్నవానికి ఇంకా ఎక్కువ ఇవ్వబడుతుంది; కానీ ఉన్నవాడు లేని వాని నుండి, అతనికి ఉన్నది కూడా తీసుకోబడుతుంది.\"",ref:"లూకా 19:26"},
{id:908,topic:"ప్రతిభ",title:"ఉపయోగించని వనరులు",text:"గిద్యోను గోధుమను నూర్పిడి చేస్తున్నప్పుడు, ప్రభువు దూత అతనితో, \"ప్రభువు నీతో ఉన్నాడు, ఓ పరాక్రమవంతుడా\" అన్నాడు.",ref:"న్యాయాధిపతులు 6:12"},
{id:909,topic:"ప్రతిభ",title:"పనికిరాని ప్రతిభ ఏదీ లేదు",text:"అత్యవసర పరిస్థితిలో ఏ మనిషీ \"పనికిరానివాడు\" కాదు.",ref:"న్యాయాధిపతులు 11:1-10"},
{id:910,topic:"ప్రతిభ",title:"ఎడమచేతి యోధులు",text:"\"ఏడు వందల మంది ఎన్నుకొనబడిన, ఎడమచేతి వారు.\"",ref:"న్యాయాధిపతులు 20:16"},
{id:911,topic:"ప్రతిభ",title:"సమర్థులకు మించినవారు",text:"గిద్యోను మూడు వందల మంది మిద్యానీయులను \"మానసిక యుద్ధము\" ద్వారా ఓడించారు.",ref:"న్యాయాధిపతులు 7:16-23"},
{id:912,topic:"సంయమనము",title:"నకిలీ ఉపశమనము",text:"\"ద్రాక్షారసము నుండి మీ ఉత్తేజమును పొందకుడి ... కానీ ఆత్మ మీ ఆత్మలను ఉత్తేజపరచనివ్వండి.\"",ref:"ఎఫెసీయులు 5:18-19"},
{id:913,topic:"సంయమనము",title:"విశ్వాసపాత్ర వారసత్వము",text:"రేకాబీయులు, \"మేము ద్రాక్షారసము త్రాగము.\"",ref:"యిర్మీయా 35:6"},
{id:914,topic:"సంయమనము",title:"సాంఘిక ఒత్తిడి",text:"\"మద్యపాన నియమము ఇది, ఎవరూ త్రాగుటకు బలవంతము చేయబడలేదు.\"",ref:"ఎస్తేరు 1:8"},
{id:915,topic:"సంయమనము",title:"మానవ బలహీనతలు",text:"నోవహు \"ద్రాక్షారసము త్రాగి, మత్తుడయ్యాడు.\"",ref:"ఆదికాండము 9:20-21"},
{id:916,topic:"సంయమనము",title:"అతిగా అభ్యర్థన",text:"హెరోదు తన మత్తు స్థితిలో ఆ అమ్మాయి అడిగినది ఏదైనా చేస్తానని ప్రమాణము చేసాడు.",ref:"మత్తయి 14:1-12"},
{id:917,topic:"సంయమనము",title:"రాజు విందు",text:"\"నాబాల్ హృదయము అతనిలో సంతోషముగా ఉంది, ఎందుకంటే అతను బాగా మత్తుడై ఉన్నాడు.\"",ref:"1 సమూయేలు 25:36"},
{id:918,topic:"సంయమనము",title:"ఆకర్షణ కేంద్రము",text:"\"ద్రాక్షారసము త్రాగుటలో ధైర్యవంతులకు, మద్యము కలపుటలో బలవంతులకు శ్రమ!\"",ref:"యెషయా 5:22"},
{id:919,topic:"సంయమనము",title:"దేవునికి చాలా బిజీ",text:"\"వారు నిత్యుని చేతిలో ఏమి ఉందో శ్రద్ధ చూపరు.\"",ref:"యెషయా 5:11-12"},
{id:920,topic:"శోధన",title:"పేతురు జల్లెడ",text:"\"సాతానుకు మీ అందరినీ గోధుమ వలె జల్లెడ పట్టుటకు అనుమతి ఇవ్వబడింది.\"",ref:"లూకా 22:31-32"},
{id:921,topic:"శోధన",title:"ఎరచే ఆకర్షింపబడుట",text:"\"ఎవరైనా కీడు చేయుటకు శోధింపబడినప్పుడు, అతను తన స్వంత దుష్ట కోరికచే ఆకర్షింపబడి, ఎరచే పట్టబడతాడు.\"",ref:"యాకోబు 1:14"},
{id:922,topic:"శోధన",title:"మనము ఎప్పుడు దుర్బలులము",text:"యేసు నలభై రోజులు ఉపవాసము చేసిన తరువాత మాత్రమే అపవాది ఆయనను శోధించాడు.",ref:"లూకా 4:3"},
{id:923,topic:"పరీక్ష",title:"హృదయపు యాస",text:"గిలాదీయులు \"షిబ్బోలెతు\" అని చెప్పమని కోరి పరీక్షించారు.",ref:"న్యాయాధిపతులు 12:4-6"},
{id:924,topic:"పరీక్ష",title:"పరమ ప్రశ్నలు",text:"షెబా రాణి సొలొమోనును \"గందరగోళపరచు ప్రశ్నలతో పరీక్షించుటకు వచ్చింది.\"",ref:"2 దినవృత్తాంతములు 9:1-2"},
{id:925,topic:"పరీక్ష",title:"అబ్రహాము పరీక్ష",text:"దేవుడు తన ప్రియ కుమారుడు ఇస్సాకును బలి ఇవ్వవలసినదిగా కోరి అబ్రహాము విశ్వాసమును \"పరీక్షించాడు\".",ref:"ఆదికాండము 22:1-13"},
{id:926,topic:"పరీక్ష",title:"ఆహార మార్పు",text:"పది రోజుల చివరిలో దానియేలు ఇష్టపడినది తిన్నవారు ఎక్కువ ఆరోగ్యవంతముగా ఉన్నారు.",ref:"దానియేలు 1:8-16"},
{id:927,topic:"పరీక్ష",title:"బొచ్చు పరీక్ష",text:"గిద్యోను ఒక ఉన్ని బొచ్చు తడిగా గానీ, పొడిగా గానీ చేయుట ద్వారా ఒక పరీక్షను ప్రతిపాదించాడు.",ref:"న్యాయాధిపతులు 6:36-40"},
{id:928,topic:"పరీక్ష",title:"దేవుని పరీక్షించుట",text:"ఆహాజు, \"నేను నిత్యుని ఏ పరీక్షకు గురిచేయను\" అన్నాడు.",ref:"యెషయా 7:11-12"},
{id:929,topic:"పరీక్ష",title:"అపవాది ప్రతిపాదన",text:"అపవాది యేసును దేవాలయ శిఖరము నుండి నాటకీయముగా దూకమని శోధించాడు.",ref:"లూకా 4:9-12"},
{id:930,topic:"పరీక్ష",title:"తుది పరీక్ష",text:"\"ఒలీవ కొండ అనే కొండ నుండి యెరూషలేముకు తిరిగి వెళ్ళారు, అది యెరూషలేము నుండి ఒక సబ్బాతు రోజు ప్రయాణము.\"",ref:"అపొస్తలుల కార్యములు 1:12"},
{id:931,topic:"కృతజ్ఞత",title:"దేవుని మరువవద్దు",text:"\"ప్రభువును మరువకుండా జాగ్రత్తపడుము.\"",ref:"ద్వితీయోపదేశము 6:10-12"},
{id:932,topic:"కృతజ్ఞత",title:"ఆయన కృతజ్ఞత తెలిపాడు",text:"\"అందరి ఎదుట దేవునికి కృతజ్ఞత తెలిపి, రొట్టెను విరిచి తినసాగాడు.\"",ref:"అపొస్తలుల కార్యములు 27:35"},
{id:933,topic:"కృతజ్ఞత",title:"ఒకడు మాత్రమే తిరిగి వచ్చెను",text:"\"అతడు సమరయుడు.\"",ref:"లూకా 17:16"},
{id:934,topic:"సహనము",title:"బహు నిందిత పదము",text:"గమలీయేలు, \"అది నిజముగా దేవుని నుండి పుట్టిన యెడల, మీరు వారిని అణచలేరు.\"",ref:"అపొస్తలుల కార్యములు 5:38-39"},
{id:935,topic:"సహనము",title:"కావాలి: ఎక్కువ ప్రవక్తలు",text:"\"నా కొరకు అసూయపడుతున్నావా? ప్రభువు ప్రజలందరూ ప్రవక్తలు అయ్యి ఉంటే బాగుండు!\"",ref:"సంఖ్యాకాండము 11:29"},
{id:936,topic:"సహనము",title:"ప్రాంతీయ వైఖరి",text:"\"మా దేవునికి మేము ఒక మందిరమును కట్టుటలో మీకు ఏమీ సంబంధము లేదు.\"",ref:"ఎజ్రా 4:3-4"},
{id:937,topic:"సంప్రదాయము",title:"అప్పగించబడినది",text:"\"మీరు మనుష్యుల సంప్రదాయములను పట్టుకొనుటలో అంత బిజీగా ఉన్నారు, దేవుని ఆజ్ఞను వదిలివేసారు!\"",ref:"మార్కు 7:13"},
{id:938,topic:"సంప్రదాయము",title:"అవసరము ప్రకారము ప్రాధాన్యత",text:"కేవలము ధార్మికత కంటే మనుష్యుల అవసరములకు ప్రాధాన్యత ఇవ్వాలని యేసు చెప్పాడు.",ref:"లూకా 6:1-5"},
{id:939,topic:"కష్టము",title:"నిరీక్షణ ద్వారము",text:"\"నేను ... కష్టపు లోయను నిరీక్షణ ద్వారముగా చేస్తాను.\"",ref:"హోషేయ 2:15"},
{id:940,topic:"కష్టము",title:"పదును పెట్టిన చీల",text:"\"కానీ వారు వారిని ఎంత ఎక్కువగా అణచివేసారో, అంత ఎక్కువగా వారు వృద్ధి చెంది, విస్తరించారు.\"",ref:"నిర్గమకాండము 1:12"},
{id:941,topic:"కష్టము",title:"ఏకైక సమాధానము",text:"\"వారు తమ కష్టములో ఇశ్రాయేలు దేవుడైన ప్రభువు వైపు తిరిగి, ఆయనను వెతికినప్పుడు, ఆయన వారికి కనబడ్డాడు.\"",ref:"2 దినవృత్తాంతములు 15:3-4"},
{id:942,topic:"కష్టము",title:"అలతో పాటు",text:"\"ఓడ ... గాలిని ఎదుర్కోలేకపోయినప్పుడు, మేము దానికి లొంగి, కొట్టుకొనిపోయాము.\"",ref:"అపొస్తలుల కార్యములు 27:15"},
{id:943,topic:"కష్టము",title:"వైద్యుడా, నిన్ను నీవు కుదుర్చుకో",text:"\"వైద్యుడా, నిన్ను నీవు కుదుర్చుకో.\"",ref:"లూకా 4:23"},
{id:944,topic:"కష్టము",title:"జీవితము కంటే పెద్దది",text:"\"అతని ఈటె కర్ర నేత కర్ర వలె ఉంది.\"",ref:"1 సమూయేలు 17:7"},
{id:945,topic:"సత్యము",title:"పంక్తుల మధ్య",text:"\"నా ఉత్తరముల పంక్తుల మధ్య మీరు చదవనక్కరలేదు; మీరు వాటిని అర్థము చేసుకోగలరు.\"",ref:"2 కొరింథీయులు 1:13"},
{id:946,topic:"సత్యము",title:"నీడలా లేక మనుష్యులా?",text:"\"నీవు పర్వతముల నీడను మనుష్యులుగా చూస్తున్నావు.\"",ref:"న్యాయాధిపతులు 9:36"},
{id:947,topic:"సత్యము",title:"దేవునికి అబద్ధము",text:"\"నీవు మనుష్యులకు కాదు, దేవునికి అబద్ధము చెప్పావు.\"",ref:"అపొస్తలుల కార్యములు 5:4"},
{id:948,topic:"సత్యము",title:"తెల్లగా రాయుట",text:"అబద్ధములు నిరాధారమైనవి, తెల్లరంగు వాటి అసమర్థతను ఎక్కువ కాలము మారువేషము చేయదు.",ref:"యెహెజ్కేలు 13:8-12"},
{id:949,topic:"ఐక్యత",title:"ఒకటిగా కలిసి",text:"\"ఇశ్రాయేలు మనుష్యులందరూ ఆ పట్టణముపై ఒక మనిషిగా కలిసి గుమిగూడారు.\"",ref:"న్యాయాధిపతులు 20:11"},
{id:950,topic:"ఐక్యత",title:"తక్కువవారు గానీ, గొప్పవారు గానీ కాదు",text:"\"మొత్తము శరీరము కన్ను అయితే, వినుట ఎక్కడ ఉండేది?\"",ref:"1 కొరింథీయులు 12:17,20"},
{id:951,topic:"ఐక్యత",title:"పార్టీ కేకలు",text:"\"సహోదరులారా, ఈ పార్టీ కేకలను విడిచిపెట్టమని నేను మిమ్ములను వేడుకొనుచున్నాను.\"",ref:"1 కొరింథీయులు 1:10,13"},
{id:952,topic:"విలువ",title:"ఆభరణములకు వర్తకము",text:"\"మేము గుర్రాలపై బానిసలను, కాలిపై స్వేచ్ఛావంతులను ప్రభువుల వలె నడచుట చూచాము.\"",ref:"ప్రసంగి 10:7"},
{id:953,topic:"విలువ",title:"నిజ విలువలకు సజీవము",text:"\"కానీ ఆధ్యాత్మిక మనిషి సమస్త నిజ విలువలకు సజీవుడు.\"",ref:"1 కొరింథీయులు 2:14-15"},
{id:954,topic:"విలువ",title:"నాసిరకం ప్రత్యామ్నాయములు",text:"\"రాజు రెహబాము వాటికి బదులుగా కంచు డాలులను చేయించాడు.\"",ref:"1 రాజులు 14:26-27"},
{id:955,topic:"దర్శనము",title:"నియమిత గడియ",text:"\"దర్శనమునకు దాని స్వంత నియమిత గడియ ఉంది.\"",ref:"హబక్కూకు 2:3"},
{id:956,topic:"దర్శనము",title:"అదృశ్యములకు కళ్ళు",text:"ఎలీషా, \"నీ ఆత్మలో రెట్టింపు వాటా నాపై ఉండనివ్వుము\" అని అడిగాడు.",ref:"2 రాజులు 2:9-10"},
{id:957,topic:"దర్శనము",title:"సంభాషణ మార్గములు",text:"\"ప్రభువు వాక్యము అరుదు ... తరచుగా దర్శనము లేదు.\"",ref:"1 సమూయేలు 3:1"},
{id:958,topic:"దర్శనము",title:"కళ్ళము దర్శనము",text:"\"ఓర్నాను తిరిగి, దేవదూతను చూచాడు ... ఇప్పుడు ఓర్నాను గోధుమను నూర్పిడి చేస్తున్నాడు.\"",ref:"1 దినవృత్తాంతములు 21:20"},
{id:959,topic:"దర్శనము",title:"అసాధారణ ప్రకటన",text:"జెకర్యా దేవాలయములో సాధారణ యాజక విధులను నిర్వర్తిస్తున్నప్పుడు దేవదూత అతనికి ప్రత్యక్షమయ్యాడు.",ref:"లూకా 1:8-11"},
{id:960,topic:"దర్శనము",title:"నేను ప్రభువును చూచాను",text:"\"ఉజ్జియా రాజు మరణించిన సంవత్సరములో నేను ... ప్రభువును ఉన్నతముగా, లేవనెత్తబడిన సింహాసనముపై కూర్చొని ఉన్నట్లు చూచాను.\"",ref:"యెషయా 6:1"},
{id:961,topic:"యుద్ధము",title:"ఆయుధములపై విశ్వాసము",text:"\"అతనిలో నేను నమ్మకముంచుతాను: ఆయన నా కేడెము, నా రక్షణ కొమ్ము, నా ఉన్నత బురుజు, నా ఆశ్రయము.\"",ref:"2 సమూయేలు 22:3"},
{id:962,topic:"యుద్ధము",title:"ఈ పని కొనసాగాలి",text:"\"కూలీలు ఆయుధములు ధరించారు; వారిలో ప్రతి ఒక్కరూ ఒక చేతితో పని చేసి, మరొక చేతిలో ఆయుధము పట్టుకొన్నారు.\"",ref:"నెహెమ్యా 4:17"},
{id:963,topic:"యుద్ధము",title:"రక్తపు మచ్చలు గల చేతులు",text:"\"నీవు బహు రక్తము చింపి ... నా నామమునకు ఒక మందిరమును కట్టకూడదు.\"",ref:"1 దినవృత్తాంతములు 22:8-10"},
{id:964,topic:"కాపలా",title:"మేల్కొను చెట్టు",text:"\"నేను నా వాక్యమును నెరవేర్చుటకు మేల్కొని ఉన్నాను.\"",ref:"యిర్మీయా 1:12"},
{id:965,topic:"కాపలా",title:"కాపలాదారుని పాత్ర",text:"\"నేను నిన్ను ఇశ్రాయేలు ఇంటికి కాపలాదారునిగా చేసాను.\"",ref:"యెహెజ్కేలు 3:17"},
{id:966,topic:"కాపలా",title:"కలలు కనుచు కాపలాదారులు",text:"\"నా కాపలాదారులందరూ గ్రుడ్డివారు, వారికి కాపలా చేయుట తెలియదు; మూగ కుక్కలు.\"",ref:"యెషయా 56:10"},
{id:967,topic:"కాపలా",title:"రాత్రి ఏమిటి?",text:"\"కాపలాదారుడా, రాత్రి ఏమిటి?\"",ref:"యెషయా 21:11"},
{id:968,topic:"భార్య",title:"ఒక భార్య సలహా",text:"మానోహా భార్య, \"ప్రభువు మమ్మును చంపాలని కోరినట్లయితే, ఆయన ... ఈ సమస్త విషయములను మాకు చూపి ఉండేవాడు కాదు.\"",ref:"న్యాయాధిపతులు 13:22-23"},
{id:969,topic:"భార్య",title:"ఆమె హెచ్చరిక",text:"పిలాతు భార్య, \"ఆ నీతిమంతునితో నీకు ఏమీ సంబంధము ఉండకూడదు.\"",ref:"మత్తయి 27:19"},
{id:970,topic:"భార్య",title:"అననీయా భార్య",text:"అననీయా మోసము \"అతని భార్యకు తెలిసియే\" జరిగింది.",ref:"అపొస్తలుల కార్యములు 5:2"},
{id:971,topic:"భార్య",title:"మూర్ఖునితో వివాహము",text:"అబీగైలు, \"అతని పేరు ఏమిటో, అతను అలాగే ఉన్నాడు; 'మూర్ఖుడు' అతని పేరు.\"",ref:"1 సమూయేలు 25:25"},
{id:972,topic:"భార్య",title:"స్త్రీలకు ఉదాహరణ",text:"వష్తి \"ప్రతి స్త్రీ చెవులకు చేరుతుంది, వారు తమ భర్తలను తృణీకరిస్తారు.\"",ref:"ఎస్తేరు 1:17-18"},
{id:973,topic:"భార్య",title:"అతని భార్య ఇల్లు",text:"సొలొమోను, \"నా భార్య దావీదు రాజు ఇంటిలో నివసించకూడదు.\"",ref:"2 దినవృత్తాంతములు 8:11"},
{id:974,topic:"భార్య",title:"ఆదాము సహచరి",text:"\"మనిషి ఒంటరిగా ఉండుట మంచిది కాదు; నేను అతనికి సరిపడు సహాయకురాలిని చేస్తాను.\"",ref:"ఆదికాండము 2:18"},
{id:975,topic:"సాక్ష్యము",title:"యోనా ఆధారములు",text:"యోనా, \"నేను హెబ్రూవాడను; నేను సముద్రమును, ఎండిన నేలను చేసిన పరలోక దేవుడైన ప్రభువును భయపడతాను.\"",ref:"యోనా 1:8-9"},
{id:976,topic:"సాక్ష్యము",title:"ప్రామాణీకృత సాక్ష్యము",text:"\"నేను, పౌలు, ఈ పలకరింపును నా స్వంత చేతితో వ్రాస్తున్నాను.\"",ref:"కొలొస్సయులు 4:18"},
{id:977,topic:"సాక్ష్యము",title:"సిఫారసు ఉత్తరము",text:"\"మీరే మా సాక్ష్యము, మా హృదయములలో వ్రాయబడినది.\"",ref:"2 కొరింథీయులు 3:2"},
{id:978,topic:"సాక్ష్యము",title:"కైసరు ఇంటిలో పరిశుద్ధులు",text:"\"సమస్త పరిశుద్ధులు మీకు పలకరింపులు పంపుతున్నారు, ముఖ్యముగా కైసరు ఇంటి వారు.\"",ref:"ఫిలిప్పీయులు 4:22"},
{id:979,topic:"సాక్ష్యము",title:"ఎడారి మార్గము",text:"\"ఇది ఎడారి మార్గము.\"",ref:"అపొస్తలుల కార్యములు 8:26"},
{id:980,topic:"సాక్ష్యము",title:"చూచినది, విన్నది",text:"\"మేము మా కళ్ళతో చూచిన, మా చెవులతో విన్న విషయములను మాట్లాడకుండా ఉండలేము.\"",ref:"అపొస్తలుల కార్యములు 4:20"},
{id:981,topic:"సాక్ష్యము",title:"ఒప్పించే ధ్వని",text:"\"దేవునికి భయపడే మీరందరూ రండి, వినండి, ఆయన నా ఆత్మకు ఏమి చేసాడో నేను తెలియజేస్తాను.\"",ref:"కీర్తనలు 66:16"},
{id:982,topic:"సాక్ష్యము",title:"రెండవ చేతి సాక్ష్యములు",text:"సమరయ స్త్రీ పొరుగువారు, \"ఇక మేము నీ మాట నమ్మి నమ్మకపోము; మేమే విని, ఆయన నిజముగా లోక రక్షకుడని తెలుసుకొన్నాము\" అన్నారు.",ref:"యోహాను 4:42"},
{id:983,topic:"సాక్ష్యము",title:"నేను చూస్తే తప్ప",text:"తోమా, \"అతని చేతులలో మేకు ముద్రలను చూచి ... తప్ప, నేను నమ్మను\" అన్నాడు.",ref:"యోహాను 20:25"},
{id:984,topic:"సాక్ష్యము",title:"సస్పెండ్ చేయబడిన యానిమేషన్",text:"\"నీవు వేడిగా గానీ, చల్లగా గానీ లేవు ... నేను నిన్ను నా నోటి నుండి ఉమ్మివేస్తాను.\"",ref:"ప్రకటన 3:15-16"},
{id:985,topic:"సాక్ష్యము",title:"చెరసాల సాక్ష్యము",text:"\"క్రీస్తు కారణముగా నా చెరసాల బంధనము ... తెలిసింది.\"",ref:"ఫిలిప్పీయులు 1:12-14"},
{id:986,topic:"స్త్రీలు",title:"నది పక్కన సంఘము",text:"ఫిలిప్పీ దగ్గర ఒక నది పక్కన స్త్రీల సమావేశము \"ధైర్యము, ఔదార్యము, నిజమైన క్రైస్తవ ఆత్మకు ప్రసిద్ధి చెందిన ఒక చర్చికి పునాది అయింది.\"",ref:"అపొస్తలుల కార్యములు 16:13-15"},
{id:987,topic:"స్త్రీలు",title:"మనుష్యులు ఏమి చెబుతారు",text:"అబీమెలెకు, \"నీ కత్తిని తీసి, నన్ను చంపుము, తద్వారా మనుష్యులు నా గూర్చి, 'ఒక స్త్రీ అతనిని చంపింది' అని చెప్పకూడదు.\"",ref:"న్యాయాధిపతులు 9:54"},
{id:988,topic:"స్త్రీలు",title:"నిరోధించు ప్రభావము",text:"దావీదు అబీగైలుతో, \"ఈ రోజు రక్తాపరాధము నుండి, నా స్వంత చేతితో ప్రతీకారము తీసుకొనుట నుండి నన్ను కాపాడినది నీవే!\"",ref:"1 సమూయేలు 25:33"},
{id:989,topic:"పని",title:"నీ పని ఏమిటి?",text:"\"మా సేవకుల వ్యాపారము మా యౌవనము నుండి ఇప్పటివరకు పశువుల గూర్చియే.\"",ref:"ఆదికాండము 46:33-34"},
{id:990,topic:"పని",title:"మందలను కాచుచు",text:"బేత్లెహేముకు సమీపములో తమ మందలను కాచుచున్న సాధారణ కాపరులకు మన ప్రభువు జననపు మహిమాన్విత ప్రకటన ఇవ్వబడింది.",ref:"లూకా 2:8-9"},
{id:991,topic:"పని",title:"నిరసన పని",text:"దేవాలయములో ప్రభువుకు సేవ చేయుచుండగా, ఒక దేవదూత ప్రత్యక్షమైనప్పుడు జెకర్యా కలవరపడి, భయపడ్డాడు.",ref:"లూకా 1:11-12"},
{id:992,topic:"పని",title:"సాధారణ శ్రమ",text:"తెకోయీయుల \"నobles తమ మెడలను ప్రభువు పనిలో పెట్టలేదు.\"",ref:"నెహెమ్యా 3:5"},
{id:993,topic:"పని",title:"చేతిలో ఉన్న పని",text:"\"హరుమాఫు కుమారుడు యెదాయా తన ఇంటికి ఎదురుగా మరమ్మతులు చేసాడు.\"",ref:"నెహెమ్యా 3:10"},
{id:994,topic:"పని",title:"పలాయనకారుడు",text:"దేమా \"[పౌలును] విడిచిపెట్టాడు, ఎందుకంటే అతని హృదయము ఈ లోకముపై స్థిరపడింది.\"",ref:"2 తిమోతికి 4:6-7,10"},
{id:995,topic:"లౌకికత",title:"అన్యజాతులను అనుకరించుట",text:"ఆహాజు ఒక పాగన్ బలిపీఠపు వివరమైన ప్రతిని చేసాడు.",ref:"2 రాజులు 16:10-16"},
{id:996,topic:"లౌకికత",title:"మానవ స్థాయిలు",text:"\"మీరు లౌకికులుగా లేరా, సాధారణ మనుష్యుల వలె ప్రవర్తించుట లేదా?\"",ref:"1 కొరింథీయులు 3:3"},
{id:997,topic:"ఆందోళన",title:"ఒక్క విషయము అవసరము",text:"\"మార్తా, నా ప్రియా, నీవు అనేక విషయములను సమకూర్చుట గూర్చి ఆందోళన చెంది, ఇబ్బంది పడుతున్నావు.\"",ref:"లూకా 10:41-42"},
{id:998,topic:"ఆందోళన",title:"ఒక అంగుళము లేక ఒక గంట",text:"\"మీలో ఎవరైనా ఎంత ఆందోళన చెందినా తనను ఒక అంగుళము ఎత్తుగా చేసుకోగలరా?\"",ref:"లూకా 12:25"},
{id:999,topic:"ఆందోళన",title:"అనవసర ఆందోళనలు",text:"\"సమాధి ద్వారము నుండి రాయిని మన కొరకు ఎవరు పొర్లిస్తారు?\"",ref:"మార్కు 16:3"},
{id:1000,topic:"ఆరాధన",title:"సూర్యారాధకులు",text:"యెహెజ్కేలు తమ వీపులు ప్రభువు మందిరము వైపు, తమ ముఖములు తూర్పు వైపు ఉంచి, తూర్పు వైపు సూర్యుని ఆరాధించు మనుష్యులను చూచాడు.",ref:"యెహెజ్కేలు 8:16"},
{id:1001,topic:"ఆరాధన",title:"ఆరాధనకు తాళము",text:"\"నీవు ప్రార్థన చేయునప్పుడు నటీనటులవలె ఉండకుము.\"",ref:"మత్తయి 6:5"},
{id:1002,topic:"ఆరాధన",title:"తయారు చేసిన బలిపీఠములు",text:"\"మీరు తయారు చేసిన వస్తువులను ఇక ఆరాధించకూడదు.\"",ref:"మీకా 5:13"},
{id:1003,topic:"ఆరాధన",title:"మనము ఆరాధించు దూడలు",text:"\"మనుష్యులు దూడలకు ముద్దులు ఇస్తారు!\"",ref:"హోషేయ 13:2"},
{id:1004,topic:"ఆరాధన",title:"అతనితో వర్తకము",text:"\"నీ ప్రభువైన నీ దేవుని ఆరాధించుము, ఆయనకు మాత్రమే సేవ చేయుము.\"",ref:"లూకా 4:7-8"},
{id:1005,topic:"ఆరాధన",title:"వినుటకు సమీపించుము",text:"\"దేవుని ఇంటిలోకి ఎప్పుడూ నిర్లక్ష్యముగా ప్రవేశించకుము; ఆయనను వినుటకు సమీపించుము.\"",ref:"ప్రసంగి 5:1"},
{id:1006,topic:"యౌవనము",title:"చిన్న కుమారుడు",text:"\"ఇంకా చిన్నవాడు మిగిలి ఉన్నాడు, కానీ అతను గొర్రెలు కాచుచున్నాడు.\"",ref:"1 సమూయేలు 16:11"},
{id:1007,topic:"యౌవనము",title:"జులాయి గల బాలుడు",text:"దావీదు, \"నేను ... ఇశ్రాయేలు సైన్యముల ప్రభువైన సేనల ప్రభువు నామములో నీ దగ్గరకు వస్తున్నాను.\"",ref:"1 సమూయేలు 17:45"},
{id:1008,topic:"యౌవనము",title:"నేను చాలా చిన్నవాడను",text:"\"అయ్యో, కానీ, ఓ ప్రభువైన నిత్యుడా, నేను మాట్లాడలేను, నేను చాలా చిన్నవాడను!\"",ref:"యిర్మీయా 1:6-8"},
{id:1009,topic:"యౌవనము",title:"అతను ఉండగలిగిన మనిషి",text:"సౌలు \"ఎన్నుకొనబడిన యువకుడు ... అతని భుజముల నుండి పైకి అతను ప్రజలందరి కంటే ఎత్తుగా ఉన్నాడు.\"",ref:"1 సమూయేలు 9:2"},
{id:1010,topic:"యౌవనము",title:"శాశ్వత కిరీటము",text:"\"మరణము వరకు నమ్మకముగా ఉండుము, నేను నీకు జీవ కిరీటమును ఇస్తాను.\" ఇది 1010వ ఉపమానము — యౌవనులకు, వృద్ధులకు, అందరికీ చివరి పిలుపు.",ref:"ప్రకటన 2:10"}
];

function nextFreeId(){
  const used = new Set(DATA.map(d => Number(d.id)));
  let n = 1;
  while(used.has(n)) n++;
  return n;
}
function idTaken(id, exceptId){
  id = Number(id);
  return DATA.some(d => Number(d.id) === id && Number(d.id) !== Number(exceptId));
}
/** Reuse existing category if name matches (trim); keeps categories unique in spelling */
function normalizeTopic(name){
  const t = (name || '').trim();
  if(!t) return 'Uncategorized';
  const all = topicsSorted();
  const hit = all.find(x => x === t);
  if(hit) return hit;
  // soft match: ignore extra spaces
  const compact = t.replace(/\s+/g, ' ');
  const hit2 = all.find(x => x.replace(/\s+/g, ' ') === compact);
  return hit2 || compact;
}

/* ── Telugu BSI Bible (local JSON) ── */
let BSI_BIBLE = null; // { bookName: { chapters: [ [v1,v2,...], ... ] } }
let BSI_LOAD_PROMISE = null;

const BSI_BOOK_ALIASES = {
  // map app / common variants → exact keys in bible_telug_bsi.json
  "ద్వితీయోపదేశము":"ద్వితీయోపదేశకాండము",
  "యెహొషువ":"యెహోషువ",
  "రోమీయులు":"రోమా",
  "రోమా":"రోమా",
  "ప్రకటన":"ప్రకటన గ్రంథము",
  "ప్రకటన గ్రంథము":"ప్రకటన గ్రంథము",
  "యోహాను సువార్త":"యోహాను",
  "1 తిమోతికి":"1 తిమోతి",
  "2 తిమోతికి":"2 తిమోతి",
  "ఫిలేమోనుకు":"ఫిలేమోను"
};

function resolveBsiBook(name){
  if(!name || !BSI_BIBLE) return null;
  const n = name.trim().replace(/\s+/g,' ');
  if(BSI_BIBLE[n]) return n;
  if(BSI_BOOK_ALIASES[n] && BSI_BIBLE[BSI_BOOK_ALIASES[n]]) return BSI_BOOK_ALIASES[n];
  // fuzzy: starts-with / includes
  for(const k of Object.keys(BSI_BIBLE)){
    if(k === n || k.startsWith(n) || n.startsWith(k)) return k;
  }
  return null;
}

const BSI_IDB_NAME = 'telugu_bsi_bible_db';
const BSI_IDB_STORE = 'bible';
const BSI_IDB_KEY = 'bsi_v1';

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(BSI_IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(BSI_IDB_STORE)) db.createObjectStore(BSI_IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetBible(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(BSI_IDB_STORE, 'readonly');
      const req = tx.objectStore(BSI_IDB_STORE).get(BSI_IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSetBible(data){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(BSI_IDB_STORE, 'readwrite');
      tx.objectStore(BSI_IDB_STORE).put(data, BSI_IDB_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.warn('IDB save failed', e); }
}

async function loadBsiFromFile(file){
  const text = await file.text();
  const data = JSON.parse(text);
  if(!data || typeof data !== 'object' || !data['ఆదికాండము']){
    throw new Error('Not a valid BSI Telugu Bible JSON');
  }
  BSI_BIBLE = data;
  await idbSetBible(data);
  return data;
}

function promptBsiFile(){
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async () => {
      try{
        if(!input.files || !input.files[0]) return reject(new Error('No file selected'));
        resolve(await loadBsiFromFile(input.files[0]));
      }catch(e){ reject(e); }
    };
    input.click();
  });
}

async function ensureBsiBible(){
  if(BSI_BIBLE) return BSI_BIBLE;
  if(BSI_LOAD_PROMISE) return BSI_LOAD_PROMISE;
  BSI_LOAD_PROMISE = (async () => {
    // 1) IndexedDB cache (works after first successful load / file pick)
    const cached = await idbGetBible();
    if(cached && cached['ఆదికాండము']){
      BSI_BIBLE = cached;
      return BSI_BIBLE;
    }
    // 2) fetch next to HTML (works when served over http/https)
    const candidates = ['./bible_telug_bsi.json', 'bible_telug_bsi.json'];
    for(const url of candidates){
      try{
        const res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if(data && data['ఆదికాండము']){
          BSI_BIBLE = data;
          await idbSetBible(data);
          return BSI_BIBLE;
        }
      }catch(e){ /* try next */ }
    }
    // 3) ask user to pick the file once (fixes file:// and missing path)
    throw new Error('NEED_FILE');
  })();
  try{
    return await BSI_LOAD_PROMISE;
  }catch(e){
    BSI_LOAD_PROMISE = null;
    throw e;
  }
}

/** Parse refs like "యోహాను 3:16" or "మత్తయి 21:28-31; 1 యోహాను 3:18" */
function parseRefs(refStr){
  if(!refStr) return [];
  const parts = refStr.split(/[;；]/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const part of parts){
    const m = part.match(/^(\d?\s*[^\d\s][^\d]*?)\s+(\d+)\s*:\s*(\d+)(?:\s*[-–—]\s*(\d+))?/);
    if(!m) continue;
    const bookName = m[1].trim();
    const chapter = parseInt(m[2],10);
    const v1 = parseInt(m[3],10);
    const v2 = m[4] ? parseInt(m[4],10) : v1;
    out.push({ bookName, chapter, vStart: Math.min(v1,v2), vEnd: Math.max(v1,v2), label: part });
  }
  return out;
}

function getBsiVerses(bookKey, chapter, vStart, vEnd){
  const book = BSI_BIBLE[bookKey];
  if(!book || !book.chapters) return null;
  const ch = book.chapters[chapter - 1]; // 0-based
  if(!ch) return null;
  const lines = [];
  for(let v = vStart; v <= vEnd; v++){
    const t = ch[v - 1];
    if(t != null && t !== '') lines.push(v + '. ' + String(t).trim());
  }
  return lines.length ? lines.join('\n') : null;
}

async function loadBibleVerses(refStr, container){
  if(!container) return;
  const refs = parseRefs(refStr);
  if(!refs.length){
    container.innerHTML = '<div class="bv-err">Could not parse reference for lookup</div>';
    return;
  }
  container.innerHTML = '<div class="bv-loading">Loading Telugu BSI Bible…</div>';
  try{
    await ensureBsiBible();
    const blocks = [];
    for(const r of refs){
      const key = resolveBsiBook(r.bookName);
      if(!key){
        blocks.push('<div class="bv-ref">' + esc(r.label) + '</div><div class="bv-err">Book not found in BSI data: ' + esc(r.bookName) + '</div>');
        continue;
      }
      const body = getBsiVerses(key, r.chapter, r.vStart, r.vEnd);
      if(!body){
        blocks.push('<div class="bv-ref">' + esc(r.label) + '</div><div class="bv-err">Verse not found</div>');
      } else {
        blocks.push('<div class="bv-ref">' + esc(r.label) + ' · BSI</div><div class="bv-text">' + esc(body) + '</div>');
      }
    }
    container.innerHTML =
      '<div class="bv-label">Telugu Bible · BSI</div>' +
      blocks.join('<hr style="border:none;border-top:1px solid var(--border);margin:12px 0">');
  }catch(e){
    const msg = (e && e.message === 'NEED_FILE')
      ? 'Bible file not loaded yet. Click below to select <b>bible_telug_bsi.json</b> once — it will be saved in this browser.'
      : ('Could not load BSI Bible: ' + esc(String(e.message||e)));
    container.innerHTML =
      '<div class="bv-err">' + msg + '</div>' +
      '<button class="btn btn-primary" id="bsiPickBtn" style="margin-top:12px;width:100%">📂 Load bible_telug_bsi.json</button>' +
      '<p class="field-hint" style="margin-top:8px">Tip: keep the JSON in the same folder and open the app via a local server, or pick the file here once.</p>';
    const btn = document.getElementById('bsiPickBtn');
    if(btn){
      btn.onclick = async () => {
        try{
          btn.disabled = true;
          btn.textContent = 'Loading…';
          await promptBsiFile();
          toast('✓ BSI Bible loaded');
          loadBibleVerses(refStr, container);
        }catch(err){
          btn.disabled = false;
          btn.textContent = '📂 Load bible_telug_bsi.json';
          toast('✗ ' + (err.message || 'Failed'));
        }
      };
    }
  }
}

function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    DATA = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SERMON_DATA));
    if(!Array.isArray(DATA) || DATA.length < 1000) DATA = JSON.parse(JSON.stringify(SERMON_DATA));
  }catch(e){ DATA = JSON.parse(JSON.stringify(SERMON_DATA)); }
  try{
    const f = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    FAVS = new Set(Array.isArray(f) ? f : []);
  }catch(e){ FAVS = new Set(); }
}
function saveData(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){} }
function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS])); }catch(e){} }
function toggleFav(id){
  id = Number(id);
  if(FAVS.has(id)) FAVS.delete(id); else FAVS.add(id);
  saveFavs();
  return FAVS.has(id);
}
function isFav(id){ return FAVS.has(Number(id)); }

const $ = s => document.querySelector(s);
const listEl = $('#list'), statsEl = $('#stats');
const catPanel = $('#catPanel'), catGrid = $('#catGrid');

function topicCounts(){
  const map = {};
  DATA.forEach(d => {
    const t = d.topic || 'Uncategorized';
    map[t] = (map[t] || 0) + 1;
  });
  return map;
}
function topicsSorted(){
  const counts = topicCounts();
  return Object.keys(counts).sort((a,b)=>a.localeCompare(b,'te'));
}

function updateActiveFilterUI(){
  const af = $('#activeFilter');
  const label = $('#afLabel');
  if(activeTopic && activeTopic !== 'All'){
    af.classList.add('show');
    label.textContent = activeTopic;
  } else {
    af.classList.remove('show');
  }
}

function renderCatGrid(){
  const counts = topicCounts();
  const allTopics = topicsSorted();
  const q = catFilter.trim().toLowerCase();
  const filtered = q ? allTopics.filter(t => t.toLowerCase().includes(q)) : allTopics;

  let html = `
    <button class="cat-item cat-all ${activeTopic==='All'?'active':''}" data-topic="All">
      <span class="ci-name">All categories</span>
      <span class="ci-count">${DATA.length} illustrations</span>
    </button>`;

  filtered.forEach(t => {
    html += `
      <button class="cat-item ${activeTopic===t?'active':''}" data-topic="${esc(t)}">
        <span class="ci-name">${esc(t)}</span>
        <span class="ci-count">${counts[t] || 0}</span>
      </button>`;
  });

  if(!filtered.length){
    html += `<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted)">No categories match</div>`;
  }

  catGrid.innerHTML = html;
  catGrid.querySelectorAll('.cat-item').forEach(btn => {
    btn.onclick = () => {
      activeTopic = btn.dataset.topic;
      updateActiveFilterUI();
      closeCatPanel();
      render();
    };
  });
}

function openCatPanel(){
  catFilter = '';
  $('#catSearch').value = '';
  renderCatGrid();
  catPanel.classList.add('open');
  setTimeout(() => $('#catSearch').focus(), 200);
}
function closeCatPanel(){ catPanel.classList.remove('open'); }

$('#scopeChips').querySelectorAll('.scope-chip').forEach(chip => {
  chip.onclick = () => {
    searchScope = chip.dataset.scope;
    $('#scopeChips').querySelectorAll('.scope-chip').forEach(c => c.classList.remove('active'));

function updateSearchPlaceholder(){
  const map = {
    all: 'Search all fields…',
    title: 'Search titles…',
    text: 'Search description text…',
    ref: 'Search Bible references…',
    id: 'Search by number (e.g. 42)…',
    topic: 'Search topics…'
  };
  $('#search').placeholder = map[searchScope] || 'Search…';
}

function filtered(){
  const q = searchTerm.trim().toLowerCase();
  return DATA.filter(d => {
    if(showFavsOnly && !isFav(d.id)) return false;
    if(activeTopic !== 'All' && d.topic !== activeTopic) return false;
    if(!q) return true;
    switch(searchScope){
      case 'title': return (d.title||'').toLowerCase().includes(q);
      case 'text':  return (d.text||'').toLowerCase().includes(q);
      case 'ref':   return (d.ref||'').toLowerCase().includes(q);
      case 'id':    return String(d.id).includes(q);
      case 'topic': return (d.topic||'').toLowerCase().includes(q);
      default:
        return (d.title||'').toLowerCase().includes(q) ||
               (d.text||'').toLowerCase().includes(q) ||
               (d.ref||'').toLowerCase().includes(q) ||
               (d.topic||'').toLowerCase().includes(q) ||
               String(d.id).includes(q);
    }
  });
}

function render(){
  const items = filtered();
  const scopeNote = searchScope !== 'all' && searchTerm ? ` · ${searchScope}` : '';
  const favNote = showFavsOnly ? ' · favorites' : '';
  statsEl.textContent = `${items.length} / ${DATA.length} illustrations${scopeNote}${favNote}`;
  if(!items.length){
    listEl.innerHTML = `<div class="empty"><p>🔍 Nothing found</p><p style="font-size:.9rem;margin-top:6px">Try a different search, scope, or category</p></div>`;
    return;
  }
  listEl.innerHTML = items.map(d => `
    <div class="card" data-id="${d.id}">
      <div class="card-num">#${d.id}</div>
      <button class="card-fav ${isFav(d.id)?'on':''}" data-fav="${d.id}" title="Favorite">${isFav(d.id)?'★':'☆'}</button>
      <div class="card-topic">${esc(d.topic||'')}</div>
      <h3>${esc(d.title||'')}</h3>
      <p>${esc(d.text||'')}</p>
      ${d.ref?`<div class="card-ref">📖 ${esc(d.ref)}</div>`:''}
    </div>`).join('');
  listEl.querySelectorAll('.card').forEach(c => {
    c.onclick = () => openView(Number(c.dataset.id));
  });
  listEl.querySelectorAll('.card-fav').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.fav);
      const on = toggleFav(id);
      btn.textContent = on ? '★' : '☆';
      btn.classList.toggle('on', on);
      if(showFavsOnly) render();
      toast(on ? '★ Added to favorites' : 'Removed from favorites');
    };
  });
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const modal = $('#modal'), viewBody = $('#viewBody'), editBody = $('#editBody');
function openView(id){
  const d = DATA.find(x=>x.id===id); if(!d) return;
  editingId = id;
  $('#modalTitle').textContent = `#${d.id} · ${d.topic || 'Details'}`;
  const favOn = isFav(d.id);

    <div class="view-topic">${esc(d.topic||'')}</div>
    <h2 class="view-title">${esc(d.title||'')}</h2>
    <p class="view-text">${esc(d.text||'')}</p>
    ${d.ref?`<div class="view-ref">📖 ${esc(d.ref)}</div>`:''}
    ${d.ref?`<div class="bible-verse-box" id="bibleBox"><div class="bv-loading">Loading Telugu BSI Bible…</div></div>`:''}
    <div class="view-actions">
      <button class="btn btn-ghost" id="viewFavBtn">${favOn?'★ Favorited':'☆ Favorite'}</button>
      <button class="btn btn-ghost" id="viewCopyBtn">📋 Copy</button>
      <button class="btn btn-primary" id="viewShareBtn">↗ Share</button>
    </div>
  `;
  viewBody.style.display='block'; editBody.style.display='none';
  $('#editToggle').textContent = '✎';
  modal.classList.add('open');
  $('#viewFavBtn').onclick = () => {

    render();
    toast(on ? '★ Added to favorites' : 'Removed from favorites');
  };
  $('#viewCopyBtn').onclick = () => copyIllustration(d);
  $('#viewShareBtn').onclick = () => shareIllustration(d);
  if(d.ref){
    const box = document.getElementById('bibleBox');
    loadBibleVerses(d.ref, box);
  }
}

function formatIllustration(d){
  let out = '#' + d.id + ' · ' + (d.topic || '') + '\n' + (d.title || '') + '\n\n' + (d.text || '');
  if(d.ref) out += '\n\n📖 ' + d.ref;
  return out;
}
async function copyIllustration(d){
  const t = formatIllustration(d);
  try{
    await navigator.clipboard.writeText(t);
    toast('✓ Copied to clipboard');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('✓ Copied to clipboard');
  }
}
async function shareIllustration(d){
  const t = formatIllustration(d);
  if(navigator.share){
    try{ await navigator.share({title: d.title || 'Bible Illustration', text: t}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  copyIllustration(d);
}
function openRandom(){
  const pool = filtered().length ? filtered() : DATA;
  if(!pool.length){ toast('No illustrations to pick'); return; }
  const d = pool[Math.floor(Math.random()*pool.length)];
  openView(d.id);
}

$('#saveBtn').onclick = ()=>{

  const newId = parseInt($('#f_id').value, 10);

  if(idTaken(newId, d.id)){ toast('Number #' + newId + ' is already used — pick another'); return; }
  const title = $('#f_title').value.trim();
  if(!title){ toast('Title is required'); return; }
  d.id = newId;
  editingId = newId;
  d.topic = normalizeTopic($('#f_topic').value);
  d.title = title;
  d.text  = $('#f_text').value.trim();
  d.ref   = $('#f_ref').value.trim();

};

async function backup(){
  const json = JSON.stringify({app:'bible-illustrations-1010', version:2, count:DATA.length, exported:new Date().toISOString(), items:DATA}, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const name = `bible-illustrations-backup-${new Date().toISOString().slice(0,10)}.json`;
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({suggestedName:name, types:[{description:'JSON', accept:{'application/json':['.json']}}]});
      const w = await handle.createWritable(); await w.write(blob); await w.close();
      toast('✓ Backup complete'); return;
    }catch(e){ if(e.name==='AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url); toast('✓ Download complete');
}
async function restore(){
  if(window.showOpenFilePicker){
    try{
      const [handle] = await window.showOpenFilePicker({types:[{description:'JSON', accept:{'application/json':['.json']}}]});
      const file = await handle.getFile(); await handleFile(file); return;
    }catch(e){ if(e.name==='AbortError') return; }
  }
  $('#fileInput').click();
}
function handleFile(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const obj = JSON.parse(r.result);
      const items = Array.isArray(obj) ? obj : obj.items;
      if(!Array.isArray(items)) throw new Error('bad');
      if(!confirm(`Restore ${items.length} illustrations?`)) return;
      const seen = new Set();
      DATA = [];
      items.forEach((x,i) => {
        let id = Number(x.id);
        if(!id || seen.has(id)) id = Date.now() + i;
        while(seen.has(id)) id++;
        seen.add(id);
        DATA.push({id, topic: normalizeTopic(x.topic||'Uncategorized'), title: x.title||'', text: x.text||'', ref: x.ref||''});
      });
      saveData(); render(); menuPanel.classList.remove('open');
      toast(`✓ ${DATA.length} illustrations restored`);
    }catch(e){ toast('✗ Invalid file'); }
  };
  r.readAsText(file);
}
$('#fileInput').onchange = e => { if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; };
