{id:336,topic:"స్నేహము",title:"అతను ప్రేమించినవాడు",text:"\"సౌలు కుమారుడు యోనాతాను దావీదు దగ్గరకు హొరెషాకు వెళ్ళి, దేవుని ద్వారా అతనిని ధైర్యపరచాడు.\"",ref:"1 సమూయేలు 23:16"},
{id:337,topic:"స్నేహము",title:"మన ప్రయత్నములను ఆధారము చేయుట",text:"\"మీ మద్దతుతో అక్కడికి పంపబడాలని ఆశిస్తున్నాను.\"",ref:"రోమీయులు 15:23"},
{id:338,topic:"స్నేహము",title:"తీతు రాక",text:"\"కానీ దేవుడు, నిరుత్సాహపడినవారిని సాంత్వన పరచు దేవుడు, తీతు రాకచే మమ్మును సాంత్వన పరచాడు.\"",ref:"2 కొరింథీయులు 7:5-6"},
{id:339,topic:"స్నేహము",title:"అతను నన్ను బలపరచాడు",text:"\"అనేకసార్లు అతను నన్ను బలపరచాడు.\"",ref:"2 తిమోతికి 1:16"},
{id:340,topic:"స్నేహము",title:"స్వస్థత సాధనము",text:"రోగి స్నేహితుల విశ్వాసము స్వస్థత సాధనమైంది.",ref:"లూకా 5:18-20"},
{id:341,topic:"స్నేహము",title:"దేవుని మిత్రుడు",text:"\"ప్రభువు మోషేతో ముఖాముఖి మాట్లాడాడు, ఒక మనిషి తన స్నేహితునితో మాట్లాడినట్లు.\"",ref:"నిర్గమకాండము 33:11"},
{id:342,topic:"స్నేహము",title:"వింత స్నేహితులు",text:"\"ఆ రోజు హెరోదు, పిలాతు గట్టి స్నేహితులయ్యారు.\"",ref:"లూకా 23:12"},
{id:343,topic:"భవిష్యత్తు",title:"భయపడకుము",text:"\"నేను ... నీ తండ్రి దేవుడను: ఐగుప్తులోనికి వెళ్ళుటకు భయపడకుము.\"",ref:"ఆదికాండము 46:3"},
{id:344,topic:"భవిష్యత్తు",title:"భవిష్యత్ నిబద్ధతలు",text:"\"నేను ఐగుప్తీయులకు ఏమి చేసానో, మిమ్ములను గద్ద రెక్కలపై ఎలా మోసి, నా దగ్గరకు తీసుకొని వచ్చానో మీరు చూచారు.\"",ref:"నిర్గమకాండము 19:4-5"},
{id:345,topic:"భవిష్యత్తు",title:"ముందుకు వెళ్ళుడి",text:"\"ఇశ్రాయేలీయులతో, వారు ముందుకు వెళ్ళాలని చెప్పుము.\"",ref:"నిర్గమకాండము 14:13,15"},
{id:346,topic:"భవిష్యత్తు",title:"భవిష్యత్ మహిమ",text:"\"మీ గుడారము స్థలమును విశాలము చేయుడి.\"",ref:"యెషయా 54:2"},
{id:347,topic:"భవిష్యత్తు",title:"భవిష్యత్తులో పెట్టుబడి",text:"యిర్మీయా అనాతోతులో పొలమును కొన్నాడు.",ref:"యిర్మీయా 32:6-15"},
{id:348,topic:"భవిష్యత్తు",title:"అది దేవుని చిత్తమైతే",text:"\"ప్రభువు చిత్తమైతే, మేము ఇంకా జీవించి, ఇలా చేస్తాము.\"",ref:"యాకోబు 4:13-15"},
{id:349,topic:"భవిష్యత్తు",title:"మంచి మార్గము",text:"\"క్రాస్-రోడ్ వద్ద నిలిచి ... పాత మార్గమును వెతుకుము, మంచి మార్గమును అడిగి తీసుకో.\"",ref:"యిర్మీయా 6:16"},
{id:350,topic:"భవిష్యత్తు",title:"భవిష్యత్తు ఎవరిది",text:"భవిష్యత్తు ఎల్లప్పుడూ \"నమ్మకపు పూర్ణ హామీతో నిజమైన హృదయముతో సమీపించు\" మనుష్యులకు చెందుతుంది.",ref:"హెబ్రీయులు 10:22"},
{id:351,topic:"ఔదార్యము",title:"నిస్వార్థ ఔదార్యము",text:"\"నేను నీ ఒంటెలకు కూడా నీరు త్రాగిస్తాను.\"",ref:"ఆదికాండము 24:14"},
{id:352,topic:"ఔదార్యము",title:"అతని హృదయము వినయపరచబడింది",text:"\"నీవు ధన్యుడవు, నా కుమారుడా దావీదూ!\"",ref:"1 సమూయేలు 26:25"},
{id:353,topic:"ఔదార్యము",title:"రాజు బల్ల వద్ద",text:"\"అతను నిరంతరము రాజు బల్లపై భోజనము చేసాడు.\"",ref:"2 సమూయేలు 9:13"},
{id:354,topic:"ఔదార్యము",title:"సవాలు ప్రమాణము",text:"\"వారు తమ వనరుల పరిమితి వరకు ఉదారముగా తెరిచిన చేతులు కలిగి ఉన్నారు.\"",ref:"2 కొరింథీయులు 8:2-4"},
{id:355,topic:"ఔదార్యము",title:"మిస్ అయిన ఒక విషయము",text:"\"నీకు ఇంకా ఒక విషయము మిస్ అయింది.\"",ref:"లూకా 18:22"},
{id:356,topic:"ఔదార్యము",title:"దేవుని ఔదార్యము",text:"\"గొప్ప స్వరము వినువారు ఎవరూ లేరు.\"",ref:"మత్తయి 20:1-15"},
{id:357,topic:"దేవుడు",title:"దేవుని ముఖము చూడుట",text:"\"దేవుడు మోషేతో, 'నా మహిమను నీకు చూపిస్తాను' అన్నాడు.\"",ref:"నిర్గమకాండము 33:18"},
{id:358,topic:"దేవుడు",title:"ఇంకా చిన్న స్వరము",text:"ప్రభువు ఎలీయాకు \"ఒక చిన్న స్వరము\" గుసగుసలో వెల్లడించుకొన్నాడు.",ref:"1 రాజులు 19:12"},
{id:359,topic:"దేవుడు",title:"జీవితపు కేంద్ర సత్యము",text:"దేవుడు మన అస్తిత్వములో కేంద్ర సత్యము.",ref:"రోమీయులు 11:36"},
{id:360,topic:"దేవుడు",title:"ఆయన వలె ఎవరూ లేరు",text:"\"ఈ విధముగా విడుదల చేయగల మరొక దేవుడు లేడు.\"",ref:"దానియేలు 3:29"},
{id:361,topic:"దేవుడు",title:"వినువారికి",text:"\"నేను ఆకాశము నుండి మీతో మాట్లాడుట మీరు స్వయముగా చూచారు.\"",ref:"నిర్గమకాండము 20:22"},
{id:362,topic:"దేవుడు",title:"సగం కాల్చినది",text:"\"ఎఫ్రాయిము తిరగని ఒక దోసె.\"",ref:"హోషేయ 7:8"},
{id:363,topic:"దేవుడు",title:"ప్రత్యామ్నాయములు లేవు",text:"\"వారు క్రొత్త దేవతలను ఎన్నుకొన్నారు.\"",ref:"న్యాయాధిపతులు 5:8"},
{id:364,topic:"దేవుడు",title:"దయ్యములను సంప్రదించవద్దు",text:"\"జీవించువారి తరఫున చనిపోయినవారిని ఎందుకు సంప్రదించాలి?\"",ref:"యెషయా 8:19-20"},
{id:365,topic:"దేవుడు",title:"దైవిక కుమ్మరవాడు",text:"\"అతను చేతులలో చేయుచున్న ఏ పాత్ర అయినా పాడైనప్పుడు, అతను తనను సంతృప్తి పరచుకొను వరకు దానిని తిరిగి రూపొందించుకొన్నాడు.\"",ref:"యిర్మీయా 18:4"},
{id:366,topic:"దేవుడు",title:"ప్రభువు సమర్థుడు",text:"\"ప్రభువు దీని కంటే చాలా ఎక్కువ ఇవ్వగలడు.\"",ref:"2 దినవృత్తాంతములు 25:9"},
{id:367,topic:"దేవుడు",title:"సమీపములో ఒక స్థలము",text:"\"ఇదిగో, నా పక్కన ఒక స్థలము ఉంది, అక్కడ నీవు బండపై నిలబడతావు.\"",ref:"నిర్గమకాండము 33:21"},
{id:368,topic:"దేవుడు",title:"అతను దేవుని ఎన్నిక",text:"\"ఓ నా ప్రభువా, నేను ఇశ్రాయేలును ఎలా రక్షించగలను?\"",ref:"న్యాయాధిపతులు 6:15-16"},
{id:369,topic:"దేవుడు",title:"నాగలి నుండి పిలువబడెను",text:"ఎలీషా పన్నెండు జతల ఎద్దుల వెనుక నాగలి దున్నుతున్నాడు.",ref:"1 రాజులు 19:19"},
{id:370,topic:"దేవుడు",title:"మరొకరిని తీసుకొని రమ్ము",text:"\"క్రిందకు వెళ్ళి, అహరోనును నీతో తీసుకొని రమ్ము.\"",ref:"నిర్గమకాండము 19:20,24"},
{id:371,topic:"దేవుడు",title:"ఆజ్ఞల క్రింద",text:"\"నేను ప్రవక్తను కాను ... కానీ నేను గొర్రెల కాపరిని ... ప్రభువు నన్ను గొర్రెల మంద వెంబడి నుండి తీసుకొని ... 'వెళ్ళి నా ప్రజల ఇశ్రాయేలుకు ప్రవచించుము' అన్నాడు.\"",ref:"ఆమోసు 7:14-15"},
{id:372,topic:"దేవుడు",title:"దేవుడు ఎలా సమకూర్చును",text:"పాత్రలు ఉన్నంతవరకు నూనె ప్రవహించుట కొనసాగింది, తద్వారా ఆమె తన ఋణమును తీర్చగలిగింది.",ref:"2 రాజులు 4:1-7"},
{id:373,topic:"దేవుడు",title:"నాల్గవ వ్యక్తి",text:"మండుచున్న అగ్ని గుండములో ముగ్గురితో ఒక నాల్గవ వ్యక్తి ఉన్నాడు, అతని రూపము \"దేవతల కుమారుని వలె\" ఉంది.",ref:"దానియేలు 3:25"},
{id:374,topic:"దేవుడు",title:"జీవుల కట్ట",text:"\"నా ప్రభువు జీవితము ... జీవుల కట్టలో కట్టబడి ఉంటుంది.\"",ref:"1 సమూయేలు 25:29"},
{id:375,topic:"దేవుడు",title:"దేవుని ఆశీర్వాదములను క్లెయిమ్ చేయుట",text:"\"మీరు మీ చేతులను చాచినప్పుడు, నేను మీ నుండి నా కళ్ళను దాచుకుంటాను.\"",ref:"యెషయా 1:15"},
{id:376,topic:"దేవుడు",title:"వాక్యము సమీపములో ఉంది",text:"\"వాక్యము నీకు బహు సమీపములో ఉంది, నీ నోటిలో, నీ హృదయములో, తద్వారా నీవు దానిని చేయగలవు.\"",ref:"ద్వితీయోపదేశము 30:11-14"},
{id:377,topic:"దేవుడు",title:"దైవిక భౌగోళికత",text:"\"సిరియన్లు, 'ప్రభువు కొండల దేవుడు, కానీ లోయల దేవుడు కాదు' అని చెప్పినందున...\"",ref:"1 రాజులు 20:28"},
{id:378,topic:"దేవుడు",title:"దేవునితో తిరిగి మాట్లాడుట",text:"\"కుమ్మరవానితో, 'నీవు నన్ను ఎందుకు ఇలా చేసావు?' అని మట్టి మాట్లాడగలదా?\"",ref:"రోమీయులు 9:20-21"},
{id:379,topic:"దేవుడు",title:"వదిలిపెట్టిన దేవతలు",text:"\"ఓ నిత్యుడా, మా స్వంత దేవుడా, ఇతరులు మాపై పరిపాలించారు.\"",ref:"యెషయా 26:13-14"},
{id:380,topic:"దేవుడు",title:"ఖాళీ సున్నాలు",text:"\"ఆయన ముందు సమస్త జాతులు ఏమియు కావు, ఖాళీ సున్నాలుగా ఆయన వాటిని లెక్కిస్తాడు.\"",ref:"యెషయా 40:15,17"},
{id:381,topic:"దేవుడు",title:"బహిర్గతమైన భుజము",text:"\"సమస్త జాతులు నిత్యుడు తన పవిత్ర భుజమును క్రియ కొరకు బహిర్గతము చేయుట చూచాయి.\"",ref:"యెషయా 52:10"},
{id:382,topic:"సువార్త",title:"నా సంకెళ్ళను జ్ఞాపకము చేసుకోండి",text:"\"నా సంకెళ్ళను జ్ఞాపకము చేసుకోండి.\"",ref:"కొలొస్సయులు 4:18"},
{id:383,topic:"సువార్త",title:"బూర ధ్వని చేస్తే",text:"\"బూర స్పష్టమైన పిలుపు ఇవ్వకపోతే, యుద్ధమునకు ఎవరు సిద్ధమవుతారు?\"",ref:"1 కొరింథీయులు 14:8"},
{id:384,topic:"మార్గదర్శనము",title:"నడిపించు హస్తము",text:"\"ప్రభువు పగటిపూట మేఘ స్తంభములో వారికి మార్గము చూపుటకు, రాత్రిపూట అగ్ని స్తంభములో వారికి వెలుగు ఇచ్చుటకు వారికి ముందుగా వెళ్ళాడు.\"",ref:"నిర్గమకాండము 13:21"},
{id:385,topic:"మార్గదర్శనము",title:"పరలోక వెలుగు",text:"\"ప్రభువా, నేను ఏమి చేయాలని కోరుతున్నావు?\"",ref:"అపొస్తలుల కార్యములు 9:6"},
{id:386,topic:"మార్గదర్శనము",title:"ఏరు ఎండిపోయింది",text:"\"కొంత కాలము తరువాత, ఆ ఏరు ఎండిపోయింది.\"",ref:"1 రాజులు 17:4,7"},
{id:387,topic:"మార్గదర్శనము",title:"గుసగుసలాడు స్వరము",text:"\"ఇదే మార్గము, ఇక్కడ నడవండి.\"",ref:"యెషయా 30:21"},
{id:388,topic:"మార్గదర్శనము",title:"నక్షత్రము నడిపించు జీవితములు",text:"\"తూర్పున వారు చూచిన నక్షత్రము వారికి ముందుగా వెళ్ళుచుండెను.\"",ref:"మత్తయి 2:9"},
{id:389,topic:"మార్గదర్శనము",title:"తప్పుడు మార్గదర్శకులు",text:"\"ఒక తప్పుడు మార్గదర్శకుని — ఏమి ఉపయోగము?\"",ref:"హబక్కూకు 2:18-19"},
{id:390,topic:"మార్గదర్శనము",title:"ప్రభువు జవాబివ్వలేదు",text:"\"ప్రభువు అతనికి జవాబివ్వలేదు, కలల ద్వారా గానీ, ఊరీము ద్వారా గానీ, ప్రవక్తల ద్వారా గానీ.\"",ref:"1 సమూయేలు 28:5-6"},
{id:391,topic:"అపరాధము",title:"దొంగ చూపులు",text:"ఎవరూ చూడలేదని నిర్ధారించుకోవడానికి అతను \"ఇటు అటు చూచిన\" తరువాతనే ఐగుప్తీయుని చంపాడు.",ref:"నిర్గమకాండము 2:12"},
{id:392,topic:"అపరాధము",title:"మేము నిజముగా అపరాధులము",text:"\"మేము నిజముగా మా సహోదరుని గూర్చి అపరాధులము.\"",ref:"ఆదికాండము 42:21"},
{id:393,topic:"అపరాధము",title:"వారు సిగ్గుపడలేరు",text:"\"వారు కాదు! వారికి సిగ్గుపడుట తెలియదు.\"",ref:"యిర్మీయా 6:15"},
{id:394,topic:"అపరాధము",title:"వారు లాగు శిక్ష",text:"\"తాము మోసిన కఠిన దుష్టత్వముచే తమపై అపరాధమును లాగుకొను వారికి శ్రమ.\"",ref:"యెషయా 5:18"},
{id:395,topic:"అపరాధము",title:"సహవాసము ద్వారా అపరాధము",text:"\"ప్రధాన యాజకులు లాజరును కూడా చంపుటకు ప్రణాళికలు వేసారు.\"",ref:"యోహాను 12:10-11"},
{id:396,topic:"హస్తము",title:"దేవుని చేతులలో",text:"\"నన్ను నిత్యుని చేతులలో పడనివ్వండి, మనుష్యుల చేతులలో పడనివ్వకుడి.\"",ref:"1 దినవృత్తాంతములు 21:13"},
{id:397,topic:"హస్తము",title:"దీర్ఘ చేరిక",text:"\"నా హస్తము విమోచించలేనంతగా పొట్టిదైందా?\"",ref:"యెషయా 50:2"},
{id:398,topic:"హస్తము",title:"నాకు చాపబడిన హస్తము",text:"\"అప్పుడు నేను చూచాను, అక్కడ నాకు ఒక హస్తము చాపబడి ఉంది.\"",ref:"యెహెజ్కేలు 2:9"},
{id:399,topic:"హస్తము",title:"నా చేతులను చూడుడి",text:"\"ఇదిగో, నేను నిన్ను నా అరచేతులపై చెక్కాను.\"",ref:"యెషయా 49:15-16"},
{id:400,topic:"హస్తము",title:"వారు ఆయనను గుర్తించారు!",text:"\"వారి కళ్ళు తెరవబడి, వారు ఆయనను గుర్తించారు!\"",ref:"లూకా 24:31"},
{id:401,topic:"కఠిన హృదయము",title:"కఠిన సహోదరులు",text:"\"వారు ... అతనిని ఒక గుండంలో వేసారు. ... వారు కూర్చొని రొట్టె తిన్నారు.\"",ref:"ఆదికాండము 37:24-25"},
{id:402,topic:"కఠిన హృదయము",title:"సొరకాయ పట్ల జాలి",text:"\"నీవు పని చేయని, నీవు పెరగని ఆ సొరకాయ పట్ల జాలి చూపావు ... నేను నీనెవెను కాపాడకూడదా?\"",ref:"యోనా 4:10-11"},
{id:403,topic:"కఠిన హృదయము",title:"కళ్ళు కట్టిన రాజు",text:"\"ఎందుకంటే గోనె ధరించినవారు ఎవరూ రాజు ద్వారము ప్రవేశించకూడదు.\"",ref:"ఎస్తేరు 4:2"},
{id:404,topic:"స్వస్థత",title:"మనము ఎవరి వైపు తిరగాలి?",text:"\"ఆసా తన వైద్యులను ఆశ్రయించాడు, నిత్యుని కాదు.\"",ref:"2 దినవృత్తాంతములు 16:12"},
{id:405,topic:"స్వస్థత",title:"తప్పుడు వైద్యుడు",text:"అహజ్యా తన పైకప్పు నుండి పడినప్పుడు, తన కోలుకోలుకునే గూర్చి బయల్జెబూబును అడగమని సందేశకులను పంపాడు.",ref:"2 రాజులు 1:2-8"},
{id:406,topic:"స్వస్థత",title:"ఉపయోగకరమైన శ్రమ",text:"మాల్టా ద్వీపములో విడిచిపెట్టబడిన పౌలు, వెంటనే అనారోగ్యులను స్వస్థపరచు ఉపయోగకరమైన శ్రమలో నిమగ్నమయ్యాడు.",ref:"అపొస్తలుల కార్యములు 28:8-9"},
{id:407,topic:"స్వస్థత",title:"ఆయన ఇచ్చు శక్తి",text:"కొందరు ప్రజలు యేసును కేవలము తాకుట ద్వారా తమ అనారోగ్యముల నుండి స్వస్థత పొందుతారని నమ్మారు.",ref:"లూకా 6:19"},
{id:408,topic:"స్వస్థత",title:"తీయని జలములు",text:"ప్రభువు మోషేకు ఒక చెట్టును చూపించాడు, అది నీటిలో వేయబడినప్పుడు అది తీయనిగా మారింది.",ref:"నిర్గమకాండము 15:23-25"},
{id:409,topic:"స్వస్థత",title:"అంగీకరింపబడిన సుంకరి",text:"తన పాపములను అంగీకరించి, తనకు తాను ఏ స్వ-నీతిని క్లెయిమ్ చేయని సుంకరి, దేవునిచే అంగీకరింపబడినవాడుగా తన ఇంటికి తిరిగి వెళ్ళాడు.",ref:"లూకా 18:9-14"},
{id:410,topic:"వినుట",title:"వారు ఏమి విన్నారు",text:"\"ఆకాశము నుండి ఒక స్వరము వచ్చింది. ... జన సమూహము దానిని విని, అది ఉరుము అన్నారు.\"",ref:"యోహాను 12:28-29"},
{id:411,topic:"వినుట",title:"చెవులు ఝుమ్మనిపించు",text:"\"నేను ఇశ్రాయేలులో ఒక కార్యము చేయబోవుచున్నాను, దానిని విను ప్రతివాని రెండు చెవులు ఝుమ్మనిపిస్తాయి.\"",ref:"1 సమూయేలు 3:10-11"},
{id:412,topic:"వినుట",title:"నిరుత్సాహపరచు మాటలు",text:"\"దయచేసి నీ సేవకులతో అరామాయిక్ భాషలో మాట్లాడుము.\"",ref:"యెషయా 36:11"},
{id:413,topic:"పరలోకము",title:"పరలోకము వైపు కిటికీలు",text:"\"నీవు నావలో కిటికీలను, పైకప్పు నుండి పద్దెనిమిది అంగుళముల దూరములో పెట్టవలెను.\"",ref:"ఆదికాండము 6:16"},
{id:414,topic:"పరలోకము",title:"పరలోకమునకు సోపానములు",text:"యాకోబు ఆ నిర్జన, అసౌకర్య స్థలములో \"పరలోకమునకు సోపానములు\" కనుగొన్నాడు.",ref:"ఆదికాండము 28:11"},
{id:415,topic:"సహాయము",title:"అపరిచితుడు, వలసవాది",text:"ఇత్తై, \"నా ప్రభువైన రాజు మరణములో గానీ, జీవితములో గానీ ఎక్కడ ఉన్నా, అక్కడ నీ సేవకుడు కూడా ఉంటాడు\" అన్నాడు.",ref:"2 సమూయేలు 15:19,21"},
{id:416,topic:"సహాయము",title:"ఆమె ఏ ఉపకారములు అడగలేదు",text:"షూనేము స్త్రీ, \"నేను నా స్వజనుల మధ్య సురక్షితముగా ఉన్నాను\" అన్నది.",ref:"2 రాజులు 4:13"},
{id:417,topic:"సహాయము",title:"క్రైస్తవుని చొరవ",text:"\"అయ్యా, నీరు కలకలపడినప్పుడు నన్ను కొలనులోనికి దించుటకు నాకు మనిషి లేడు.\"",ref:"యోహాను 5:7"},
{id:418,topic:"సహాయము",title:"శిష్యత్వపు ముద్ర",text:"ప్రారంభ క్రైస్తవ సమాజములో పరస్పరత్వము శిష్యత్వపు ముద్ర, ఒక సాధారణ నిధి నుండి పంపిణి \"ప్రతి మనిషికి అతని అవసరము ప్రకారము\" జరిగింది.",ref:"అపొస్తలుల కార్యములు 4:35"},
{id:419,topic:"సహాయము",title:"అతను పూర్తి చేసాడు",text:"మంచి సమరయుడు బాధితుని గాయమును కట్టుట మాత్రమే కాదు, అతనిని ఒక దారి పక్క సత్రమునకు తీసుకొని వెళ్ళాడు.",ref:"లూకా 10:33-35"},
{id:420,topic:"సహాయము",title:"అతని వలె ఎవరూ లేరు",text:"\"మీ సంక్షేమము పట్ల నిజమైన ఆసక్తి కలిగిన అతని వలె నాకు ఎవరూ లేరు.\"",ref:"ఫిలిప్పీయులు 2:20,22"},
{id:421,topic:"వారసత్వము",title:"జీవ జలముల మూలము",text:"ఇస్సాకు \"తన తండ్రి అబ్రహాము కాలములో త్రవ్విన నీటి బావులను తిరిగి త్రవ్వాడు.\"",ref:"ఆదికాండము 26:18"},
{id:422,topic:"వారసత్వము",title:"తండ్రి వారసత్వము",text:"\"నేను నీ తండ్రి అబ్రహాము దేవుడను: భయపడకుము, నేను నీతో ఉన్నాను.\"",ref:"ఆదికాండము 26:24"},
{id:423,topic:"వారసత్వము",title:"నా పితరుల వారసత్వము",text:"నాబోతు, \"నేను నా పితరుల వారసత్వమును నీకు ఇచ్చుట ప్రభువు నిషేధించును గాక\" అన్నాడు.",ref:"1 రాజులు 21:3"},
{id:424,topic:"వారసత్వము",title:"ఒక తరము నుండి మరొక తరమునకు",text:"\"మీరు శ్రమ పడని పంటను కోయుటకు నేను మిమ్ములను పంపాను.\"",ref:"యోహాను 4:38"},
{id:425,topic:"వారసత్వము",title:"అర్హమైన వారసత్వము",text:"\"మీరు అపొస్తలుల, ప్రవక్తల పునాదిపై నిర్మించబడ్డారు.\"",ref:"ఎఫెసీయులు 2:20"},
{id:426,topic:"చరిత్ర",title:"చరిత్రలో దేవుడు",text:"\"ఆకాశపు నక్షత్రములు సిసెరాకు వ్యతిరేకముగా పోరాడాయి.\"",ref:"న్యాయాధిపతులు 5:20"},
{id:427,topic:"పరిశుద్ధత",title:"పవిత్రమైనదానిని అపవిత్రము చేయుట",text:"బేల్షజారు తన విందులో దేవాలయ పాత్రల నుండి మద్యపానము చేసాడు.",ref:"దానియేలు 5"},
{id:428,topic:"పరిశుద్ధత",title:"పవిత్ర భూమి",text:"\"నీవు నిలిచియున్న స్థలము పవిత్ర భూమి.\"",ref:"నిర్గమకాండము 3:4-5"},
{id:429,topic:"ఇల్లు",title:"పరిచయ జ్ఞాపికలు",text:"రాహేలు \"తన తండ్రి విగ్రహములను దొంగిలించింది.\"",ref:"ఆదికాండము 31:19"},
{id:430,topic:"ఇల్లు",title:"మనుష్యుల క్రొత్త కుటుంబము",text:"\"నీవు, నీ సమస్త కుటుంబము ఓడలోనికి ప్రవేశించుము.\"",ref:"ఆదికాండము 7:1"},
{id:431,topic:"ఇల్లు",title:"నీ కుటుంబము దగ్గరకు వెళ్ళుము",text:"\"నీ ఇంటికి, నీ కుటుంబము దగ్గరకు వెళ్ళి, ప్రభువు నీ కొరకు ఏమి చేసాడో వారికి చెప్పుము.\"",ref:"మార్కు 5:19"},
{id:432,topic:"ఇల్లు",title:"ఇంటిలో క్రైస్తవులు",text:"\"మీరు వివాహిత స్త్రీలు మీ భర్తలకు అనుగుణ్యము చేసుకోవలెను.\"",ref:"1 పేతురు 3:1-2"},
{id:433,topic:"ఇల్లు",title:"ఇంటి ప్రభావములు",text:"\"[యోసేపు, మరియ, వారి నవజాత శిశువు] గలిలయకు, తమ స్వంత పట్టణము నజరేతుకు తిరిగి వెళ్ళారు.\"",ref:"లూకా 2:39"},
{id:434,topic:"ఇల్లు",title:"ఇంటి క్రమశిక్షణలు",text:"\"ఇప్పుడు అతని తల్లిదండ్రులు ప్రతి సంవత్సరము పస్కా పండుగకు యెరూషలేముకు వెళ్ళేవారు.\"",ref:"లూకా 2:41"},
{id:435,topic:"ఇల్లు",title:"విశ్వాసపు వారసత్వము",text:"\"నీ అమ్మమ్మ లోయి, నీ తల్లి యునీకేలో జీవించిన విశ్వాసము.\"",ref:"2 తిమోతికి 1:5"},
{id:436,topic:"ఇల్లు",title:"నిత్య అతిథి",text:"\"ఇదిగో, నేను తలుపు దగ్గర నిలిచి తట్టుచున్నాను.\"",ref:"ప్రకటన 3:20"},
{id:437,topic:"ఇల్లు",title:"కుటుంబ బలిపీఠము",text:"పౌలు ఫిలేమోనుకు, \"నీ ఇంటిలో సమావేశమయ్యే సంఘమునకు\" ఒక ఉత్తరము పంపాడు.",ref:"ఫిలేమోనుకు 2"},
{id:438,topic:"ఇంటి కలహము",title:"కుటుంబ కలహమును నివారించుట",text:"\"మనము సహోదరులము గనుక మన మధ్య జగడము ఉండకూడదు.\"",ref:"ఆదికాండము 13:8"},
{id:439,topic:"ఇల్లు",title:"ఖాళీ భవనములు",text:"\"అనేక భవనములు నిర్జనముగా, భవ్యముగా, విశాలముగా — ఖాళీగా ఉంటాయి!\"",ref:"యెషయా 5:9"},
{id:440,topic:"నిరీక్షణ",title:"నిరీక్షణ ఉదయము",text:"యాకోబు, \"యోసేపు లేడు, సిమియోను లేడు, మీరు బెన్యామీనును తీసుకొని వెళ్తారు: ఇవన్నీ నాపైకి వచ్చాయి\" అన్నాడు.",ref:"ఆదికాండము 42:36"},
{id:441,topic:"నిరీక్షణ",title:"మైనారిటీ, మెజారిటీ నివేదికలు",text:"కాలేబు, \"మనము వెంటనే పైకి వెళ్ళి దానిని స్వాధీనము చేసుకొందము\" అన్నాడు.",ref:"సంఖ్యాకాండము 13:30"},
{id:442,topic:"నిరీక్షణ",title:"హృదయము కోల్పోకుడి",text:"\"ఇప్పుడు నేను మిమ్ములను హృదయము కోల్పోవద్దని వేడుకొనుచున్నాను.\"",ref:"అపొస్తలుల కార్యములు 27:20,22-23"},
{id:443,topic:"నిరీక్షణ",title:"యేసు తెచ్చు నిరీక్షణ",text:"పేతురు, \"నీ మాట ప్రకారము నేను వలను దించుతాను\" అన్నాడు.",ref:"లూకా 5:5"},
{id:444,topic:"నిరీక్షణ",title:"నిరీక్షణ అంటే ఏమిటి",text:"\"మీరు చూడగల నిరీక్షణ అసలు నిరీక్షణ కాదు.\"",ref:"రోమీయులు 8:24"},
{id:445,topic:"నిరీక్షణ",title:"నిరాశకు ఆవల",text:"\"ఇదిగో, శీతకాలము గడిచిపోయెను, వర్షము తీరిపోయెను. పుష్పములు భూమిపై కనబడుచున్నవి.\"",ref:"పరమగీతము 2:11-12"},
{id:446,topic:"నిరీక్షణ",title:"ఈ ఎముకలు బ్రతుకునా?",text:"\"ఈ ఎముకలు బ్రతుకునా?\"",ref:"యెహెజ్కేలు 37:3"},
{id:447,topic:"ఆతిథ్యము",title:"మీరు స్వాగతము",text:"\"మీరు స్వాగతము ... కానీ బహిరంగ ప్రదేశములో రాత్రి గడపకుడి.\"",ref:"న్యాయాధిపతులు 19:15-16,20"},
{id:448,topic:"ఆతిథ్యము",title:"ఎరుగని దేవదూతలు",text:"\"అపరిచితులను ఆతిథ్యము చేయుట మరువకుడి: తద్వారా కొందరు తెలియకుండానే దేవదూతలను ఆతిథ్యము చేసారు.\"",ref:"హెబ్రీయులు 13:2"},
{id:449,topic:"ఆతిథ్యము",title:"తిరిగి వచ్చు అలలు",text:"\"ప్రభువు ఎలీయా ద్వారా పలికిన మాట ప్రకారము పిండి పాత్ర వృథా కాలేదు, నూనె కూజా క్షీణించలేదు.\"",ref:"1 రాజులు 17:16"},
{id:450,topic:"వినయము",title:"వినయమైన ఆరంభములు",text:"సౌలు సామానుల మధ్య దాగి ఉన్నట్లు కనుగొనబడ్డాడు.",ref:"1 సమూయేలు 10:22"},
{id:451,topic:"వినయము",title:"దావీదు గ్రహించినది",text:"దావీదు, \"నా సొంత కుమారుడే నా ప్రాణము తీయ చూచుచున్నాడు; ఇతడు ఇంకా ఎంత ఎక్కువ!\" అన్నాడు.",ref:"2 సమూయేలు 16:11"},
{id:452,topic:"వినయము",title:"అతను రాజ్యమును కోల్పోయాడు",text:"నెబుకద్నెజరు \"ఎద్దు వలె గడ్డి తిన్నాడు, అతని శరీరము ఆకాశపు మంచుతో తడిసింది.\"",ref:"దానియేలు 4:33-34"},
{id:453,topic:"వినయము",title:"సాంఘిక ఎక్కువరి కొరకు సలహా",text:"\"వినయుడైన మనిషి అస్పష్ట స్థలమును తీసుకోవడము ద్వారా, యజమాని అతనిని మరింత ప్రముఖ కుర్చీలో కూర్చోమని అడగవచ్చు.\"",ref:"లూకా 14:7-10"},
{id:454,topic:"వినయము",title:"ప్రభువా, నేనా?",text:"ప్రతి ఒక్కడు, \"ప్రభువా, నేనా?\" అని స్పందించాడు.",ref:"మత్తయి 26:22"},
{id:455,topic:"ఆకలి",title:"అంతర్గత ఆకలి",text:"\"మీరు తింటారు, కానీ తృప్తి పొందరు, మీ అంతర్గత భాగములలో ఆకలి ఉంటుంది.\"",ref:"మీకా 6:14"},
{id:456,topic:"ఆకలి",title:"పాగన్ల లక్ష్యము",text:"\"పాగన్లు అన్నింటినీ జీవితపు లక్ష్యముగా చేసుకుంటారు.\"",ref:"మత్తయి 6:31-32"},
{id:457,topic:"ఆకలి",title:"అమూల్యమైన మిగిలిన ముక్కలు",text:"\"మిగిలిన ముక్కలను సమకూర్చుడి, ఏదీ నశించకూడదు.\"",ref:"యోహాను 6:12"},
{id:458,topic:"ఆకలి",title:"మరణము కంటే దురదృష్టము",text:"\"మేము ఐగుప్తు దేశములో ... మాంసపు కుండల దగ్గర కూర్చొని, నిండుగా రొట్టె తిన్నప్పుడు చనిపోయి ఉంటే బాగుండేది.\"",ref:"నిర్గమకాండము 16:3"},
{id:459,topic:"సోమరితనము",title:"సోమరి విషాదము",text:"\"దావీదు యెరూషలేములోనే ఉండిపోయాడు.\"",ref:"2 సమూయేలు 11:1"},
{id:460,topic:"సోమరితనము",title:"అందరి వ్యాపారమును చూచుట",text:"\"మీలో కొందరు సోమరితనము చేస్తూ, బిజీగా ఉండకుండా బిజీబాడీలుగా ఉన్నారు.\"",ref:"2 థెస్సలొనీకయులు 3:11"},
{id:461,topic:"విగ్రహారాధన",title:"కఠిన ఎగతాళి",text:"\"అతను ఒక దేవతను చేసి ఆరాధిస్తాడు, ఒక చెక్కిన విగ్రహమును చేసి దాని ముందు సాష్టాంగపడతాడు.\"",ref:"యెషయా 44:12-17"},
{id:462,topic:"విగ్రహారాధన",title:"అబద్ధ దేవతలను అనుసరించుట",text:"\"వారు అబద్ధ విగ్రహములను అనుసరించి, అబద్ధముగా మారారు.\"",ref:"2 రాజులు 17:15"},
{id:463,topic:"విగ్రహారాధన",title:"వ్యర్థ దేవతలు",text:"\"కానీ నా ప్రజలు తమ మహిమను ఒక వ్యర్థ వస్తువుతో మార్చుకొన్నారు.\"",ref:"యిర్మీయా 2:11"},
{id:464,topic:"విగ్రహారాధన",title:"మనుష్యులచే చేయబడినవి",text:"\"వారి విగ్రహములు దోసకాయ మొక్క వలె, మాట్లాడలేవు.\"",ref:"యిర్మీయా 10:5"},
{id:465,topic:"విగ్రహారాధన",title:"వెండి, బంగారు దేవతలు",text:"\"అత్యాశ విగ్రహారాధన.\"",ref:"కొలొస్సయులు 3:5"},
{id:466,topic:"విగ్రహారాధన",title:"వ్యర్థ దేవతలను విడిచిపెట్టుట",text:"\"ఆ ప్రజల దేవతలు తమ ప్రజలను నీ చేతి నుండి రక్షించుకోలేకపోయినప్పుడు, నీవు వాటిని ఎందుకు వెతికావు?\"",ref:"2 దినవృత్తాంతములు 25:14-16"},
{id:467,topic:"నిత్యత్వము",title:"మనిషికి నిరీక్షణ ఏమిటి?",text:"\"ఒక చెట్టు నరకబడినప్పుడు నిరీక్షణ ఉంది ... కానీ మనిషి చనిపోయి వెళ్ళిపోతాడు ... అతను ఎక్కడ?\"",ref:"యోబు 14:7-10"},
{id:468,topic:"నిత్యత్వము",title:"స్పష్టమైన పిలుపు",text:"\"నేను వారికి నిత్య జీవితము ఇస్తాను.\"",ref:"యోహాను 10:28"},
{id:469,topic:"నిత్యత్వము",title:"అద్దములో ప్రతిబింబములు",text:"\"ఇప్పుడు మనము అద్దములో కేవలము ప్రతిబింబములు చూస్తాము, కానీ అప్పుడు మనము ముఖాముఖి చూస్తాము.\"",ref:"1 కొరింథీయులు 13:12"},
{id:470,topic:"అవతారము",title:"శరీరము ధరించిన వాక్యము",text:"\"వాక్యము శరీరము ధరించి, మన మధ్య నివసించింది.\"",ref:"యోహాను 1:14"},
{id:471,topic:"అవతారము",title:"దైవిక అవును",text:"\"దైవిక 'అవును' చివరకు ఆయనలో ప్రతిధ్వనించింది.\"",ref:"2 కొరింథీయులు 1:19-20"},
{id:472,topic:"అవతారము",title:"బహిరంగ రహస్యము",text:"\"దేవుడు మనపై తన కృపను అంత సమృద్ధిగా కుమ్మరించాడు.\"",ref:"ఎఫెసీయులు 1:9-10"},
{id:473,topic:"అవతారము",title:"సత్యమును వెల్లడించువాడు",text:"\"ఒక మనిషి ప్రభువు వైపు తిరిగినప్పుడు, ఆ తెర తీసివేయబడుతుంది.\"",ref:"2 కొరింథీయులు 3:15-16"},
{id:474,topic:"అవతారము",title:"దేవుని త్యాగపూర్వక ప్రేమ",text:"\"దేవాలయపు తెర పైనుండి క్రింద వరకు రెండుగా చీలిపోయింది.\"",ref:"మత్తయి 27:51"},
{id:475,topic:"ప్రభావము",title:"వారు అతను ఎగతాళి చేస్తున్నాడని భావించారు",text:"\"అతని అల్లుళ్ళు అతను కేవలము ఎగతాళి చేస్తున్నాడని భావించారు.\"",ref:"ఆదికాండము 19:14"},
{id:476,topic:"ప్రభావము",title:"కలుషిత ప్రభావములు",text:"\"అతని సహోదరుల హృదయము అతని హృదయము వలె క్షీణించకూడదు.\"",ref:"ద్వితీయోపదేశము 20:8"},
{id:477,topic:"ప్రభావము",title:"విశ్వాసము ద్వారా అతను ఇంకా మాట్లాడుతాడు",text:"\"అతను చనిపోయినప్పటికీ ... విశ్వాసము ద్వారా అతను ఇప్పటికీ మనతో మాట్లాడుతున్నాడు.\"",ref:"హెబ్రీయులు 11:4"},
{id:478,topic:"ప్రభావము",title:"మాటలతో మాత్రమే కాదు",text:"జక్కయ్య సహజముగా తాను మోసము చేసిన వారందరికీ పరిహారము చేయుటకు ప్రతిపాదించాడు.",ref:"లూకా 19:8"},
{id:479,topic:"ప్రభావము",title:"స్వస్థత నీడలు",text:"\"పేతురు నీడ వారిపై పడినను\" వారు స్వస్థత పొందుటకు ఉంచారు.",ref:"అపొస్తలుల కార్యములు 5:15"},
{id:480,topic:"ప్రభావము",title:"పర్వతముల స్వరము",text:"\"పర్వతముపై నీకు చూపబడిన నమూనా ప్రకారము సమస్తమును చేయుట చూసుకో.\"",ref:"హెబ్రీయులు 8:5"},
{id:481,topic:"బోధ",title:"దేవుని తరగతి గది",text:"\"అతడు ఆరు సంవత్సరములు దేవుని మందిరములో దాగియుండెను.\"",ref:"2 దినవృత్తాంతములు 22:12"},
{id:482,topic:"బోధ",title:"అర్హమైన ఉదాహరణ",text:"ఎజ్రా \"దేవుని ధర్మశాస్త్రమును అధ్యయనము చేయుటకు, దానిని పాటించుటకు, ఇశ్రాయేలులో దాని నియమములు, నిబంధనలను బోధించుటకు తన హృదయమును నిలిపాడు.\"",ref:"ఎజ్రా 7:10"},
{id:483,topic:"బోధ",title:"మార్గదర్శనము అవసరము",text:"\"నాకు ఎవరైనా అర్థము చెప్పకపోతే ఎలా చేయగలను?\"",ref:"అపొస్తలుల కార్యములు 8:31"},
{id:484,topic:"బోధ",title:"అర్థమయ్యే మాటలు",text:"\"సంఘములో నేను ఇతరుల బోధ కొరకు నా స్వంత మనస్సుతో ఐదు మాటలు చెప్పుట ఇష్టపడతాను.\"",ref:"1 కొరింథీయులు 14:18-19"},
{id:485,topic:"బోధ",title:"ఉపాధ్యాయులకు కృతజ్ఞత",text:"\"యెహోయాషు యాజకుడు యెహోయాదా అతనికి బోధించినందున, తన సమస్త దినములలో ప్రభువు కళ్ళలో సరైనది చేసాడు.\"",ref:"2 రాజులు 12:2"},
{id:486,topic:"బోధ",title:"సమూయేలును తీసుకొని రమ్ము",text:"సౌలు, \"సమూయేలును తీసుకొని రమ్ము\" అన్నాడు.",ref:"1 సమూయేలు 28:11"},
{id:487,topic:"బోధ",title:"వారు ప్రభువును తెలియరు",text:"\"వారి తరువాత ప్రభువును, ఇశ్రాయేలుపై ఆయన చేసిన కార్యములను ఎరుగని మరొక తరము లేచింది.\"",ref:"న్యాయాధిపతులు 2:7,10"},
{id:488,topic:"బోధ",title:"ఏదో తప్పు జరిగింది",text:"హోఫ్నీ, ఫీనెహాసులు \"నిరుపయోగ మనుష్యులు; వారికి ప్రభువు పట్ల గౌరవము లేదు.\"",ref:"1 సమూయేలు 2:12"},
{id:489,topic:"బోధ",title:"దైవిక పాఠశాల గురువు",text:"\"అతని దేవుడు అతనికి సరిగా బోధించి నేర్పుతాడు.\"",ref:"యెషయా 28:24-26"},
{id:490,topic:"బోధ",title:"పది గంటల విద్యార్థులు",text:"\"మీరు ఇతరులకు బోధించవలసిన సమయములో, దేవుని ప్రకటన యొక్క ఎబిసి మీకు మరల చెప్పుటకు ఉపాధ్యాయులు మీకు అవసరము.\"",ref:"హెబ్రీయులు 5:12"},
{id:491,topic:"బోధ",title:"జ్ఞాన లోపము",text:"\"నా ప్రజలు జ్ఞాన లోపముచే చనిపోతున్నారు.\"",ref:"హోషేయ 4:6"},
{id:492,topic:"యథార్థత",title:"కొనలేని మనిషి",text:"బిలాము, \"బాలాకు నాకు తన ఇంటిని వెండి, బంగారుతో నింపినప్పటికీ, నా దేవుడైన నిత్యుడు ఆజ్ఞాపించిన దానికి మించి ఒక్క విషయము కూడా చేయలేను\" అన్నాడు.",ref:"సంఖ్యాకాండము 22:17-18"},
{id:493,topic:"యథార్థత",title:"ధర గానీ, అనుగ్రహము గానీ కాదు",text:"సైనికుడు, \"రాజు కుమారునికి వ్యతిరేకముగా నా చేతిలో వెయ్యి షెకెలు వెండి పొందినప్పటికీ, నేను నా చేయి వేయను\" అన్నాడు.",ref:"2 సమూయేలు 18:11-12"},
{id:494,topic:"యథార్థత",title:"ఒక్కడి మైనారిటీ",text:"మీకాయా, \"ప్రభువు జీవము తోడుగా, ప్రభువు నాతో ఏమి చెప్పునో, అదే నేను మాట్లాడుతాను\" అన్నాడు.",ref:"1 రాజులు 22:14"},
{id:495,topic:"యథార్థత",title:"దూర దేశములో",text:"ఐగుప్తులో యువ యోసేపు నైతిక ఆరోగ్యమునకు ప్రసిద్ధి చెందాడు.",ref:"ఆదికాండము 39:4"},
{id:496,topic:"యథార్థత",title:"అంతర్గత విలువ",text:"\"వారి గర్వము బాహ్య ప్రదర్శనలో ఉంది, అంతర్గత విలువలో కాదు.\"",ref:"2 కొరింథీయులు 5:12"},
{id:497,topic:"యథార్థత",title:"స్పష్టమైన వివరణలు",text:"\"సత్య ప్రకటన ద్వారా దేవుని దృష్టిలో ప్రతి మనిషి మనస్సాక్షికి మమ్మును సిఫారసు చేసుకొనుట.\"",ref:"2 కొరింథీయులు 4:2"},
{id:498,topic:"మధ్యవర్తిత్వము",title:"ఎల్లప్పుడూ నా ప్రార్థనలలో",text:"\"మీరు ఎల్లప్పుడూ నా ప్రార్థనలలో ఉన్నారని మీకు భరోసా ఇచ్చుచున్నాను.\"",ref:"రోమీయులు 1:9"},
{id:499,topic:"మధ్యవర్తిత్వము",title:"ప్రార్థనలో కలిపినవి",text:"\"ప్రార్థనలో మీ సహకారము నాకు ఇవ్వుడి.\"",ref:"2 కొరింథీయులు 1:11"},
{id:500,topic:"మధ్యవర్తిత్వము",title:"అతను ఒంటరిగా లేడు",text:"\"సంఘము అతని తరఫున దేవునికి దీర్ఘమైన, ఉత్సాహపూర్వక ప్రార్థన అర్పించింది.\"",ref:"అపొస్తలుల కార్యములు 12:5"},
{id:501,topic:"మధ్యవర్తిత్వము",title:"దేవుడు అబ్రహామును జ్ఞాపకము చేసుకొన్నాడు",text:"\"దేవుడు అబ్రహామును జ్ఞాపకము చేసుకొన్నాడు\" — లోతు అర్హుడని కాదు, అబ్రహాము మధ్యవర్తిత్వము కారణముగా.",ref:"ఆదికాండము 19:29"},
{id:502,topic:"మధ్యవర్తిత్వము",title:"నీవు క్షమించిన యెడల",text:"మోషే, \"నీవు వారి పాపమును క్షమించిన యెడల—; క్షమించకపోతే, నీవు వ్రాసిన గ్రంథములో నుండి నన్ను తుడిచివేయుము\" అని వేడుకొన్నాడు.",ref:"నిర్గమకాండము 32:32"},
{id:503,topic:"మధ్యవర్తిత్వము",title:"హృదయము మీద మోయబడెను",text:"\"ఆరోను ... ఇశ్రాయేలు పిల్లల పేర్లను ... తన హృదయముపై ... మోస్తాడు.\"",ref:"నిర్గమకాండము 28:29"},
{id:504,topic:"అసూయ",title:"అసూయకు బలి",text:"సారా అసూయ అనే క్షయవ్యాధికి బలి అయింది.",ref:"ఆదికాండము 16:1-6"},
{id:505,topic:"అసూయ",title:"ప్రభువు ఏమి కోరును",text:"మిరియాము, \"ప్రభువు నిజముగా మోషే ద్వారా మాత్రమే మాట్లాడాడా?\" అన్నది.",ref:"సంఖ్యాకాండము 12:2"},
{id:506,topic:"అసూయ",title:"సౌలు అసూయ",text:"స్త్రీలు, \"సౌలు తన వేలను చంపాడు, కానీ దావీదు తన పది వేలను\" అని పాడారు. సౌలు కోపగించాడు.",ref:"1 సమూయేలు 18:7,9"},
{id:507,topic:"అసూయ",title:"ఫిర్యాదుకు సందర్భము",text:"షద్రకు, మేషాకు, అబేద్నెగోల అనుగ్రహ స్థానమునకు ఎదగడము వలన అసూయపడిన కల్దీయులు వారిపై ఫిర్యాదు చేసారు.",ref:"దానియేలు 3:1-12"},
{id:508,topic:"అసూయ",title:"అతను ఎక్కువ కావాలి",text:"యోహాను, \"ఆయన ఎక్కువ ఎక్కువ అవ్వాలి, నేను తక్కువ తక్కువ\" అన్నాడు.",ref:"యోహాను 3:26,29-30"},
{id:509,topic:"ఆనందము",title:"కిటికీ గూటి దృశ్యము",text:"మీకాలు కిటికీ ద్వారా దావీదును చూచి తృణీకరించింది. దావీదు, \"నేను ప్రభువు ముందు ఆడుతాను\" అన్నాడు.",ref:"2 సమూయేలు 6:16,21"},
{id:510,topic:"ఆనందము",title:"దేవదూతలు ఆనందిస్తారు",text:"ఒక పాపి పశ్చాత్తాపపడినప్పుడు పరలోకములో దేవదూతలు ఆనందిస్తారు.",ref:"లూకా 15:8-10"},
{id:511,topic:"ఆనందము",title:"తన మార్గములో ఆనందిస్తూ",text:"మన్నెవాడు \"తన మార్గములో ఆనందిస్తూ వెళ్ళాడు.\"",ref:"అపొస్తలుల కార్యములు 8:39"},
{id:512,topic:"ఆనందము",title:"వరము, ఆశీర్వాదము",text:"\"మనుష్యుల కొరకు ... తిని, త్రాగి, శ్రమపడుచుండగా సంతోషముగా ఉండుట కంటే మంచిది నేను కనుగొనలేదు.\"",ref:"ప్రసంగి 3:12-13"},
{id:513,topic:"ఆనందము",title:"ఆనందమునకు అపరిచితులు",text:"\"ఈ మనుష్యులు క్రొత్త ద్రాక్షారసముతో నిండినవారు.\"",ref:"అపొస్తలుల కార్యములు 2:13"},
{id:514,topic:"తీర్పు",title:"చెట్ల ఉపమానము",text:"\"పొలములోని సమస్త చెట్లు, నేను ప్రభువునని ... తెలుసుకుంటాయి.\"",ref:"యెహెజ్కేలు 17:24"},
{id:515,topic:"తీర్పు",title:"లెక్క అడిగే గడియ",text:"ప్రతి పాపము తరువాత అనివార్యముగా ఒక లెక్క అడిగే గడియ వస్తుంది.",ref:"నిర్గమకాండము 2:13-14"},
{id:516,topic:"తీర్పు",title:"దావీదు ఆగ్రహము",text:"దావీదు ఆగ్రహముతో, ఆ ధనవంతుడు నిశ్చయముగా చనిపోవాలని చెప్పాడు.",ref:"2 సమూయేలు 12:1-6"},
{id:517,topic:"తీర్పు",title:"అది అలాగే జరిగింది",text:"\"నాబోతు రక్తమును కుక్కలు నాకిన స్థలములో, కుక్కలు నీ రక్తమును నాకుతాయి.\" మరియు అది అలాగే జరిగింది.",ref:"1 రాజులు 21:19"},
{id:518,topic:"తీర్పు",title:"త్రాడు, సీసపు తూనిక",text:"\"నేను యెరూషలేముపై సమరయ త్రాడును, అహాబు ఇంటి సీసపు తూనికను చాస్తాను.\"",ref:"2 రాజులు 21:13"},
{id:519,topic:"తీర్పు",title:"దేవుని సీసపు త్రాడు",text:"\"నేను నా ప్రజల ఇశ్రాయేలు మధ్య సీసపు త్రాడును వేస్తాను.\"",ref:"ఆమోసు 7:8"},
{id:520,topic:"తీర్పు",title:"విరిగిన కూజా",text:"యిర్మీయా ఒక మట్టి కూజాను మరమ్మతు చేయలేనంతగా విరిచి, అదే విధముగా దేవుడు పాపిష్ఠి ప్రజలతో వ్యవహరిస్తాడని చెప్పాడు.",ref:"యిర్మీయా 19:1-13"},
{id:521,topic:"తీర్పు",title:"చీకటి రహస్యములు వెలుగులోనికి",text:"\"ప్రభువు చీకటి రహస్యములను వెలుగులోనికి తెచ్చుటకు ... వస్తాడు.\"",ref:"1 కొరింథీయులు 4:5"},
{id:522,topic:"తీర్పు",title:"దూలము, రంపపు పొట్టు",text:"\"నీ సహోదరుని కంటిలో రంపపు పొట్టును చూచి, నీ స్వంత కంటిలో పెద్ద దూలమును ఎన్నడూ ఆలోచించని, ఎందుకు చూస్తావు?\"",ref:"లూకా 6:41-42"},
{id:523,topic:"తీర్పు",title:"గుర్తు పెట్టని సమాధులు",text:"పరిసయ్యులను యేసు, ప్రజలు తెలియకుండా నడచు గుర్తు పెట్టని సమాధులతో పోల్చాడు.",ref:"లూకా 11:43-44"},
{id:524,topic:"తీర్పు",title:"బాహ్య తీర్పు",text:"\"మనిషి నుండి బయటకు వచ్చునది, అదే మనిషిని అపవిత్రము చేస్తుంది.\"",ref:"మార్కు 7:21-22"},
{id:525,topic:"తీర్పు",title:"ప్రశ్నించుట",text:"\"మీరు గానీ, ఏ మానవ న్యాయస్థానము గానీ నన్ను ప్రశ్నించుట నాకు చాలా తక్కువ విషయము.\"",ref:"1 కొరింథీయులు 4:3-4"},
{id:526,topic:"తీర్పు",title:"తుది అప్పీలు",text:"\"నేను కైసరుకు అప్పీలు చేస్తాను.\"",ref:"అపొస్తలుల కార్యములు 25:11"},
{id:527,topic:"తీర్పు",title:"జీవించు హక్కు",text:"\"ఇప్పుడు గొడ్డలి చెట్ల వేరుపై వేయబడింది.\"",ref:"మత్తయి 3:10"},
{id:528,topic:"న్యాయము",title:"న్యాయపు త్రాసు",text:"\"దేవుడు నా జీవితమునకు న్యాయపు త్రాసు తీసుకొనును గాక.\"",ref:"యోబు 31:6"},
{id:529,topic:"న్యాయము",title:"విత్తుట, కోయుట",text:"\"మీ కొరకు నీతిని విత్తుడి, అప్పుడు దేవుని ప్రేమ పంటను కోయుదురు.\"",ref:"హోషేయ 10:12"},
{id:530,topic:"న్యాయము",title:"కేకలు గెలిచాయి",text:"\"ఆయనను సిలువ వేయమని తమ డిమాండును గట్టిగా కోరారు, వారి కేకలు గెలిచాయి.\"",ref:"లూకా 23:23"},
{id:531,topic:"న్యాయము",title:"న్యాయపు హామీ",text:"\"ఏ వ్యక్తి అయినా సాక్షిగా ... సమాచారము ఇవ్వకుండా పాపము చేసిన యెడల, అతను తన అక్రమమునకు జవాబు చెప్పాలి.\"",ref:"లేవీయకాండము 5:1"},
{id:532,topic:"న్యాయము",title:"ఆరోపకులతో ఎదుర్కొనుట",text:"\"ఏ ఆరోపింపబడినవానిని అతని ఆరోపకులతో ఎదుర్కొనుటకు ... అప్పగించుట రోమా పద్ధతి కాదు.\"",ref:"అపొస్తలుల కార్యములు 25:16"},
{id:533,topic:"దయ",title:"దయ సాక్ష్యములు",text:"\"ఆ ద్వీపవాసులు మాకు అసాధారణమైన దయ చూపించారు.\"",ref:"అపొస్తలుల కార్యములు 28:2"},
{id:534,topic:"దయ",title:"ఒక దయకు మరొక దయ",text:"\"మేము నీకు దయయు, నమ్మకమును చూపుదుము.\"",ref:"యెహోషువ 2:14"},
{id:535,topic:"దయ",title:"దయ కొరకు విజ్ఞప్తి",text:"\"నేను నీకు ఏమి చేసాను, నీవు నన్ను ఈ మూడు సార్లు కొట్టావు?\"",ref:"సంఖ్యాకాండము 22:28,30"},
{id:536,topic:"దేవుని రాజ్యము",title:"వర్తమాన వాస్తవము",text:"\"దేవుని రాజ్యము మీ మధ్యనే ఉంది.\"",ref:"లూకా 17:21"},
{id:537,topic:"దేవుని రాజ్యము",title:"తలుపులు తెరవబడ్డాయి",text:"సాంఘికముగా కావలసినవారు వెనుకాడిన తరువాత, తలుపులు సుంకరులు, పాపులకు తెరవబడతాయి.",ref:"లూకా 14:16-24"},
{id:538,topic:"దేవుని రాజ్యము",title:"సమస్త దిక్కుల నుండి",text:"\"తూర్పున మూడు ద్వారములు; ఉత్తరమున మూడు; దక్షిణమున మూడు; పడమరన మూడు.\"",ref:"ప్రకటన 21:12-13"},
{id:539,topic:"నవ్వు",title:"అవిశ్వాసపు నవ్వు",text:"అబ్రహాము తన ముఖము మీద పడి నవ్వి, \"నూరు సంవత్సరముల వయస్సు గలవానికి బిడ్డ జన్మిస్తాడా?\" అన్నాడు.",ref:"ఆదికాండము 17:17"},
{id:540,topic:"లౌకికులు",title:"సమర్థ సహాయకులు",text:"\"మోషే ఇశ్రాయేలు నుండి సమర్థులైన మనుష్యులను ఎన్నుకొని, వారిని ప్రజలపై అధిపతులుగా చేసాడు.\"",ref:"నిర్గమకాండము 18:25-26"},
{id:541,topic:"లౌకికులు",title:"ఆధారము చేయు భుజములు",text:"\"ఆరోను, హూరు అతని చేతులను ... ఆధారము చేసారు.\"",ref:"నిర్గమకాండము 17:12"},
{id:542,topic:"లౌకికులు",title:"వారు తమ ప్రాణములను పణము పెట్టారు",text:"\"వారు నా కొరకు తమ ప్రాణములను పణము పెట్టారు.\"",ref:"రోమీయులు 16:3-4"},
{id:543,topic:"లౌకికులు",title:"లౌకిక పాల్గొనుట",text:"\"మీరు కలిసినప్పుడు, ప్రతి ఒక్కరూ ఏదో ఒకటి సహకరిస్తారు.\"",ref:"1 కొరింథీయులు 14:26"},
{id:544,topic:"లౌకికులు",title:"ఊహించని మద్దతు",text:"\"ఈ మనిషి మరణ శిక్షకు అర్హుడు కాదు, ఎందుకంటే అతను మనతో మన దేవుడైన ప్రభువు నామములో మాట్లాడాడు.\"",ref:"యిర్మీయా 26:8,16"},
{id:545,topic:"నాయకత్వము",title:"మందకు ఆదర్శములు",text:"\"మీ మధ్య ఉన్న దేవుని మందను పోషించుటకు ... మందకు ఆదర్శములుగా ఉండుటకు.\"",ref:"1 పేతురు 5:2-3"},
{id:546,topic:"నాయకత్వము",title:"అతను వారిని తప్పుదారి పట్టించాడు",text:"\"మనష్షే [ఇశ్రాయేలు పిల్లలను] తప్పుదారి పట్టించాడు.\"",ref:"2 రాజులు 21:9"},
{id:547,topic:"నాయకత్వము",title:"ఎంత అలసట!",text:"\"ఎంత అలసట అంతా!\"",ref:"మలాకీ 1:13"},
{id:548,topic:"నాయకత్వము",title:"నైతిక అరాజకత్వము",text:"\"ఆ దినములలో ఇశ్రాయేలులో రాజు లేడు: ప్రతి ఒక్కడు తన కళ్ళకు సరైనది చేసాడు.\"",ref:"న్యాయాధిపతులు 21:25"},
{id:549,topic:"నాయకత్వము",title:"గౌరవమునకు అర్హము",text:"పౌలు, \"సహోదరులారా, అతను ప్రధాన యాజకుడని నాకు తెలియదు\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 23:3,5"},
{id:550,topic:"నాయకత్వము",title:"దురాశ, మూఢనమ్మకము",text:"\"ప్రధాన యాజకులు బరబ్బాను విడుదల చేయమని జన సమూహమును రేపారు.\"",ref:"మార్కు 15:11"},
{id:551,topic:"నాయకత్వము",title:"ఒక మనిషి నిలబడతాడు",text:"ఒక పేరులేని అధికారి నిలబడి, జన సమూహమును, తమ ఫిర్యాదులను చట్టబద్ధముగా స్థాపించబడిన సభకు తీసుకొని వెళ్ళాలని విజయవంతముగా ఒప్పించాడు.",ref:"అపొస్తలుల కార్యములు 19:35-41"},
{id:552,topic:"నాయకత్వము",title:"రాజు ప్రార్థన",text:"సొలొమోను, \"నేను చిన్న బిడ్డను మాత్రమే: నేను ఎలా బయటకు వెళ్ళాలో, లోపలికి రావాలో నాకు తెలియదు\" అన్నాడు.",ref:"1 రాజులు 3:7"},
{id:553,topic:"నాయకత్వము",title:"ప్రభువు అభిషేకించినవాడు",text:"దావీదు, \"నా యజమానికి, ప్రభువు అభిషేకించినవానికి వ్యతిరేకముగా నా చేయి చాపుట ప్రభువు నిషేధించును గాక\" అన్నాడు.",ref:"1 సమూయేలు 24:6"},
{id:554,topic:"నాయకత్వము",title:"నిరూపించబడిన నాయకత్వము",text:"కోరహు, \"మీరు ప్రభువు సమాజముపై మిమ్ములను ఎందుకు హెచ్చించుకొంటున్నారు?\" అన్నారు.",ref:"సంఖ్యాకాండము 16:3"},
{id:555,topic:"జీవితము",title:"కొంచెము తేనె తీసుకొని వెళ్ళుడి",text:"\"కొంచెము బాము, కొంచెము తేనె, సుగంధద్రవ్యములు, బోళము, పిస్తా గింజలు, బాదము పప్పు.\"",ref:"ఆదికాండము 43:11"},
{id:556,topic:"జీవితము",title:"అడిగిన యెడల మనవి",text:"\"రామోత్-గిలాదు మనకు చెందుతుందని మీకు తెలియదా? అయినప్పటికీ మనము ఇక్కడ కూర్చొని, దానిని తీసుకోము!\"",ref:"1 రాజులు 22:3"},
{id:557,topic:"జీవితము",title:"తుడిచివేయబడిన సాలెగూడు",text:"\"మా సంవత్సరములు తుడిచివేయబడిన సాలెగూడు వలె.\"",ref:"కీర్తనలు 90:9"},
{id:558,topic:"జీవితము",title:"నిరంతర విజయ ఊరేగింపు",text:"\"నేను ఎక్కడికి వెళ్ళినా ... ఆయన నా జీవితమును క్రీస్తులో నిరంతర విజయ ఊరేగింపుగా చేస్తాడు.\"",ref:"2 కొరింథీయులు 2:14"},
{id:559,topic:"జీవితము",title:"జీవితపు మార్గదర్శకుడు",text:"\"విశ్వాసపు మార్గదర్శకుడు, సంపూర్ణత అయిన యేసుపై మన కళ్ళను నిలిపి.\"",ref:"హెబ్రీయులు 12:1-2"},
{id:560,topic:"జీవితము",title:"ప్రకాశమాన జీవితము",text:"\"ఇదిగో, అతని ముఖపు చర్మము ప్రకాశించుచుండెను.\"",ref:"నిర్గమకాండము 34:30"},
{id:561,topic:"జీవితము",title:"ప్రకాశమా లేక బూడిదా?",text:"\"మీరు ... ఆత్మలో ఆధ్యాత్మిక జీవితమును ప్రారంభించి, బాహ్య ఆచారములకు తిరిగి దానిని పూర్తి చేస్తాడని మీరు అంత మూర్ఖులుగా ఉండలేరు?\"",ref:"గలతీయులు 3:3-4"},
{id:562,topic:"జీవితము",title:"ఈ విషయముల ద్వారా మనుష్యులు జీవిస్తారు",text:"\"ఓ ప్రభువా, ఈ విషయముల ద్వారా మనుష్యులు జీవిస్తారు.\"",ref:"యెషయా 38:16"},
{id:563,topic:"వెలుగు",title:"పరలోక వెలుగు",text:"\"నేను మార్గములో ఆకాశము నుండి సూర్యుని కంటే ప్రకాశవంతమైన ఒక వెలుగు నా చుట్టూ ప్రకాశించుట చూచాను.\"",ref:"అపొస్తలుల కార్యములు 26:13"},
{id:564,topic:"వెలుగు",title:"పరిమిత వెలుగు",text:"\"మీ అగ్ని వెలుగులో, మీరు వెలిగించిన కొరలతో నడవండి!\"",ref:"యెషయా 50:11"},
{id:565,topic:"వెలుగు",title:"నీడలు తొలగించబడతాయి",text:"\"నేను దీపముతో యెరూషలేమును వెతుకుతాను.\"",ref:"జెఫన్యా 1:12"},
{id:566,topic:"వెలుగు",title:"ఆర్పివేయలేని వెలుగు",text:"\"దేవుని దీపము ఇంకా ఆరిపోలేదు.\"",ref:"1 సమూయేలు 3:3"},
{id:567,topic:"వెలుగు",title:"ప్రకాశములో స్నానము చేయబడెను",text:"\"ప్రభువు మహిమ [కాపరుల] చుట్టూ ప్రకాశించింది.\"",ref:"లూకా 2:9"},
{id:568,topic:"వెలుగు",title:"ఇంటిలో వెలుగు",text:"\"ఇశ్రాయేలు పిల్లలకు వారి నివాసములలో వెలుగు ఉండెను.\"",ref:"నిర్గమకాండము 10:23"},
{id:569,topic:"ప్రేమ",title:"భక్తి సాక్ష్యము",text:"\"ఓర్పా తన అత్తను ముద్దాడింది; కానీ రూతు ఆమెను హత్తుకొని ఉండిపోయింది.\"",ref:"రూతు 1:14"},
{id:570,topic:"ప్రేమ",title:"ఆమె ప్రేమించిన మనిషి",text:"సౌలు, \"అతనికి నేను ఆమెను ఇస్తాను, తద్వారా ఆమె అతనికి ఉచ్చుగా ఉంటుంది\" అన్నాడు. కానీ మీకాలు తన తండ్రి కుట్రలలో భాగస్వామి కాలేదు.",ref:"1 సమూయేలు 18:21"},
{id:571,topic:"ప్రేమ",title:"త్వరగా గడిచే సంవత్సరములు",text:"\"యాకోబు రాహేలు కొరకు ఏడు సంవత్సరములు సేవ చేసాడు; అతనికి ఆమె పట్ల ఉన్న ప్రేమ కారణముగా అవి అతనికి కొన్ని రోజుల వలె అనిపించాయి.\"",ref:"ఆదికాండము 29:20"},
{id:572,topic:"ప్రేమ",title:"ఆమెను తిరిగి పొందుటకు",text:"\"అప్పుడు ఆమె భర్త ఆమెను తిరిగి పొందుటకు వెళ్ళాడు.\"",ref:"న్యాయాధిపతులు 19:2-3"},
{id:573,topic:"ప్రేమ",title:"వక్రీకరించబడిన చిహ్నము",text:"\"'గురువా' అతను అన్నాడు — మరియు ఒక ప్రేమికుడు చేసినట్లు ఆయనను ముద్దాడాడు.\"",ref:"మార్కు 14:45"},
{id:574,topic:"ప్రేమ",title:"ఉదయపు మేఘము వలె",text:"\"ఎఫ్రాయిమూ ... ఈ నీ ప్రేమ ఒక ఉదయపు మేఘము వలె, త్వరలో అదృశ్యమయ్యే మంచు వలె ఉంది.\"",ref:"హోషేయ 6:4"},
{id:575,topic:"ప్రేమ",title:"ప్రేమ ఒక పూర్వాపేక్ష",text:"\"నీవు నీ కానుకను బలిపీఠము వద్దకు తీసుకొని వచ్చినప్పుడు ... మొదట నీ సహోదరునితో సమాధానపడి, తరువాత వచ్చి నీ కానుకను అర్పించుము.\"",ref:"మత్తయి 5:23-24"},
{id:576,topic:"ప్రేమ",title:"నిశ్శబ్ద వాక్చాతుర్యము",text:"\"ప్రేమ ఊరేగింపు చేయదు.\"",ref:"1 కొరింథీయులు 13:4"},
{id:577,topic:"ప్రేమ",title:"ప్రేమ కొలతలు",text:"\"'వెడల్పు,' 'పొడవు,' 'లోతు,' 'ఉన్నతము' అర్థము ఏమిటో గ్రహించగలరు.\"",ref:"ఎఫెసీయులు 3:18-19"},
{id:578,topic:"ప్రేమ",title:"మన క్రియల మూలము",text:"\"మన క్రియల మూలమే క్రీస్తు ప్రేమ.\"",ref:"2 కొరింథీయులు 5:14"},
{id:579,topic:"ప్రేమ",title:"అపురూప ప్రేమ",text:"\"మనము దేవుని పిల్లలమని పిలువబడుటకు తండ్రి మనకు ఎంత అపురూప ప్రేమ చూపించాడో పరిగణించండి.\"",ref:"1 యోహాను 3:1"},
{id:580,topic:"ప్రేమ",title:"దేవుని ప్రేమకు ఆవల ఎవరూ లేరు",text:"\"మీరు అనేక పిచ్చుకల కంటే ఎక్కువ విలువైనవారు.\"",ref:"లూకా 12:6-7"},
{id:581,topic:"విశ్వాసము",title:"దానియేలు కిటికీలు తెరిచెను",text:"\"దానియేలు ఆ శాసనము సంతకము చేయబడిందని తెలుసుకొన్నప్పుడు ... అతను మోకరిల్లి ప్రార్థన చేసాడు.\"",ref:"దానియేలు 6:10"},
{id:582,topic:"విశ్వాసము",title:"వాయులీనకారుని రాగము",text:"ఒక నిజమైన ప్రవక్త, అయినప్పటికీ, వాయులీనకారుని రాగము విను నాలుగు వందల మంది సమయసేవకుల కంటే ఎక్కువ నమ్మదగినవాడు.",ref:"1 రాజులు 22:8"},
{id:583,topic:"విశ్వాసము",title:"మేము ప్రభువుకు సేవ చేస్తాము",text:"\"నేను, నా ఇల్లు మాత్రము ప్రభువుకు సేవ చేస్తాము.\"",ref:"యెహోషువ 24:15"},
{id:584,topic:"విశ్వాసము",title:"సర్వోన్నత విశ్వాసము",text:"యోసేపు, \"నేను ఈ గొప్ప దుష్కార్యమును ఎలా చేయగలను, దేవునికి వ్యతిరేకముగా పాపము చేయగలను?\" అన్నాడు.",ref:"ఆదికాండము 39:9"},
{id:585,topic:"విశ్వాసము",title:"మనిషి పట్ల దేవుని విశ్వాసము",text:"\"నా దేవా, నా పట్ల విశ్వాసము కొరకు వీణపై నిన్ను స్తుతిస్తాను.\"",ref:"కీర్తనలు 71:22"},
{id:586,topic:"విశ్వాసము",title:"పేతురు కొరకు మాత్రమే",text:"\"వెంటనే ఆ పెట్టె కూసింది.\" పేతురు కొరకు మాత్రమేనా?",ref:"మత్తయి 26:74"},
{id:587,topic:"విశ్వాసము",title:"విరుద్ధ విశ్వాసములు",text:"\"ప్రభువు నిన్ను నడిపించు సమస్త జాతులలో ఒక విస్మయము, ఒక సామెత, ఒక ఎగతాళి.\"",ref:"ద్వితీయోపదేశము 28:37"},
{id:588,topic:"విశ్వాసము",title:"ప్రతి మలుపులో అస్థిరత",text:"\"విభజిత విశ్వాసము గల మనిషి జీవితము ప్రతి మలుపులో అస్థిరతను వెల్లడిస్తుంది.\"",ref:"యాకోబు 1:8"},
{id:589,topic:"మనిషి",title:"మానవ భేదములు",text:"\"స్వరము యాకోబు స్వరము, కానీ చేతులు ఏసావు చేతులు.\"",ref:"ఆదికాండము 27:22"},
{id:590,topic:"మనిషి",title:"మానవత్వముతో గుర్తింపు",text:"\"జీవులందరితో కలిసినవానికి నిరీక్షణ ఉంది.\"",ref:"ప్రసంగి 9:4"},
{id:591,topic:"మనిషి",title:"విశాల హృదయము",text:"\"ఆయన మనిషి మనస్సులో నిత్యత్వమును ఉంచాడు.\"",ref:"ప్రసంగి 3:11"},
{id:592,topic:"మనిషి",title:"దైవిక మూలము",text:"\"ఆదాము కుమారుడు, దేవుని కుమారుడు.\"",ref:"లూకా 3:23,38"},
{id:593,topic:"పరిపక్వత",title:"ఆధ్యాత్మిక పరిపక్వత",text:"\"మోషే వంటి ప్రవక్త ఇశ్రాయేలులో తరువాత లేవలేదు.\"",ref:"ద్వితీయోపదేశము 34:10"},
{id:594,topic:"పరిపక్వత",title:"పాలు ఆహారము",text:"\"నేను మీకు పాలు, ఘన ఆహారము కాదు ఇచ్చాను; ఎందుకంటే మీరు దానికి సిద్ధముగా లేరు.\"",ref:"1 కొరింథీయులు 3:2"},
{id:595,topic:"అద్భుతము",title:"దైవిక సరళత",text:"నయమాను \"అతను నిశ్చయముగా బయటకు వచ్చి నిలబడి, తన దేవుడైన ప్రభువు నామమును ప్రార్థించి, ఆ స్థలముపై తన చేతిని ఊపి కుష్ఠురోగిని స్వస్థపరుస్తాడు\" అని అన్నాడు.",ref:"2 రాజులు 5:11"},
{id:596,topic:"అద్భుతము",title:"అత్యంత గొప్ప అద్భుతము",text:"\"ప్రభువు, ఆయనే దేవుడు; ప్రభువు, ఆయనే దేవుడు.\"",ref:"1 రాజులు 18:38-39"},
{id:597,topic:"అద్భుతము",title:"నాకు ఒక సూచన చూపుము",text:"గిద్యోను, \"ఇప్పుడు నేను నీ కళ్ళలో కృప పొందిన యెడల, నాకు ఒక సూచన చూపుము\" అన్నాడు.",ref:"న్యాయాధిపతులు 6:17"},
{id:598,topic:"అద్భుతము",title:"కావాలి: ఒక అద్భుతము",text:"హెరోదు \"ఆయన ఏదో అద్భుతము చేయుట చూడాలని కూడా ఆశించాడు.\"",ref:"లూకా 23:8"},
{id:599,topic:"అద్భుతము",title:"ద్వారములకు తాళములు",text:"\"ఇనుప ద్వారము వద్దకు వచ్చారు, అది వారికి స్వయముగా తెరవబడింది.\"",ref:"అపొస్తలుల కార్యములు 12:10"},
{id:600,topic:"అద్భుతము",title:"వారు దేవుని స్తుతించారు",text:"గ్రుడ్డివానిని నిశ్శబ్దము చేయ ప్రయత్నించిన ప్రజలు దేవుని స్తుతించుటలో చేరారు.",ref:"లూకా 18:35-43"},
{id:601,topic:"డబ్బు",title:"తాను పెట్టని గుడ్లు",text:"\"తాను పెట్టని గుడ్లను పొదిగిన కౌజు వలె, అన్యాయముగా డబ్బు సంపాదించువాడు కూడా.\"",ref:"యిర్మీయా 17:11"},
{id:602,topic:"డబ్బు",title:"నేను దానిని కొంటాను!",text:"పేతురు సీమోనుతో, \"దేవుని వరము డబ్బుతో కొనబడుతుందని నీవు భావించినందున, నీ డబ్బు నీతో నశించును గాక\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 8:20-21"},
{id:603,topic:"డబ్బు",title:"ఒక ధరకు ఉపకారములు",text:"ఫెలిక్సు, \"పౌలు అతనికి డబ్బు చెల్లిస్తాడనే రహస్య నిరీక్షణను పెంచుకొన్నాడు.\"",ref:"అపొస్తలుల కార్యములు 24:26"},
{id:604,topic:"డబ్బు",title:"డబ్బు ఏమి కొనలేదు",text:"పేతురు, \"వెండి, బంగారము నాకు లేదు; కానీ నాకు ఉన్నది నీకు ఇస్తాను: నజరేతు యేసు క్రీస్తు నామములో లేచి నడవుము\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 3:6"},
{id:605,topic:"డబ్బు",title:"ధర ట్యాగులు లేవు",text:"ఎలీషా గెహజీని, \"డబ్బు, వస్త్రములు, ఒలీవ తోటలు, ద్రాక్ష తోటలు, గొర్రెలు, ఎద్దులు, సేవకులు, సేవకురాళ్ళను స్వీకరించుటకు ఇది సమయమా?\" అని అడిగాడు.",ref:"2 రాజులు 5:26"},
{id:606,topic:"తల్లి",title:"బాలుని వస్త్రము",text:"\"అతని తల్లి అతనికి ఒక చిన్న వస్త్రమును చేసి, ప్రతి సంవత్సరము అతనికి తీసుకొని వచ్చేది.\"",ref:"1 సమూయేలు 2:19"},
{id:607,topic:"తల్లి",title:"తల్లి జాగరణ",text:"రిస్పా తాను ప్రేమించిన వారి అవశేషముల దగ్గర వేసవి కాలమంతా జాగరణ ప్రారంభించింది.",ref:"2 సమూయేలు 21:10-14"},
{id:608,topic:"తల్లి",title:"దీర్ఘ నిరీక్షణ",text:"\"అతని రథము ఎందుకు ఇంత ఆలస్యముగా వస్తుంది? అతని రథ చక్రములు ఎందుకు ఆలస్యము చేస్తున్నాయి?\"",ref:"న్యాయాధిపతులు 5:28"},
{id:609,topic:"తల్లి",title:"గౌరవ స్థానము",text:"\"రాజు ఆమెను కలవుటకు లేచి, ఆమెకు నమస్కరించి, తన సింహాసనముపై కూర్చొని, రాజు తల్లికి ఒక ఆసనము వేయించాడు.\"",ref:"1 రాజులు 2:19"},
{id:610,topic:"తల్లి",title:"దుష్ట సలహాదారు",text:"\"అతని తల్లి దుష్కార్యములు చేయుటలో అతనికి సలహాదారు.\"",ref:"2 దినవృత్తాంతములు 22:3"},
{id:611,topic:"సంగీతము",title:"సంగీతములో సాంత్వన",text:"\"దేవుని నుండి దుష్టాత్మ సౌలును అధిగమించినప్పుడు, దావీదు వీణ తీసుకొని సంగీతము వాయించేవాడు.\"",ref:"1 సమూయేలు 16:23"},
{id:612,topic:"సంగీతము",title:"వాయిద్యకారుడు వాయించినప్పుడు",text:"\"వాయిద్యకారుడు వాయించినప్పుడు, ప్రభువు హస్తము అతనిపై వచ్చింది.\"",ref:"2 రాజులు 3:15"},
{id:613,topic:"సంగీతము",title:"పాటతో గెలిచిన యుద్ధము",text:"\"వారు పాడుట, స్తుతించుట ప్రారంభించినప్పుడు, ప్రభువు ఒక డాగు పెట్టాడు.\"",ref:"2 దినవృత్తాంతములు 20:22"},
{id:614,topic:"సంగీతము",title:"గీతాత్మక సాక్ష్యము",text:"\"అర్ధరాత్రి పౌలు, సీలలు ప్రార్థన చేసి, దేవుని స్తుతించారు.\"",ref:"అపొస్తలుల కార్యములు 16:25"},
{id:615,topic:"జాతి",title:"యెరూషలేమును కొలుచుట",text:"\"యెరూషలేమును కొలుచుటకు, దాని వెడల్పు ఏమిటో, దాని పొడవు ఏమిటో చూచుటకు.\"",ref:"జెకర్యా 2:2"},
{id:616,topic:"జాతి",title:"ప్రభువు వాదన",text:"\"దేశ నివాసులతో ప్రభువుకు ఒక వాదన ఉంది.\"",ref:"హోషేయ 4:1"},
{id:617,topic:"జాతి",title:"పౌరుల హక్కులు",text:"పౌలు, సీలలు రోమా పౌరులుగా అన్యాయముగా వ్యవహరించబడ్డారని నిరసించారు.",ref:"అపొస్తలుల కార్యములు 16:36-39"},
{id:618,topic:"జాతి",title:"ఇంటి వెలుగులు",text:"హదదు, \"నన్ను వెళ్ళనివ్వుము, నేను నా స్వదేశమునకు వెళ్తాను\" అన్నాడు.",ref:"1 రాజులు 11:21-22"},
{id:619,topic:"జాతి",title:"వారి అడుగుజాడలలో",text:"\"మీ పితరులు ప్రయత్నించినది పూర్తి చేయుటకు ముందుకు వెళ్ళండి!\"",ref:"మత్తయి 23:32"},
{id:620,topic:"జాతి",title:"నిరంతర జ్ఞాపిక",text:"\"మోషే యోసేపు ఎముకలను తనతో తీసుకొని వెళ్ళాడు.\"",ref:"నిర్గమకాండము 13:19"},
{id:621,topic:"జాతి",title:"భ్రమలు",text:"\"ఐగుప్తీయులు మనుష్యులు, దేవుడు కాదు; వారి గుర్రములు శరీరము, ఆత్మ కాదు.\"",ref:"యెషయా 31:3"},
{id:622,topic:"జాతి",title:"నాయకుడు లేని జాతి",text:"\"ఆ దినములలో ... ఇశ్రాయేలులో రాజు లేడు.\"",ref:"న్యాయాధిపతులు 19:1"},
{id:623,topic:"జాతి",title:"సొలొమోను ప్రార్థన",text:"\"నీ సేవకునికి నీ ప్రజలకు న్యాయము తీర్చుటకు, మంచి, చెడు మధ్య వివేచించుటకు అవగాహన హృదయమును ఇమ్ము.\"",ref:"1 రాజులు 3:9"},
{id:624,topic:"ప్రకృతి",title:"ప్రకృతి సాక్ష్యము",text:"\"ఆకాశములు దేవుని మహిమను ప్రకటిస్తాయి.\"",ref:"కీర్తనలు 19:1"},
{id:625,topic:"ప్రకృతి",title:"తోటమాలి",text:"మరియ యేసును \"తోటమాలి అని భావించింది.\"",ref:"యోహాను 20:15"},
{id:626,topic:"నిర్లక్ష్యము",title:"బలిపీఠపు అగ్నులు",text:"\"బలిపీఠముపై నిప్పు ఎల్లప్పుడూ వెలిగియుండాలి.\"",ref:"లేవీయకాండము 6:13"},
{id:627,topic:"నిర్లక్ష్యము",title:"దుర్బల వర్తకులు",text:"\"వారు నన్ను, జీవ జలపు నిల్వను విడిచిపెట్టి, తమ కొరకు తాము బావులను త్రవ్వుకొన్నారు.\"",ref:"యిర్మీయా 2:13"},
{id:628,topic:"నిర్లక్ష్యము",title:"మీరందరూ పోయేవారూ",text:"\"పోయే మీరందరికీ అది ఏమీ కాదా?\"",ref:"విలాపవాక్యములు 1:12"},
{id:629,topic:"పొరుగువాడు",title:"పొరుగువారు ఏమి చెబుతారు?",text:"\"దేవుడు నన్ను నవ్వు పాత్రను చేసాడు; దానిని విన్న ప్రతి ఒక్కరూ నన్ను చూచి నవ్వుతారు.\"",ref:"ఆదికాండము 21:6"},
{id:630,topic:"పొరుగువాడు",title:"పొరుగువారు లేకుండా",text:"దురాశాపరులు \"ఒంటరిగా నివసించుటకు\" చేయబడతారు, పొరుగువారు లేకుండా.",ref:"యెషయా 5:8"},
{id:631,topic:"పొరుగువాడు",title:"అప్పు తీసుకొన్న గొడ్డళ్ళు",text:"\"అయ్యో, నా ప్రభువా! ... అది అప్పు తీసుకొన్నది.\"",ref:"2 రాజులు 6:5"},
{id:632,topic:"పొరుగువాడు",title:"స్నేహపూర్వక కొమ్మలు",text:"\"యోసేపు ఒక ఊట దగ్గర ఫలవంతమైన కొమ్మ, దాని కొమ్మలు గోడను దాటి వెళ్తాయి.\"",ref:"ఆదికాండము 49:22"},
{id:633,topic:"పొరుగువాడు",title:"బంధువు కంటే ఎక్కువ",text:"యేసు మనస్సులో \"పొరుగువాడు\" అంటే తన బంధువులు కాదు, సమస్త మానవత్వము.",ref:"లూకా 10:25-28"},
{id:634,topic:"పొరుగువాడు",title:"ఏమి ఆశించాలి",text:"\"మీరు ఒకరితో ఒకరు, పంటితో, గోరుతో పోరాడుతూ ఉంటే, మీరు ఆశించగలది పరస్పర నాశనమే.\"",ref:"గలతీయులు 5:15"},
{id:635,topic:"విధేయత",title:"దేవుని నుండి తప్పించుకొనుట",text:"దేవుడు నీనెవెకు వెళ్ళి అక్కడ ప్రకటించమని అతనిని నియమించినప్పుడు, యోనా వెంటనే ఒక దూర దేశమునకు బయలుదేరాడు.",ref:"యోనా 1:2-3"},
{id:636,topic:"విధేయత",title:"సౌలు బాధ్యత",text:"\"నీవు నీ స్వంత కళ్ళలో చిన్నవాడవుగా ఉన్నప్పుడు, నీవు ఇశ్రాయేలు గోత్రములకు తలగా చేయబడలేదా?\"",ref:"1 సమూయేలు 15:17,19"},
{id:637,topic:"విధేయత",title:"అతని పేరు యోహాను",text:"జెకర్యా, \"అతని పేరు యోహాను\" అని వ్రాసాడు.",ref:"లూకా 1:63"},
{id:638,topic:"విధేయత",title:"గుడ్డి విధేయత",text:"\"కాబట్టి ఇప్పుడు, నా కుమారుడా, నేను నీకు ఆజ్ఞాపించినదాని ప్రకారము నా మాట వినుము.\"",ref:"ఆదికాండము 27:8"},
{id:639,topic:"బాధ్యత",title:"సార్వత్రిక బాధ్యత",text:"\"కాబట్టి వెళ్ళి, సమస్త జాతులను బోధించుడి.\"",ref:"మత్తయి 28:19"},
{id:640,topic:"బాధ్యత",title:"ఎక్కువ అవసరములు",text:"యేసు పరిసయ్యులను ఖండించాడు, వారు పుదీనా, జీలకర్ర వంటి వాటిని దశమభాగము ఇచ్చేవారు, కానీ న్యాయము, దేవుని ప్రేమ అవసరములను నిర్లక్ష్యము చేసారు.",ref:"లూకా 11:42"},
{id:641,topic:"అడ్డంకి",title:"అతనిని అడ్డగించుటకు పంపబడెను",text:"\"ఇదిగో నేను, నీ మూర్ఖ మార్గములను చూచి, నిన్ను అడ్డగించుటకు వచ్చాను.\"",ref:"సంఖ్యాకాండము 22:26,32"},
{id:642,topic:"అడ్డంకి",title:"నిరోధించబడిన మార్గములు",text:"సౌలు ఫిలిష్తీయులపై కదలాలా అని దేవుని అడిగినప్పుడు, దేవుడు \"ఆ రోజు అతనికి జవాబివ్వలేదు.\"",ref:"1 సమూయేలు 14:37"},
{id:643,topic:"అడ్డంకి",title:"అడ్డంకుల మార్గము",text:"\"తన విగ్రహములను తన హృదయములోనికి తీసుకొని వచ్చు ఏ ఇశ్రాయేలు మనిషి ... తనను తడబడజేసే పాపముపై మొగ్గు చూపుతాడు.\"",ref:"యెహెజ్కేలు 14:4"},
{id:644,topic:"అడ్డంకి",title:"తలుపు మూయబడింది",text:"\"కానీ యేసు ఆత్మ ఇది అనుమతించలేదు.\"",ref:"అపొస్తలుల కార్యములు 16:7"},
{id:645,topic:"అడ్డంకి",title:"అడ్డంకులు",text:"\"సమస్త మనుష్యులను సమస్త విషయములలో సంతృప్తి పరచుట, నా స్వంత ప్రయోజనము కాదు.\"",ref:"1 కొరింథీయులు 10:33"},
{id:646,topic:"అడ్డంకి",title:"ఆయన రాకకు అడ్డంకి",text:"\"యేసు తనను తాను దాచుకొన్నాడు.\"",ref:"యోహాను 8:59"},
{id:647,topic:"అర్పణ",title:"వారు అద్దములు అర్పించారు",text:"\"సన్నిధి గుడార ద్వారములో సేవ చేసిన సేవకురాళ్ళ అద్దముల నుండి కంచు తొట్టిని, దాని కంచు పీఠమును చేసాడు.\"",ref:"నిర్గమకాండము 38:8"},
{id:648,topic:"అర్పణ",title:"మనిషి న్యాసము",text:"\"సమస్త కానుకలు నీ నుండి వస్తాయి, మేము నీకు నీ స్వంతమైనదే ఇస్తాము.\"",ref:"1 దినవృత్తాంతములు 29:14,16"},
{id:649,topic:"అర్పణ",title:"సంతోషముగా ఇచ్చువారు",text:"\"దేవుడు సంతోషముగా ఇచ్చువానిని ప్రేమిస్తాడు.\"",ref:"2 కొరింథీయులు 9:7"},
{id:650,topic:"అర్పణ",title:"రెండు చిన్న నాణేలు",text:"\"ఆమె తన అవసరములో జీవించుటకు తనకు ఉన్న సమస్తమును విసిరింది.\"",ref:"లూకా 21:4"},
{id:651,topic:"అర్పణ",title:"నిర్దోష బలులు",text:"\"నీతి బలులను అర్పించుడి.\"",ref:"కీర్తనలు 4:5"},
{id:652,topic:"అర్పణ",title:"మీ నుండి పిండి తీయబడలేదు",text:"\"ఇది ఉదార కానుకగా వస్తుందని నేను కోరుకుంటున్నాను, మీ నుండి పిండి తీయబడిన డబ్బుగా కాదు.\"",ref:"2 కొరింథీయులు 9:5"},
{id:653,topic:"అర్పణ",title:"వింత అగ్ని",text:"ఆరోను కుమారులు నాదాబు, అబీహులు ప్రభువుకు అర్పించిన వింత, అపవిత్ర అగ్ని వారిని దహించింది.",ref:"లేవీయకాండము 10:1-3"},
{id:654,topic:"అర్పణ",title:"సరిపడా కంటే ఎక్కువ",text:"\"ప్రజలు ప్రభువు ఆజ్ఞాపించిన పని కొరకు సరిపడా కంటే చాలా ఎక్కువ తీసుకొని వస్తున్నారు.\"",ref:"నిర్గమకాండము 36:5-6"},
{id:655,topic:"అర్పణ",title:"దేవుని మోసము చేయువారు",text:"\"మీరు నన్ను మోసము చేస్తున్నారు\" — \"మీ దశమభాగముల, అర్పణల ద్వారా.\"",ref:"మలాకీ 3:8"},
{id:656,topic:"అభిప్రాయము",title:"అభిప్రాయముల మధ్య కుంటుట",text:"\"మీరు ఎంత కాలము రెండు అభిప్రాయముల మధ్య కుంటుతారు?\"",ref:"1 రాజులు 18:21"},
{id:657,topic:"అభిప్రాయము",title:"అభిప్రాయ మార్పు",text:"మాల్టా స్థానికులు తమ అభిప్రాయము మార్చుకొని, \"అతను ఒక దేవుడు\" అన్నారు.",ref:"అపొస్తలుల కార్యములు 28:4,6"},
{id:658,topic:"అభిప్రాయము",title:"ప్రాముఖ్యమైన భేదములు",text:"\"వారు అతనితో వారి స్వంత మతమునకు సంబంధించిన కొన్ని విషయముల గూర్చి వాదించారు.\"",ref:"అపొస్తలుల కార్యములు 25:19"},
{id:659,topic:"అభిప్రాయము",title:"నవీనతల పట్ల మోహము",text:"ఏథెన్సు ప్రజలు \"ఏ నవీనత పట్ల అయినా ఒక మోహము కలిగి ఉండేవారు.\"",ref:"అపొస్తలుల కార్యములు 17:21"},
{id:660,topic:"అభిప్రాయము",title:"నమ్మదగిన అభిప్రాయము",text:"\"అవివాహిత స్త్రీల కొరకు నాకు ప్రభువు నుండి ఆజ్ఞలు లేవు, కానీ మీరు నమ్మగల ఒకరి అభిప్రాయమును నేను ఇస్తాను.\"",ref:"1 కొరింథీయులు 7:25"},
{id:661,topic:"అభిప్రాయము",title:"ప్రజలు విభజింపబడ్డారు",text:"\"పట్టణ ప్రజలు విభజింపబడ్డారు; కొందరు యూదుల పక్షములో, కొందరు అపొస్తలుల పక్షములో ఉన్నారు.\"",ref:"అపొస్తలుల కార్యములు 14:2,4"},
{id:662,topic:"అవకాశము",title:"ప్రతికూల పరిస్థితులలో",text:"\"నేను పెంతెకొస్తు వరకు ఎఫెసులో ఉండిపోతున్నాను, ఎందుకంటే ఇక్కడ క్రియాశీల సేవ కొరకు నాకు విశాల అవకాశములు ఉన్నాయి.\"",ref:"1 కొరింథీయులు 16:8-9"},
{id:663,topic:"అవకాశము",title:"కపెర్నహూము ఆయనను స్వీకరిస్తుంది",text:"నజరేతులో యేసు స్వాగతము నిరుత్సాహపరచేది. కానీ కపెర్నహూములో \"వారు ఆయన బోధకు ఆశ్చర్యపోయారు.\"",ref:"లూకా 4:28-29,30,32"},
{id:664,topic:"అవకాశము",title:"తానే చూడుటకు",text:"జక్కయ్య \"ఒక మేడిపండు చెట్టు ఎక్కాడు.\"",ref:"లూకా 19:1-4"},
{id:665,topic:"తల్లిదండ్రిత్వము",title:"దేవుని ఆజ్ఞ",text:"\"మంచి, సరైనది చేయుట ద్వారా నిత్యుని మార్గదర్శనములను అనుసరించుటకు తన కుమారులను, తన కుటుంబమును ఆజ్ఞాపించునట్లు.\"",ref:"ఆదికాండము 18:19"},
{id:666,topic:"తల్లిదండ్రిత్వము",title:"అతను మరల రానివ్వండి",text:"మానోహా, \"జన్మించబోయే బిడ్డకు మేము ఏమి చేయాలో మాకు బోధించనివ్వుము.\"",ref:"న్యాయాధిపతులు 13:8"},
{id:667,topic:"తల్లిదండ్రిత్వము",title:"గంభీరమైన అనుభవము",text:"\"అప్పుడు మనుష్యులు ప్రభువు నామమును ప్రార్థించుట ప్రారంభించారు.\"",ref:"ఆదికాండము 4:26"},
{id:668,topic:"తల్లిదండ్రిత్వము",title:"ఆధ్యాత్మిక బోధ",text:"\"మీ పిల్లలు మీతో, 'ఈ సేవ అంటే ఏమిటి?' అని అడిగినప్పుడు, మీరు ... చెప్పాలి.\"",ref:"నిర్గమకాండము 12:26-27"},
{id:669,topic:"తల్లిదండ్రిత్వము",title:"వారు తమ పిల్లలను తీసుకొని వచ్చారు",text:"\"ప్రజలు ఆయన తన చేతులను వారిపై ఉంచునట్లు శిశువులను ఆయన దగ్గరకు తీసుకొని రావడం ప్రారంభించారు.\"",ref:"లూకా 18:15"},
{id:670,topic:"తల్లిదండ్రిత్వము",title:"ఎవరు నిందార్హులు?",text:"\"బాప్తిస్ముడు యోహాను తలను ఇక్కడే ఒక పళ్ళెముపై నాకు ఇమ్ము.\"",ref:"మత్తయి 14:8"},
{id:671,topic:"పాల్గొనుట",title:"అతను వారితో కూర్చొన్నాడు",text:"\"వారు కూర్చున్న చోట నేను కూర్చొని ... వారి మధ్య ఏడు రోజులు ఉన్నాను.\"",ref:"యెహెజ్కేలు 3:15"},
{id:672,topic:"పాల్గొనుట",title:"ప్రేక్షకుడా పాల్గొనువాడా?",text:"దావీదు, \"నేను కేవలము ఒక ప్రశ్న అడిగాను.\"",ref:"1 సమూయేలు 17:28-29"},
{id:673,topic:"గతము",title:"ప్రాణాంతక పశ్చాత్తాపము",text:"\"కానీ అతని భార్య అతని వెనుక నుండి వెనుకకు చూచింది, ఆమె ఉప్పు స్తంభముగా మారింది.\"",ref:"ఆదికాండము 19:26"},
{id:674,topic:"గతము",title:"cherishe చేసుకొను జ్ఞాపకములు",text:"\"పూర్వ దినములు ఈ దినముల కంటే మేలు\" అని ఆశ్చర్యపోయారు.",ref:"ప్రసంగి 7:10"},
{id:675,topic:"గతము",title:"గతము నుండి నేర్చుకొనుట",text:"\"పూర్వ విషయముల జ్ఞాపకము లేదు.\"",ref:"ప్రసంగి 1:11"},
{id:676,topic:"పాస్టరు",title:"రాజులు ప్రవేశించు చోట",text:"\"యూదా రాజులు ప్రవేశించి, బయటకు వెళ్ళు బెన్యామీను ద్వారములో.\"",ref:"యిర్మీయా 17:19"},
{id:677,topic:"పాస్టరు",title:"పరీక్షకుడు, పరిశోధకుడు",text:"\"నేను నిన్ను నా ప్రజల మధ్య ఒక పరీక్షకునిగా, పరిశోధకునిగా చేసాను.\"",ref:"యిర్మీయా 6:27"},
{id:678,topic:"పాస్టరు",title:"దైవిక ఆమోదము",text:"\"నీ పరిచర్యను పూర్ణముగా నిరూపించుము.\"",ref:"2 తిమోతికి 4:5"},
{id:679,topic:"పాస్టరు",title:"స్పష్టమైన మాటల పట్ల ధిక్కారము",text:"\"అలాంటి వారికి ప్రవక్త ఒక శూన్యుడు, అబద్ధికుడు, ద్రాక్షారసము, మద్యముల గూర్చి ప్రవచిస్తానని వాగ్దానము చేసేవాడు!\"",ref:"మీకా 2:6,11"},
{id:680,topic:"పాస్టరు",title:"నేను కాదు, క్రీస్తు",text:"\"గర్వించువాడు ఇందులో గర్వించనివ్వండి, నాకు అంతర్దృష్టి ఉందని ... తెలుసుకోవడము.\"",ref:"యిర్మీయా 9:24"},
{id:681,topic:"పాస్టరు",title:"పలుచన చేయబడిన తీర్పు",text:"\"'అంతా బాగుంటుంది' అని వారు నిత్యుడు చెప్పినదానిని తృణీకరించు ప్రజలతో పునరావృత్తి చేస్తారు.\"",ref:"యిర్మీయా 23:16-17"},
{id:682,topic:"పాస్టరు",title:"పాస్టర్ల బాధ్యత",text:"\"మిస్పాలో సమస్త ఇశ్రాయేలును సమకూర్చుడి, తద్వారా నేను ప్రభువుతో మీ తరఫున మధ్యవర్తిత్వము చేయగలను.\"",ref:"1 సమూయేలు 7:5"},
{id:683,topic:"పాస్టరు",title:"వారు అవిధేయత చూపరు",text:"\"వారు ... నీ మాటలు వింటారు, కానీ వాటికి విధేయత చూపరు.\"",ref:"యెహెజ్కేలు 33:32"},
{id:684,topic:"సహనము",title:"అవసరమైనది",text:"\"వచ్చే సంవత్సరము అది ఫలము ఇచ్చిన యెడల మంచిది; ఇచ్చినట్లయితే నీవు దానిని నరికివేయుము.\"",ref:"లూకా 13:9"},
{id:685,topic:"సహనము",title:"ఒక క్రైస్తవ క్రమశిక్షణ",text:"\"ఉన్నత స్థానము నుండి శక్తితో ధరించబడువరకు పట్టణములో ఓర్పుగా వేచియుండుడి.\"",ref:"లూకా 24:49"},
{id:686,topic:"సహనము",title:"దినము కొరకు వేచియుండుట",text:"\"వెనుక భాగము నుండి నాలుగు లంగరులు వేసి, ఉదయము రావలెనని ప్రార్థన చేసారు.\"",ref:"అపొస్తలుల కార్యములు 27:29"},
{id:687,topic:"శాంతి",title:"శాంతి మార్గము",text:"\"వారు అతని నుండి శాంతితో వెళ్ళిపోయారు.\"",ref:"ఆదికాండము 26:31"},
{id:688,topic:"శాంతి",title:"పడవను ఊపకుడి",text:"అహాబు ఎలీయాను \"ఇశ్రాయేలును కలవరపరచువాడు\" అన్నాడు.",ref:"1 రాజులు 18:17"},
{id:689,topic:"శాశ్వతత్వము",title:"గడిచిపోయే దర్శనము",text:"\"మేము ఇక్కడ ఉండుట మంచిది. మూడు గుడారములు వేయనివ్వుము.\"",ref:"లూకా 9:33"},
{id:690,topic:"పట్టుదల",title:"పరలోక ద్వారములను బలవంతము చేయుట",text:"పొరుగువాడు చివరకు అయిష్టముగా అంగీకరించువరకు అతనిని వేధించుట కొనసాగించాడు.",ref:"లూకా 11:5-10"},
{id:691,topic:"పట్టుదల",title:"విధవరాలి అభ్యర్థన",text:"ఒక విధవరాలి నిరంతరము తన క్లెయిమ్ కొరకు యాచించినప్పుడు, న్యాయమైన దేవుడు ఇంతకంటే ఎంత సిద్ధముగా స్పందిస్తాడు!",ref:"లూకా 18:1-8"},
{id:692,topic:"దృక్పథము",title:"దృష్టికోణము",text:"\"ఏదో ఒకదాని గూర్చి మనుష్యులు, 'ఆహా, ఇది క్రొత్తది!' అని చెప్పవచ్చు — కానీ అది మన కాలమునకు చాలా ముందే ఉనికిలో ఉంది.\"",ref:"ప్రసంగి 1:10"},
{id:693,topic:"దృక్పథము",title:"దేవుని ఉన్నత స్థానము",text:"\"నీవు మనుష్యుల దృష్టికోణము నుండి, దేవుని నుండి కాదు విషయములను చూస్తావు.\"",ref:"మత్తయి 16:23"},
{id:694,topic:"ప్రణాళిక",title:"రక్షణ నమూనా",text:"\"మీరు మీ సమస్త హృదయముతో ప్రభువు వైపు తిరుగుతున్న యెడల.\"",ref:"1 సమూయేలు 7:3"},
{id:695,topic:"ప్రణాళిక",title:"ఆయన మన మార్గమును చిత్రించును",text:"\"మీ కొరకు నాకు ఉన్న ప్రణాళికలు నాకు తెలుసు ... క్షేమము కొరకు, కీడు కొరకు కాదు.\"",ref:"యిర్మీయా 29:11"},
{id:696,topic:"ప్రణాళిక",title:"వ్యతిరేక ప్రణాళికలు",text:"\"నీవు అబద్ధము చెబుతున్నావు.\"",ref:"యిర్మీయా 43:2"},
{id:697,topic:"ప్రణాళిక",title:"తక్షణ ప్రణాళిక",text:"పౌలు, దర్శనమును అనుమానించకుండా గానీ, సందేహించకుండా గానీ, బయలుదేరుటకు తక్షణ ప్రణాళికలు చేసాడు.",ref:"అపొస్తలుల కార్యములు 16:9"},
{id:698,topic:"ప్రజాదరణ",title:"అతను వారి హృదయములను దొంగిలించాడు",text:"అబ్షాలోము \"ఇశ్రాయేలు మనుష్యుల హృదయములను దొంగిలించాడు.\"",ref:"2 సమూయేలు 15:6"},
{id:699,topic:"ప్రజాదరణ",title:"అప్రజాదరణ మాటలు",text:"\"ఆమోసు ఇశ్రాయేలు మధ్యలో నీకు వ్యతిరేకముగా కుట్ర పన్నాడు.\"",ref:"ఆమోసు 7:10"},
{id:700,topic:"ప్రజాదరణ",title:"ప్రజాదరణ ధర",text:"\"పిలాతు జన సమూహమును సంతోషపరచాలని కోరాడు, వారి కొరకు బరబ్బాను విడుదల చేసాడు.\"",ref:"మార్కు 15:15"},
{id:701,topic:"ప్రజాదరణ",title:"వారు cherishe చేసిన ప్రశంస",text:"\"వారు దేవుని ప్రశంస కంటే మనుష్యుల ప్రశంసను ఎక్కువ ప్రేమించారు.\"",ref:"యోహాను 12:42-43"},
{id:702,topic:"ప్రార్థన",title:"ఎదురుచూచు ప్రార్థన",text:"\"మరల ఏడుసార్లు వెళ్ళుము.\" ఏడవసారి \"మనుష్యుని అరచేయి వలె ఒక చిన్న మేఘము.\"",ref:"1 రాజులు 18:42-44"},
{id:703,topic:"ప్రార్థన",title:"అతని ప్రార్థనకు జవాబు",text:"\"ఇస్సాకు సాయంత్రము పొలములో ధ్యానించుటకు బయలుదేరాడు ... ఇదిగో, ఒంటెలు వస్తున్నాయి.\"",ref:"ఆదికాండము 24:63"},
{id:704,topic:"ప్రార్థన",title:"పేతురు తట్టుట కొనసాగించాడు",text:"\"పేతురు తట్టుట కొనసాగించాడు.\"",ref:"అపొస్తలుల కార్యములు 12:16"},
{id:705,topic:"ప్రార్థన",title:"నీ చిత్తము జరుగును గాక",text:"\"ఆయన వారి అభ్యర్థనను ఇచ్చాడు; కానీ వారి ఆత్మలో క్షీణతను పంపాడు.\"",ref:"కీర్తనలు 106:15"},
{id:706,topic:"ప్రార్థన",title:"బలపరచబడిన ప్రార్థనలు",text:"\"మేము మా దేవునికి ప్రార్థన చేసి, వారికి వ్యతిరేకముగా రాత్రి, పగలు రక్షణగా కాపలాదారుని ఏర్పాటు చేసాము.\"",ref:"నెహెమ్యా 4:9"},
{id:707,topic:"ప్రార్థన",title:"అర్ధ హృదయ అభ్యర్థనలు",text:"\"వారు తమ ప్రార్థనలలో హృదయము పెట్టలేదు, కానీ తమ బలిపీఠముల పక్కన ధాన్యము, ద్రాక్షారసము కొరకు మొరపెట్టుకుంటారు.\"",ref:"హోషేయ 7:14"},
{id:708,topic:"ప్రార్థన",title:"విషయముల కదలిక",text:"\"వారు సమావేశమైన స్థలము కదిలింది.\"",ref:"అపొస్తలుల కార్యములు 4:31"},
{id:709,topic:"ప్రార్థన",title:"ఒక ప్రైవేటు విషయము",text:"\"మీరు ప్రార్థన చేయాలనుకున్నప్పుడు, మీ ప్రైవేటు గదిలోనికి ప్రవేశించి.\"",ref:"మత్తయి 6:6"},
{id:710,topic:"ప్రార్థన",title:"స్ట్రెయిట్ వీధిలో ప్రార్థన",text:"\"అతను ఈ క్షణమే ప్రార్థన చేస్తున్నాడు.\"",ref:"అపొస్తలుల కార్యములు 9:11"},
{id:711,topic:"ప్రార్థన",title:"ఉదయపు ప్రార్థనలు",text:"\"వారు ఉదయమున ప్రారంభముగా లేచి, ప్రభువు ముందు ఆరాధించారు.\"",ref:"1 సమూయేలు 1:19"},
{id:712,topic:"ప్రార్థన",title:"ఆధారము చేయు జాగరణలు",text:"\"ఆయన జన సమూహములను పంపివేసిన తరువాత, ప్రార్థన చేయుటకు ఒక కొండపైకి ఒంటరిగా వెళ్ళాడు.\"",ref:"మత్తయి 14:23"},
{id:713,topic:"పక్షపాతము",title:"దుఃఖపు పులుసు",text:"హామాను, \"ఇది నాకు ఏమీ ఉపయోగపడదు\" అని విలపించాడు.",ref:"ఎస్తేరు 5:13"},
{id:714,topic:"పక్షపాతము",title:"లెక్స్ టాలియోనిస్",text:"\"యూదులు తమ సమస్త శత్రువులను కత్తి పోటు, వధ, నాశనముతో కొట్టారు.\"",ref:"ఎస్తేరు 9:5"},
{id:715,topic:"పక్షపాతము",title:"యోనా కోపము",text:"నీనెవీయుల పట్ల యోనా పక్షపాతము అంత గొప్పది, వారు పశ్చాత్తాపపడినప్పుడు అతను కోపగించాడు.",ref:"యోనా 3:4-4:1"},
{id:716,topic:"సిద్ధత",title:"ఓర్పుగల సిద్ధత",text:"\"ఫరో ప్రజలను పంపినప్పుడు, దేవుడు వారిని ఫిలిష్తీయుల దేశపు మార్గము గుండా నడిపించలేదు, అది సమీపములో ఉన్నప్పటికీ.\"",ref:"నిర్గమకాండము 13:17"},
{id:717,topic:"సిద్ధత",title:"అతను సమృద్ధిగా సిద్ధము చేసాడు",text:"\"కాబట్టి దావీదు తన మరణమునకు ముందు సమృద్ధిగా సిద్ధము చేసాడు.\"",ref:"1 దినవృత్తాంతములు 22:5"},
{id:718,topic:"సిద్ధత",title:"అరేబియా నివాసము",text:"పౌలు \"అరేబియాకు వెళ్ళాడు. ... తరువాత మూడు సంవత్సరముల తరువాత ... యెరూషలేముకు వెళ్ళాడు.\"",ref:"గలతీయులు 1:17-18"},
{id:719,topic:"సిద్ధత",title:"ఎండిన దీపములు",text:"\"మా దీపములు ఆరిపోతున్నాయి!\"",ref:"మత్తయి 25:8-9"},
{id:720,topic:"సిద్ధత",title:"అతనికి తెలిసి ఉంటే",text:"\"ఇంటి యజమానికి దొంగ ఏ గంటకు వస్తాడో తెలిసి ఉంటే, అతను మేల్కొని ఉండేవాడు.\"",ref:"లూకా 12:39"},
{id:721,topic:"సిద్ధత",title:"అతని హృదయము సిద్ధము చేయబడింది",text:"సౌలు \"అతని మరణమునకు మౌన సమ్మతి ఇచ్చాడు.\"",ref:"అపొస్తలుల కార్యములు 8:1"},
{id:722,topic:"గర్వము",title:"అద్దముల ఇల్లు",text:"\"వారు చేయుచున్నదంతా ... తమను తాము కొలుచుకొనుట.\"",ref:"2 కొరింథీయులు 10:12"},
{id:723,topic:"గర్వము",title:"ఏమి ఉందో చూడండి",text:"హిజ్కియా \"తన విలువైన వస్తువుల ఇంటిని ... చూపించాడు.\"",ref:"2 రాజులు 20:13,17"},
{id:724,topic:"గర్వము",title:"నేను దేవుడను",text:"\"నీ హృదయము గర్వించెను, నీవు 'నేను దేవుడను' అని చెప్పుకొన్నావు.\"",ref:"యెహెజ్కేలు 28:2"},
{id:725,topic:"గర్వము",title:"గమనించని హెచ్చరిక",text:"\"ఇది నేను నా శక్తివంత శక్తితో కట్టిన గొప్ప బబులోను కాదా?\"",ref:"దానియేలు 4:27,30-31"},
{id:726,topic:"గర్వము",title:"ప్రాథమిక గొప్పలు",text:"\"ఆయుధములు ధరించువాడు ఆయుధములు తీసివేయువాని వలె గొప్పలు చెప్పుకోకూడదు.\"",ref:"1 రాజులు 20:11"},
{id:727,topic:"గర్వము",title:"మహిమ మార్గములు",text:"\"నేను ఆకాశమునకు ఆరోహణము చేస్తాను.\"",ref:"యెషయా 14:13-14"},
{id:728,topic:"గర్వము",title:"తెలివి యొక్క బలులు",text:"\"ఇది నిన్ను తప్పుదారి పట్టించినది నీ స్వంత మాయా నైపుణ్యము.\"",ref:"యెషయా 47:10"},
{id:729,topic:"గర్వము",title:"తుది మాట",text:"\"నా బలమైన చేయి అంతా చేసింది, నా తెలివైన వ్యూహము.\"",ref:"యెషయా 10:13-14"},
{id:730,topic:"గర్వము",title:"బలముచే కాదు",text:"ప్రభువు గిద్యోనుకు తన యోధుల సంఖ్యను గణనీయముగా తగ్గించమని చెప్పాడు.",ref:"న్యాయాధిపతులు 7:2-3"},
{id:731,topic:"గర్వము",title:"సీయోను గర్విష్ఠ కుమార్తెలు",text:"\"చాచిన మెడలతో నడుస్తారు, కళ్ళతో కామాతురముగా చూస్తారు.\"",ref:"యెషయా 3:16"},
{id:732,topic:"గర్వము",title:"దేవాలయములో స్నాబ్",text:"తన స్వ-నీతిపై గర్వించి, సాధారణ మట్టి నుండి తనను తాను వేరు చేసుకొను నేటి మత స్నాబ్.",ref:"లూకా 18:9-14"},
{id:733,topic:"గర్వము",title:"గర్వపు విలాసము",text:"\"నీకు ఇవ్వబడని ఏమి నీవు కలిగి ఉన్నావు?\"",ref:"1 కొరింథీయులు 4:7"},
{id:734,topic:"వాగ్దానము",title:"వారు వర్ధిల్లుతారు",text:"\"వారు తిరిగి వచ్చి, నా నీడ క్రింద నివసిస్తారు, వారు ఒక తోట వలె వర్ధిల్లుతారు.\"",ref:"హోషేయ 14:7"},
{id:735,topic:"వాగ్దానము",title:"నేను నీతో ఉంటాను",text:"\"నేను నీతో ఉంటాను. మరియు నేనే నిన్ను పంపానని ఇది నీకు రుజువు.\"",ref:"నిర్గమకాండము 3:12"},
{id:736,topic:"వాగ్దానము",title:"మిడతల సంవత్సరములు",text:"\"మిడతలు తిన్న సంవత్సరములను నేను మీకు తిరిగి ఇస్తాను.\"",ref:"యోవేలు 2:25"},
{id:737,topic:"ఉద్దేశము",title:"మరచిపోయిన కూజా",text:"\"తన కూజాను విడిచిపెట్టింది.\"",ref:"యోహాను 4:28"},
{id:738,topic:"ఉద్దేశము",title:"గురువు మిషన్",text:"\"ఇప్పుడు ఆయన ఒక నిజమైన పాపి దగ్గర ఉండుటకు వెళ్ళాడు.\"",ref:"లూకా 19:7"},
{id:739,topic:"ఉద్దేశము",title:"సవాలు ప్రేరణ",text:"ఓత్నీయేలు దెబీరును స్వాధీనము చేసుకొన్నాడు.",ref:"యెహోషువ 15:16-17"},
{id:740,topic:"ఉద్దేశము",title:"నిర్ణయించిన ముఖము",text:"\"ప్రభువా, వారిని దహించుటకు ఆకాశము నుండి అగ్నిని పిలువగలమా?\"",ref:"లూకా 9:54"},
{id:741,topic:"ఉద్దేశము",title:"చివరకు రోముకు",text:"\"అలా మేము రోముకు వచ్చాము.\"",ref:"అపొస్తలుల కార్యములు 28:14"},
{id:742,topic:"సమాధానము",title:"శత్రువుకు ఆహారము",text:"\"సిరియన్లు ఇశ్రాయేలు దేశముపై ఇక దాడులు చేయలేదు.\"",ref:"2 రాజులు 6:23"},
{id:743,topic:"సమాధానము",title:"గొర్రె పిల్ల, సింహము",text:"\"తోడేలు గొర్రె పిల్లతో నివసిస్తుంది, చిరుతపులి మేక పిల్లతో పడుకుంటుంది.\"",ref:"యెషయా 11:6"},
{id:744,topic:"సమాధానము",title:"మరొక తప్పించుకొను మార్గము లేదు",text:"అమ్నోను \"ఆమెను అత్యధికముగా ద్వేషించాడు.\"",ref:"2 సమూయేలు 13:15"},
{id:745,topic:"సమాధానము",title:"దేవదూతలచే కలవబడెను",text:"\"యాకోబు తన మార్గములో వెళ్ళాడు, దేవుని దూతలు అతనిని కలిసారు.\"",ref:"ఆదికాండము 32:1-2"},
{id:746,topic:"సమాధానము",title:"దైవిక సమాధానకర్త",text:"\"ఓ, మన మధ్య ఒక మధ్యవర్తి ఉండి.\"",ref:"యోబు 9:33"},
{id:747,topic:"తిరస్కరణ",title:"వారు ఎగతాళి కొనసాగించారు",text:"\"వారు దేవుని సందేశకులను ఎగతాళి చేయుట కొనసాగించారు.\"",ref:"2 దినవృత్తాంతములు 36:15-16"},
{id:748,topic:"తిరస్కరణ",title:"దేవుడు తిరస్కరించిన మనిషి",text:"సౌలు \"అతని పైవస్త్రపు అంచును పట్టుకొన్నాడు, అది చిరిగిపోయింది.\"",ref:"1 సమూయేలు 15:26-27"},
{id:749,topic:"మతము",title:"సేవకుని పని",text:"\"భూమిపై నిజ మతమును స్థిరపరచువరకు ఆయన విరగడు గానీ, మసకబారడు గానీ.\"",ref:"యెషయా 42:3-4"},
{id:750,topic:"మతము",title:"వారు వినాలనుకొన్నది",text:"\"మాకు మృదువైన విషయములు మాట్లాడుడి, భ్రమలను ప్రవచించుడి.\"",ref:"యెషయా 30:10-11"},
{id:751,topic:"మతము",title:"భద్రత అంచు",text:"వారు \"తెలియని దేవునికి\" ఒక బలిపీఠమును కూడా స్థాపించారు.",ref:"అపొస్తలుల కార్యములు 17:23"},
{id:752,topic:"మతము",title:"పొట్టి మంచము, ఇరుకు దుప్పటి",text:"\"మంచము ఒక మనిషి దానిపై చాచుకొనుటకు చాలా పొట్టిది.\"",ref:"యెషయా 28:20"},
{id:753,topic:"మతము",title:"కంఠస్థ మతము",text:"\"వారి మతము ఒక ఎగతాళి, కంఠస్థముగా నేర్చుకొన్న సాంప్రదాయము మాత్రమే.\"",ref:"యెషయా 29:13"},
{id:754,topic:"జ్ఞాపకము",title:"బండ వైపు చూడుము",text:"\"మీరు ఎక్కడి నుండి చెక్కబడ్డారో ఆ బండ వైపు చూడుడి.\"",ref:"యెషయా 51:1"},
{id:755,topic:"జ్ఞాపకము",title:"మేకులు లోపలికి కొట్టబడెను",text:"\"జ్ఞానవంతుని మాటలు మేకుల వలె.\"",ref:"ప్రసంగి 12:11"},
{id:756,topic:"జ్ఞాపకము",title:"పానదాయకుడు ఏమి మరచిపోయాడు",text:"\"అయినప్పటికీ ప్రధాన పానదాయకుడు యోసేపును జ్ఞాపకము చేసుకోలేదు.\"",ref:"ఆదికాండము 40:14,23"},
{id:757,topic:"జ్ఞాపకము",title:"అతను యోసేపును తెలియడు",text:"\"యోసేపును తెలియని ఒక క్రొత్త రాజు లేచాడు.\"",ref:"నిర్గమకాండము 1:8"},
{id:758,topic:"జ్ఞాపకము",title:"స్మారక దినము",text:"\"ఈ దినము మీకు ఒక జ్ఞాపికగా ఉండాలి.\"",ref:"నిర్గమకాండము 12:14"},
{id:759,topic:"జ్ఞాపకము",title:"జ్ఞాపకము కొరకు అంచు",text:"\"అంచు అంచుపై నీలి పట్టీ పెట్టించ\"మని దేవుడు చెప్పాడు.",ref:"సంఖ్యాకాండము 15:38"},
{id:760,topic:"జ్ఞాపకము",title:"గత విషయముల జ్ఞాపకము",text:"\"ఇంతవరకు ప్రభువు మనకు సహాయము చేసాడు.\"",ref:"1 సమూయేలు 7:12"},
{id:761,topic:"జ్ఞాపకము",title:"మరియ ఏమి జ్ఞాపకము చేసుకొన్నది",text:"\"మరియ ఈ సమస్త విషయములను జ్ఞాపకము చేసుకొని, తన హృదయములో ఆలోచించుకొంది.\"",ref:"లూకా 2:19"},
{id:762,topic:"నవీకరణ",title:"ఆధ్యాత్మిక చికిత్స",text:"సౌలు, \"నేను పాపము చేసాను ... నేను మూర్ఖునిగా నటించాను\" అన్నాడు.",ref:"1 సమూయేలు 26:21"},
{id:763,topic:"నవీకరణ",title:"పునరుద్ధరించబడిన ప్రమాణములు",text:"\"ప్రభువు ఈ ఒడంబడికను మా పితరులతో కాదు, కానీ మనతో చేసాడు.\"",ref:"ద్వితీయోపదేశము 5:3"},
{id:764,topic:"నవీకరణ",title:"నవీకరించబడిన భక్తి",text:"\"లేచి, బేతేలుకు వెళ్ళి ... నీకు ప్రత్యక్షమైన దేవునికి అక్కడ ఒక బలిపీఠమును చేయుము.\"",ref:"ఆదికాండము 35:1"},
{id:765,topic:"నవీకరణ",title:"పై గదికి తిరిగి",text:"\"పట్టణములోనికి ప్రవేశించిన తరువాత వారు, తాము సమావేశమయ్యే అలవాటు ఉన్న పై గదికి వెళ్ళారు.\"",ref:"అపొస్తలుల కార్యములు 1:13"},
{id:766,topic:"నవీకరణ",title:"స్వస్థపరచు చూపు",text:"\"ప్రభువు తిరిగి, పేతురు వైపు చూచాడు. పేతురు జ్ఞాపకము చేసుకొన్నాడు.\"",ref:"లూకా 22:61"},
{id:767,topic:"నవీకరణ",title:"నవీకరించబడిన మనస్సులు",text:"\"మీ మనస్సుల పూర్ణ నవీకరణచే మార్చబడుడి.\"",ref:"రోమీయులు 12:2"},
{id:768,topic:"పశ్చాత్తాపము",title:"ఈసారి అతను వెళ్ళాడు",text:"\"ప్రభువు వాక్యము రెండవసారి యోనాకు వచ్చింది. ... కాబట్టి యోనా లేచి, నీనెవెకు వెళ్ళాడు.\"",ref:"యోనా 3:1,3"},
{id:769,topic:"ఖ్యాతి",title:"ధనము కంటే మేలు",text:"\"మంచి పేరు గొప్ప ధనము కంటే ఎక్కువగా ఎన్నుకోబడుతుంది.\"",ref:"సామెతలు 22:1"},
{id:770,topic:"ఖ్యాతి",title:"అతను ఒక పేరు గెలుచుకొన్నాడు",text:"\"దావీదు తనకు ఒక పేరు గెలుచుకొన్నాడు.\"",ref:"2 సమూయేలు 8:13"},
{id:771,topic:"ఖ్యాతి",title:"పశ్చాత్తాపము లేదు",text:"\"అతను ఎవరి పశ్చాత్తాపము లేకుండా వెళ్ళిపోయాడు.\"",ref:"2 దినవృత్తాంతములు 21:20"},
{id:772,topic:"ఖ్యాతి",title:"దానముతో సమానార్థము",text:"దొర్కా \"దాన క్రియలు\" చేసింది.",ref:"అపొస్తలుల కార్యములు 9:39"},
{id:773,topic:"ఖ్యాతి",title:"ఒక ఖ్యాతి మాత్రమే",text:"\"జీవించియున్నావని ఖ్యాతి ఉంది, కానీ వాస్తవానికి నీవు చనిపోయావు.\"",ref:"ప్రకటన 3:1-2"},
{id:774,topic:"బాధ్యత",title:"స్వీయముపై దృష్టి",text:"అహాబు, \"పోరాటమును ఎవరు ప్రారంభించాలి?\" అని అడిగాడు. ప్రవక్త, \"నీవు\" అని జవాబిచ్చాడు.",ref:"1 రాజులు 20:13-14"},
{id:775,topic:"బాధ్యత",title:"అలాంటి సమయము కొరకు",text:"\"ఈ సమయము కొరకే నీవు రాజ్యములోనికి వచ్చావో ఎవరికి తెలుసు?\"",ref:"ఎస్తేరు 4:13-14"},
{id:776,topic:"బాధ్యత",title:"మిగిలినవారు",text:"\"ఇన్నూరు మంది సామానులతో మిగిలిపోయారు.\"",ref:"1 సమూయేలు 25:13"},
{id:777,topic:"బాధ్యత",title:"ఆధ్యాత్మిక రోలాండ్లు",text:"\"నేను క్రేతెలో నిన్ను విడిచిపెట్టినది విషయములను సరిగా చేయుటకే.\"",ref:"తీతుకు 1:5"},
{id:778,topic:"బాధ్యత",title:"ప్రజలే చేసారు",text:"ఆరోను, \"ఈ దూడ బయటకు వచ్చింది\" అన్నాడు.",ref:"నిర్గమకాండము 32:24"},
{id:779,topic:"బాధ్యత",title:"నేను కాదు!",text:"ఆదాము, \"నీవు నాతో ఉండుటకు ఇచ్చిన స్త్రీ, ఆమె నాకు వృక్ష ఫలమును ఇచ్చింది\" అన్నాడు.",ref:"ఆదికాండము 3:12-13"},
{id:780,topic:"బాధ్యత",title:"అసంపూర్ణ పని",text:"ఫెలిక్సు \"సంకెళ్ళలో విడిచిపెట్టబడిన ఒక నిర్దిష్ట మనిషి ఉన్నాడు.\"",ref:"అపొస్తలుల కార్యములు 25:14"},
{id:781,topic:"బాధ్యత",title:"పూర్తిగా నిశ్చలము",text:"గల్లియో \"పూర్తిగా నిశ్చలముగా ఉన్నాడు.\"",ref:"అపొస్తలుల కార్యములు 18:17"},
{id:782,topic:"బాధ్యత",title:"అది మీ విషయము",text:"పిలాతు, \"ఈ మంచి మనిషి రక్తమునకు నేను నిర్దోషిని. అది మీ విషయము!\" అన్నాడు.",ref:"మత్తయి 27:24"},
{id:783,topic:"బాధ్యత",title:"ప్రేరేపించు క్షణము",text:"\"తాము విన్న, చూచిన సమస్త విషయములకు దేవునికి మహిమ, స్తుతి చెప్పుచూ తిరిగి వెళ్ళారు.\"",ref:"లూకా 2:20"},
{id:784,topic:"బాధ్యత",title:"బేతని ఆవల",text:"\"అతను వారిని బేతని సమీపించువరకు నడిపించాడు; అప్పుడు ... అతను వారిని విడిచిపెట్టాడు.\"",ref:"లూకా 24:50-51"},
{id:785,topic:"స్పందన",title:"నేను ఒప్పించబడ్డాను",text:"\"నిత్యుడా, నీవు నన్ను ఒప్పించావు, నేను నన్ను నేను ఒప్పించనిచ్చాను!\"",ref:"యిర్మీయా 20:7"},
{id:786,topic:"స్పందన",title:"తెరిచిన హృదయములు",text:"\"నా హృదయము మీ కొరకు విశాలముగా తెరిచి ఉంది.\"",ref:"2 కొరింథీయులు 6:11,13"},
{id:787,topic:"స్పందన",title:"యేసు అతనిని చూచాడు",text:"జక్కయ్య ఒక మేడిపండు చెట్టు ఎక్కిన తరువాత, యేసు అతనిని చూచాడు.",ref:"లూకా 19:5"},
{id:788,topic:"స్పందన",title:"మంచిది ఏదీ నశించదు",text:"\"దేవుడు అదృశ్యమయ్యే దానిని ఎల్లప్పుడూ తిరిగి తీసుకొని వస్తాడు.\"",ref:"ప్రసంగి 3:15"},
{id:789,topic:"స్పందన",title:"పూర్ణ హృదయ స్పందన",text:"\"ఇదిగో, మేము సమస్తమును విడిచిపెట్టి, నిన్ను అనుసరించాము.\"",ref:"లూకా 18:28"},
{id:790,topic:"స్పందన",title:"వారు స్పందిస్తారా?",text:"అబ్రహాము వారి కఠిన హృదయములు స్పందిస్తాయని సందేహించాడు.",ref:"లూకా 16:27-31"},
{id:791,topic:"స్పందన",title:"మాటల కంటే ఎక్కువ కాదు",text:"\"నేను చదవలేను; గ్రంథము మూసి ఉంది.\"",ref:"యెషయా 29:11-12"},
{id:792,topic:"స్పందన",title:"తొందరతో",text:"\"వారు తొందరతో వెళ్ళారు.\"",ref:"లూకా 2:15-16"},
{id:793,topic:"పునరుత్థానము",title:"శుభోదయము!",text:"యేసు, \"శుభోదయము!\" అన్నాడు.",ref:"మత్తయి 28:9"},
{id:794,topic:"పునరుత్థానము",title:"కథ ముగింపు",text:"\"కానీ వారు సమాధి నుండి పారిపోయారు ... వారు ఎవరికీ ఏమీ చెప్పలేదు, ఎందుకంటే వారు భయపడ్డారు —\"",ref:"మార్కు 16:8"},
{id:795,topic:"పునరుత్థానము",title:"వారు తమ వీపులు తిప్పారు",text:"\"వారు సమాధికి తమ వీపులు తిప్పి, ఈ సమస్తమును పదకొండు మందికి చెప్పారు.\"",ref:"లూకా 24:9"},
{id:796,topic:"పునరుత్థానము",title:"చనిపోయినవారి మధ్య కాదు",text:"\"జీవించువాని కొరకు చనిపోయినవారి మధ్య ఎందుకు వెతుకుతారు?\"",ref:"లూకా 24:5"},
{id:797,topic:"పునరుత్థానము",title:"నేను చేపలు పట్టుటకు వెళ్తున్నాను",text:"పేతురు, \"నేను చేపలు పట్టుటకు వెళ్తున్నాను\" అన్నాడు.",ref:"యోహాను 21:3"},
{id:798,topic:"పునరుత్వము",title:"దైవిక పరిహారము",text:"లాజరు \"అబ్రహాము ఒడిలో సురక్షితముగా విశ్రాంతి తీసుకొన్నాడు.\"",ref:"లూకా 16:20-25"},
{id:799,topic:"ప్రతీకారము",title:"కవితా న్యాయము",text:"\"వారు హామానును, అతను మొర్దెకై కొరకు సిద్ధము చేసిన ఉరి స్తంభముపై ఉరితీసారు.\"",ref:"ఎస్తేరు 7:10"},
{id:800,topic:"ప్రతీకారము",title:"విరోధాభాస",text:"అమాలేకీయుడు తాను ప్రాణాంతక గాయము చేసానని క్లెయిమ్ చేసాడు. విరోధాభాసముగా, దావీదు అతనిని చంపమని ఆజ్ఞాపించాడు.",ref:"2 సమూయేలు 1:1-16"},
{id:801,topic:"ప్రతీకారము",title:"దేవుని గొప్ప ఉద్దేశములు",text:"\"మీరు నాకు వ్యతిరేకముగా కీడు భావించారు, కానీ దేవుడు దానిని మేలు కొరకు ఉద్దేశించాడు.\"",ref:"ఆదికాండము 50:20"},
{id:802,topic:"ప్రతీకారము",title:"ఒక స్త్రీ ప్రతీకారము",text:"ఎలీయా \"అరణ్యములో ఒక రోజు ప్రయాణము\" పారిపోయాడు.",ref:"1 రాజులు 19:4"},
{id:803,topic:"ప్రతీకారము",title:"ఒక ప్రవక్త ప్రతీకారము తీసుకొంటాడు",text:"ఎలీషా ప్రతీకారపూర్వకముగా ఆ చిన్నవారిపై ఎలుగుబంట్లను రప్పించాడు.",ref:"2 రాజులు 2:23-24"},
{id:804,topic:"ప్రతీకారము",title:"క్రూర సంతృప్తి",text:"సమ్సోను ప్రతీకార ప్రార్థన జవాబు ఇవ్వబడింది, కానీ అతను కూడా నాశనము చేయబడ్డాడు.",ref:"న్యాయాధిపతులు 16:28"},
{id:805,topic:"ప్రతీకారము",title:"నాశనము కొరకు విజ్ఞప్తి",text:"హామాను సమస్త యూదులపై ప్రతీకారము తీసుకొన్నాడు.",ref:"ఎస్తేరు 3:8-9"},
{id:806,topic:"బహుమతి",title:"అయినప్పటికీ నేను ఆనందిస్తాను",text:"\"అంజూరు చెట్టు పుష్పించకపోయినా ... అయినప్పటికీ నేను ప్రభువులో ఆనందిస్తాను.\"",ref:"హబక్కూకు 3:17-18"},
{id:807,topic:"బహుమతి",title:"ఎల్లప్పుడూ కలిసి",text:"\"కుమారుడా, నీవు ఎల్లప్పుడూ నాతో ఉన్నావు.\"",ref:"లూకా 15:29,31"},
{id:808,topic:"బహుమతి",title:"అమ్మకానికి కాదు",text:"దానియేలు, \"నీ కానుకలు నీకే ఉండనివ్వు, నీ బహుమతులు మరొకరికి ఇవ్వుము.\"",ref:"దానియేలు 5:17"},
{id:809,topic:"బహుమతి",title:"ప్రతి మనిషి ధర",text:"\"యోబు దేవునికి ఉచితముగా భయపడతాడా?\"",ref:"యోబు 1:9"},
{id:810,topic:"బహుమతి",title:"నిజమైన బహుమతి",text:"హిజ్కియా \"తన సమస్త హృదయముతో చేసాడు, వర్ధిల్లాడు.\" కానీ వెంటనే \"అష్షూరు రాజు ... యూదాపై దాడి చేసాడు.\"",ref:"2 దినవృత్తాంతములు 31:21; 32:1"},
{id:811,topic:"బహుమతి",title:"ధనము కంటే పైన",text:"ప్రవక్త, \"నీవు నీ ఇంటిలో సగము నాకు ఇచ్చినను, నేను నీతో రాను\" అన్నాడు.",ref:"1 రాజులు 13:7-8"},
{id:812,topic:"ఎగతాళి",title:"మీ దేవుడు నిద్రిస్తున్నాడా?",text:"\"గట్టిగా అరవండి: ఎందుకంటే అతను ఒక దేవుడు; ... బహుశా నిద్రిస్తున్నాడు, మేల్కొలపవలసి ఉంది.\"",ref:"1 రాజులు 18:27"},
{id:813,topic:"ఎగతాళి",title:"కటువైన మాటలు",text:"\"కేవలము మాటలే యుద్ధమునకు వ్యూహము, శక్తి అని నీవు భావిస్తావా?\"",ref:"యెషయా 36:5,7"},
{id:814,topic:"ఎగతాళి",title:"ఇంతకుముందు ఇలా లేదు",text:"\"యెరూషలేములో ఇలాంటిది ఎన్నడూ లేదు.\"",ref:"2 దినవృత్తాంతములు 30:12,26"},
{id:815,topic:"ఎగతాళి",title:"గోడపై నక్క",text:"తోబీయా, \"ఒక నక్క దానిపై ఎక్కిన యెడల వారి రాతి గోడను పగులగొడుతుంది!\"",ref:"నెహెమ్యా 4:2-3"},
{id:816,topic:"ఎగతాళి",title:"నిన్ను ఎవరు కొట్టారు?",text:"\"ఇప్పుడు ప్రవక్తా, ఈసారి నిన్ను ఎవరు కొట్టారో ఊహించుము!\"",ref:"లూకా 22:64"},
{id:817,topic:"నీతి",title:"నీతి జీవితము",text:"\"నేను నా బాల్యము నుండి ఈ రోజు వరకు మీ ముందు నడిచాను.\"",ref:"1 సమూయేలు 12:1-2"},
{id:818,topic:"నీతి",title:"నీతి పులుసు",text:"\"పరలోక రాజ్యము పులుసు వలె ఉంది.\"",ref:"మత్తయి 13:33"},
{id:819,topic:"నీతి",title:"అవసరము, పరిణామము",text:"\"నియమింపబడిన దానికంటే ఎక్కువ వసూలు చేయకుడి.\"",ref:"లూకా 3:13"},
{id:820,topic:"నీతి",title:"పేదవారు కాదు, ధనవంతులు కాదు",text:"యిర్మీయా ఒక నీతిమంతుని కనుగొనలేకపోయాడు.",ref:"యిర్మీయా 5:4-5"},
{id:821,topic:"నీతి",title:"తృప్తి పరచని ఆకలి",text:"\"ఒక ఆకలిగొన్న మనిషి తాను తినుచున్నట్లు కలలు కని, మేల్కొన్నప్పుడు ఇంకా ఆకలిగా ఉన్నట్లు.\"",ref:"యెషయా 29:8"},
{id:822,topic:"నీతి",title:"భరించలేని మంచితనము",text:"\"నా వాక్యము మీ మధ్య ఎటువంటి పురోగతి సాధించలేదు!\"",ref:"యోహాను 8:37"},
{id:823,topic:"నీతి",title:"పేతురు లొంగిపోతాడు",text:"పేతురు \"యూదులు ఏమి ఆలోచిస్తారో అనే స్వచ్ఛ భయముతో\" వైదొలగాడు.",ref:"గలతీయులు 2:12"},
{id:824,topic:"నీతి",title:"వీరే అనీతిమంతులు",text:"\"వారు గాలిచే పైకి లేపబడిన మేఘములు వలె ఉన్నారు, కానీ వారు వర్షము తెచ్చరు.\"",ref:"యూదా 12-13"},
{id:825,topic:"నీతి",title:"మోసపూరిత పదబంధములు",text:"\"ఇది ప్రభువు మందిరము, ప్రభువు మందిరము, ప్రభువు మందిరము.\"",ref:"యిర్మీయా 7:4"},
{id:826,topic:"క్రూరత్వము",title:"పవిత్రమైనది ఏదీ లేదు",text:"\"వారు గొడ్డళ్ళతో తలుపులను పగులగొట్టారు.\"",ref:"కీర్తనలు 74:4-6"},
{id:827,topic:"క్రూరత్వము",title:"లించ్ మాబ్",text:"\"గొప్ప స్వరముతో అరిచి, తమ చెవులను మూసుకొని, ఏకమనస్సుతో అతనిపై దాడి చేసారు.\"",ref:"అపొస్తలుల కార్యములు 7:57"},
{id:828,topic:"త్యాగము",title:"వారు తమ ప్రాణములను పణము పెట్టారు",text:"దావీదు, \"ప్రాణములను పణము పెట్టి వెళ్ళిన మనుష్యుల రక్తమును నేను త్రాగునా?\"",ref:"2 సమూయేలు 23:17"},
{id:829,topic:"త్యాగము",title:"శరీర త్యాగములు",text:"\"న్యాయముగా చేయుట, కృపను ప్రేమించుట, నీ దేవునితో వినయముగా నడచుట.\"",ref:"మీకా 6:6-8"},
{id:830,topic:"త్యాగము",title:"అపూర్ణ త్యాగములు",text:"\"నీవు నీ శరీరములను జీవించు బలిగా, పవిత్రముగా, దేవునికి అంగీకారయోగ్యముగా అర్పించుడి.\"",ref:"రోమీయులు 12:1"},
{id:831,topic:"త్యాగము",title:"విధేయత, ఆలకించుట",text:"\"విధేయత బలి కంటే, ఆలకించుట పొట్టేళ్ళ కొవ్వు కంటే మేలు.\"",ref:"1 సమూయేలు 15:22"},
{id:832,topic:"అన్వేషణ",title:"ఫలము లేని అన్వేషణ",text:"\"యెరూషలేము వీధులలో పరుగెత్తి ... నీతిని చేయు, సత్యమును వెతుకు ఒక మనిషిని కనుగొనగలవా.\"",ref:"యిర్మీయా 5:1"},
{id:833,topic:"అన్వేషణ",title:"జాగ్రత్తతో వెతుకుము",text:"\"ఈ చిన్న బిడ్డ కొరకు అత్యంత జాగ్రత్తతో వెతకండి.\"",ref:"మత్తయి 2:8"},
{id:834,topic:"అన్వేషణ",title:"అనుపమాన అన్వేషణ",text:"\"నీచే బలపరచబడినవారు యాత్రకు బయలుదేరినవారు ధన్యులు!\"",ref:"కీర్తనలు 84:5"},
{id:835,topic:"స్వార్థము",title:"నా కాలములో కాదు",text:"\"కనీసము నా కాలములో శాంతి, భద్రత ఉంటాయి.\"",ref:"2 రాజులు 20:19"},
{id:836,topic:"స్వార్థము",title:"ఇప్పుడు కాదు",text:"\"ఈ మందిరము శిథిలావస్థలో ఉండగా, మీరు మీ పలకల ఇళ్ళలో నివసించుటకు ఇది సమయమా?\"",ref:"హగ్గయి 1:4"},
{id:837,topic:"స్వార్థము",title:"స్వ-కేంద్రిత సంభాషణ",text:"\"మార్గములో మీరు ఏమి వాదించారు?\" \"వారు ఏమీ చెప్పలేదు.\"",ref:"మార్కు 9:33-34"},
{id:838,topic:"స్వార్థము",title:"నాలుకపై బూడిద",text:"\"నేను ధనవంతుడను, ధనవంతుడను అయ్యాను.\"",ref:"ప్రసంగి 2:9-10"},
{id:839,topic:"స్వార్థము",title:"తగిన గౌరవము",text:"హామాను, అనుకోకుండా, రాజు తన ప్రాణ శత్రువు మొర్దెకైకు ఇచ్చిన గౌరవములను నిర్దేశించాడు.",ref:"ఎస్తేరు 6:1-11"},
{id:840,topic:"స్వార్థము",title:"హామీ లేదు",text:"తన సమృద్ధ పంటను నిల్వ చేయుటకు పెద్ద కొట్టములను నిర్మించిన ధనవంతుని కథ.",ref:"లూకా 12:16-21"},
{id:841,topic:"స్వార్థము",title:"అతని నిజ ప్రేరణ",text:"\"అతను పేదవారి పట్ల శ్రద్ధ కలిగి ఉండలేదు.\"",ref:"యోహాను 12:6"},
{id:842,topic:"స్వార్థము",title:"బాధ్యత విషయము",text:"\"మీరు విందు ఇచ్చినప్పుడు, పేదవారిని, కుంటివారిని, లంగడువారిని, గుడ్డివారిని పిలవండి.\"",ref:"లూకా 14:13-14"},
{id:843,topic:"స్వార్థము",title:"మేము మంచిగా చేయలేదు",text:"\"మేము మంచిగా చేయలేదు: ఈ రోజు శుభవార్త దినము, మేము మౌనముగా ఉన్నాము.\"",ref:"2 రాజులు 7:9"},
{id:844,topic:"స్వార్థము",title:"లోతు ఎన్నిక",text:"లోతు మరింత సారవంతమైన మేత భూములను పట్టుకొని, సొదొమలో తన గుడారము వేసాడు.",ref:"ఆదికాండము 13:5-13"},
{id:845,topic:"స్వార్థము",title:"యాబేజు ప్రార్థన",text:"\"ఓ, నీవు నన్ను వర్ధిల్లజేసి, నా వాటాను విశాలము చేయుము!\"",ref:"1 దినవృత్తాంతములు 4:10"},
{id:846,topic:"స్వార్థము",title:"స్వ-సేవకులు",text:"మీకా ప్రవక్తలను గద్దించాడు, వారు తమకు తినుటకు ఏదైనా ఉన్నప్పుడు 'శాంతి' అని అరిచి, వారి నోటిలో ఏమీ పెట్టనివానికి యుద్ధము ప్రకటిస్తారు.",ref:"మీకా 3:5"},
{id:847,topic:"సేవ",title:"సేవకుని పాత్ర",text:"\"ఆయన ... తనను తాను శూన్యము చేసికొని, సేవకుని స్వరూపమును ధరించుకొనెను.\"",ref:"ఫిలిప్పీయులు 2:6-7"},
{id:848,topic:"సేవ",title:"ఆయన ఒక తువ్వాలు తీసుకొన్నాడు",text:"యేసు \"తన వస్త్రములను పక్కన పెట్టాడు; ఒక తువ్వాలు తీసుకొన్నాడు ... శిష్యుల కాళ్ళు కడుగుట ప్రారంభించాడు.\"",ref:"యోహాను 13:4-5"},
{id:849,topic:"సేవ",title:"స్వస్థత ఉద్దేశము",text:"పేతురు అత్త \"వెంటనే ఆమె లేచి వారికి సేవ చేసింది.\"",ref:"లూకా 4:39"},
{id:850,topic:"సేవ",title:"భావోద్వేగము కాదు, సేవ",text:"రాజ్య పౌరసత్వము భావోద్వేగముపై కాదు, సేవపై ఆధారపడి ఉందని యేసు చూపించాడు.",ref:"మత్తయి 20:21"},
{id:851,topic:"సేవ",title:"ఎవరు అధిపతి కావాలనుకుంటారు",text:"\"మీలో ఎవరైనా అధిపతి కావాలనుకున్న యెడల, అతను మీ సేవకుడుగా ఉండనివ్వండి.\"",ref:"మత్తయి 20:27"},
{id:852,topic:"సేవ",title:"అతని ఊదా వస్త్రము క్రింద",text:"సమరయ రాజు \"తన చర్మము పక్కన గోనె ధరించి ఉన్నాడని\" ప్రజలు గమనించారు.",ref:"2 రాజులు 6:30"},
{id:853,topic:"పంచుకొనుట",title:"మాతో రండి",text:"మోషే హోబాబుతో, \"మాతో రండి, మేము నీకు మేలు చేస్తాము\" అన్నాడు.",ref:"సంఖ్యాకాండము 10:29"},
{id:854,topic:"పంచుకొనుట",title:"పంచుకొను జీవితము",text:"\"వారిలో ఎవరూ తమకు ఉన్న ఏదైనా తమ వ్యక్తిగత ఆస్తిగా భావించలేదు, వారు తమకు ఉన్న సమస్తమును ఒకరితో ఒకరు పంచుకొన్నారు.\"",ref:"అపొస్తలుల కార్యములు 4:32"},
{id:855,topic:"పంచుకొనుట",title:"నీవు వెళ్తే",text:"బారాకు, \"నీవు నాతో వచ్చిన యెడల, నేను వెళ్తాను.\"",ref:"న్యాయాధిపతులు 4:8"},
{id:856,topic:"దృష్టి",title:"పరలోక రథములు",text:"ఎలీషా, \"భయపడకుము, మనతో ఉన్నవారు వారితో ఉన్నవారి కంటే ఎక్కువ.\"",ref:"2 రాజులు 6:15-16"},
{id:857,topic:"దృష్టి",title:"ఆధ్యాత్మిక దృష్టి",text:"\"అతని కళ్ళు తెరిచి ఉన్నప్పటికీ అతను ఏమీ చూడలేకపోయాడు.\"",ref:"అపొస్తలుల కార్యములు 9:8"},
{id:858,topic:"దృష్టి",title:"ఇతరులకు కళ్ళు",text:"మోషే హోబాబుతో, \"నీవు మాకు కళ్ళుగా ఉంటావు.\"",ref:"సంఖ్యాకాండము 10:31"},
{id:859,topic:"దృష్టి",title:"ఎలుమా అంధత్వము",text:"\"ప్రభువు సరళ మార్గములను వక్రము చేయుట ఆపవా?\"",ref:"అపొస్తలుల కార్యములు 13:10"},
{id:860,topic:"పాపము",title:"బబులోనుకు పలాయనము",text:"\"యేసు క్రీస్తు రక్తము మాత్రమే సమస్త పాపము నుండి మనలను శుద్ధి చేస్తుంది.\"",ref:"1 యోహాను 1:7"},
{id:861,topic:"పాపము",title:"ఎవరికి వ్యతిరేకముగా పాపము చేస్తాము",text:"\"నేను ప్రభువుకు వ్యతిరేకముగా పాపము చేసాను.\"",ref:"2 సమూయేలు 12:13"},
{id:862,topic:"పాపము",title:"ఎరిగియే పాపము చేస్తాము",text:"\"నీవు ... ఇది యావత్తు ఎరిగియు, నీ హృదయమును తగ్గించుకొనలేదు.\"",ref:"దానియేలు 5:22"},
{id:863,topic:"పాపము",title:"నా పేరు లెజియన్",text:"\"నా పేరు లెజియన్ ... ఎందుకంటే మేము అనేకులము.\"",ref:"మార్కు 5:9"},
{id:864,topic:"పాపము",title:"పాపుల మిత్రుడు",text:"యేసు తన మిషన్ రక్షణ అవసరము అత్యధికముగా ఉన్నవారికి సేవ చేయు మిషన్గా గుర్తించాడు.",ref:"లూకా 5:29-32"},
{id:865,topic:"పాపము",title:"రెట్టింపు అపాయము",text:"సహోదరులు యోసేపు కోటును రక్తములో ముంచి, యాకోబుకు ఆ బాలుడు అడవి మృగములచే చంపబడ్డాడని సూచించారు.",ref:"ఆదికాండము 37:34"},
