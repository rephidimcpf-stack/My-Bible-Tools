<style>
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --accent: #1e3a5f;
  --accent2: #2563eb;
  --accent-light: #dbeafe;
  --border: #cbd5e1;
  --shadow: 0 1px 3px rgba(15,23,42,.08), 0 4px 12px rgba(15,23,42,.06);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --input-bg: #ffffff;
  --input-text: #0f172a;
}
[data-theme="dark"] {
  --bg: #0b1220;
  --card: #1a2332;
  --text: #f8fafc;
  --muted: #cbd5e1;
  --accent: #93c5fd;
  --accent2: #60a5fa;
  --accent-light: #1e3a5f;
  --border: #334155;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
  --input-bg: #1a2332;
  --input-text: #f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans Telugu', 'Noto Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Gautami', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  min-height: 100vh;
  transition: background .25s, color .25s;
  padding-bottom: calc(88px + var(--safe-bottom));
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  padding: 12px 16px calc(12px + var(--safe-top)) 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.hdr-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.hdr-title {
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.02em;
}
.hdr-title svg { width: 26px; height: 26px; flex-shrink: 0; }
.hdr-actions { display: flex; gap: 8px; }
.icon-btn {
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 1.1rem;
  transition: background .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.25); }
.icon-btn:active { background: rgba(255,255,255,.35); }

/* Search row */
.search-row {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  align-items: stretch;
}
.search-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
}
.search-wrap input {
  width: 100%;
  padding: 11px 14px 11px 42px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.95);
  color: #1a2332;
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.search-wrap input::placeholder { color: #94a3b8; }
.search-wrap svg {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  opacity: .45;
  pointer-events: none;
}
.cat-btn {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.2);
  color: #fff;
  font-family: inherit;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
}
.cat-btn:hover, .cat-btn:active { background: rgba(255,255,255,.32); }
.cat-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

/* Filter bar under search */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}
.scope-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex: 1;
  min-width: 0;
}
.scope-chip {
  padding: 5px 11px;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,.35);
  background: transparent;
  color: rgba(255,255,255,.9);
  font-size: .75rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.scope-chip:hover { background: rgba(255,255,255,.12); }
.scope-chip.active {
  background: #fff;
  color: var(--accent);
  border-color: #fff;
}
.active-filter {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 5px 12px;
  border-radius: 999px;
  background: #fff;
  color: var(--accent);
  font-size: .78rem;
  font-weight: 700;
  max-width: 100%;
}
.active-filter.show { display: inline-flex; }
.active-filter .af-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 140px;
}
.active-filter .af-clear {
  background: var(--accent-light);
  border: none;
  color: var(--accent);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: .8rem;
  flex-shrink: 0;
  line-height: 1;
}
.stats {
  font-size: .75rem;
  opacity: .9;
  margin-top: 8px;
  text-align: center;
  font-weight: 500;
  width: 100%;
}

/* ── Main list ── */
main { padding: 12px 16px 24px; max-width: 720px; margin: 0 auto; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  position: relative;
  overflow: hidden;
}
.card:hover { box-shadow: 0 4px 16px rgba(30,58,95,.12); }
.card:active { transform: scale(.985); }
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(var(--accent), var(--accent2));
  border-radius: 4px 0 0 4px;
}
.card-num {
  position: absolute;
  top: 14px; right: 16px;
  font-size: .7rem;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-light);
  padding: 3px 9px;
  border-radius: 8px;
}
.card-topic {
  display: inline-block;
  font-size: .72rem;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: .4px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.card h3 {
  font-size: 1.08rem;
  font-weight: 700;
  margin-bottom: 6px;
  line-height: 1.45;
  padding-right: 52px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.card p {
  font-size: .92rem;
  color: var(--muted);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-ref {
  font-size: .76rem;
  color: var(--accent2);
  font-weight: 600;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty p { font-size: 1.05rem; margin-top: 8px; }
.progress {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.progress b {
  color: var(--accent);
  font-size: 1.5rem;
  display: block;
  margin-bottom: 8px;
}

/* ── Categories panel (grid) ── */
.cat-panel {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.55);
  z-index: 120;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.cat-panel.open { display: flex; animation: fadeIn .2s; }
.cat-sheet {
  background: var(--bg);
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  border-radius: 24px 24px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom: var(--safe-bottom);
}
.cat-sheet-hdr {
  padding: 16px 18px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cat-sheet-hdr h2 {
  font-size: 1.1rem;
  flex: 1;
  font-weight: 700;
}
.cat-search {
  padding: 12px 16px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.cat-search input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--input-bg);
  color: var(--input-text);
  font-family: inherit;
  font-size: .95rem;
  outline: none;
}
.cat-search input:focus { border-color: var(--accent); }
.cat-grid {
  overflow-y: auto;
  padding: 12px 14px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}
.cat-item {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all .15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.cat-item:hover { border-color: var(--accent); }
.cat-item.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.cat-item .ci-name {
  font-size: .9rem;
  font-weight: 600;
  line-height: 1.35;
  word-break: break-word;
  color: inherit;
}
.cat-item .ci-count {
  font-size: .72rem;
  opacity: .8;
  font-weight: 500;
}
.cat-item.active .ci-count { opacity: .85; }
.cat-all {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
}
.cat-all.active {
  background: var(--accent);
  color: #fff;
}

/* ── Modal / bottom sheet ── */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.55);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal.open { display: flex; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  background: var(--bg);
  width: 100%;
  max-width: 640px;
  max-height: 92vh;
  border-radius: 24px 24px 0 0;
  overflow-y: auto;
  animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom: calc(20px + var(--safe-bottom));
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-hdr {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 16px 18px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  z-index: 2;
}
.sheet-hdr h2 {
  font-size: 1.05rem;
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.sheet-body { padding: 20px 18px; }
.field { margin-bottom: 16px; }
.field-hint {
  font-size: .72rem;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.4;
}
.field label {
  display: block;
  font-size: .75rem;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.field input, .field textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--input-bg);
  color: var(--input-text);
  font-family: inherit;
  font-size: .95rem;
  outline: none;
  transition: border-color .15s;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea {
  min-height: 160px;
  resize: vertical;
  line-height: 1.7;
}
.btn {
  padding: 13px 20px;
  border-radius: 14px;
  border: none;
  font-family: inherit;
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; flex: 1; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: #dc2626; color: #fff; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }


/* ── Favorites & tools ── */
.card-fav {
  position: absolute;
  top: 14px;
  right: 58px;
  background: none;
  border: none;
  font-size: 1.05rem;
  cursor: pointer;
  opacity: .45;
  padding: 2px 4px;
  line-height: 1;
  z-index: 2;
  transition: opacity .15s, transform .15s;
}
.card-fav.on, .card-fav:hover { opacity: 1; transform: scale(1.1); }
.view-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}
.view-actions .btn { flex: 1; min-width: 120px; font-size: .9rem; padding: 11px 14px; }
.fab-stack {
  position: fixed;
  right: 18px;
  bottom: calc(22px + var(--safe-bottom));
  display: flex;
  flex-direction: column-reverse;
  gap: 12px;
  z-index: 60;
  align-items: center;
}
.fab-mini {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--accent);
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
  font-size: 1.25rem;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform .15s;
}
.fab-mini:active { transform: scale(.9); }
.jump-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.jump-row input {
  flex: 1;
  padding: 11px 12px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--input-bg);
  color: var(--input-text);
  font-family: inherit;
  font-size: .95rem;
  outline: none;
}
.jump-row input:focus { border-color: var(--accent); }
.fav-only-chip {
  padding: 5px 11px;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,.35);
  background: transparent;
  color: rgba(255,255,255,.9);
  font-size: .75rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.fav-only-chip:hover { background: rgba(255,255,255,.12); }
.fav-only-chip.active {
  background: #fbbf24;
  color: #78350f;
  border-color: #fbbf24;
}

/* ── FAB ── */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(22px + var(--safe-bottom));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  font-size: 1.7rem;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(30,58,95,.35);
  z-index: 60;
  display: grid;
  place-items: center;
  transition: transform .15s, box-shadow .15s;
}
.fab:hover { box-shadow: 0 8px 24px rgba(30,58,95,.45); }
.fab:active { transform: scale(.9); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a2332;
  color: #fff;
  padding: 12px 22px;
  border-radius: 14px;
  font-size: .9rem;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
  z-index: 200;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Settings panel ── */
.panel {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.55);
  z-index: 150;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.panel.open { display: flex; }
.panel-box {
  background: var(--bg);
  border-radius: 22px;
  padding: 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  max-height: 88vh;
  overflow-y: auto;
}
.panel-box h3 { font-size: 1.15rem; margin-bottom: 4px; font-weight: 700; }
.panel-box .sub { font-size: .85rem; color: var(--muted); margin-bottom: 20px; }
.panel-box .btn { width: 100%; margin-bottom: 10px; justify-content: flex-start; }

/* ── Install banner ── */
.install-banner {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  padding: 12px 16px;
  border-radius: 14px;
  margin: 12px 16px 0;
  display: none;
  align-items: center;
  gap: 12px;
  font-size: .88rem;
  max-width: 720px;
  margin-left: auto;
  margin-right: auto;
}
.install-banner.show { display: flex; }
.install-banner button {
  background: #fff;
  color: var(--accent);
  border: none;
  padding: 8px 16px;
  border-radius: 10px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  font-size: .85rem;
  white-space: nowrap;
}

/* ── View body detail ── */
.view-topic {
  font-size: .8rem;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .4px;
}
.view-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin: 8px 0 16px;
  line-height: 1.4;

<body>

<header>
  <div class="hdr-top">
    <div class="hdr-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <path d="M12 6v7M9 9h6"/>
      </svg>
      <span>1010 Bible Illustrations</span>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" id="randomBtn" title="Random illustration">🎲</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
      <button class="icon-btn" id="menuBtn" title="Settings">☰</button>
    </div>
  </div>

  <div class="search-row">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a2332" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input type="search" id="search" placeholder="Search…">
    </div>
    <button class="cat-btn" id="catBtn" title="Browse categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Categories
    </button>
  </div>

  <div class="filter-bar">
    <div class="scope-chips" id="scopeChips">
      <button class="scope-chip active" data-scope="all">All fields</button>
      <button class="scope-chip" data-scope="title">Title</button>
      <button class="scope-chip" data-scope="text">Text</button>
      <button class="scope-chip" data-scope="ref">Reference</button>
      <button class="scope-chip" data-scope="id">Number</button>
      <button class="scope-chip" data-scope="topic">Topic</button>
    </div>
    <button class="fav-only-chip" id="favOnlyBtn" title="Show favorites only">★ Favorites</button>
    <div class="active-filter" id="activeFilter">
      <span class="af-label" id="afLabel"></span>
      <button class="af-clear" id="afClear" title="Clear category">×</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="install-banner" id="installBanner">
  <span style="flex:1">📲 Add this app to your home screen</span>
  <button id="installBtn">Install</button>
</div>

<main id="list"><div class="progress"><b>Loading…</b>Preparing 1010 illustrations</div></main>
<button class="fab" id="addBtn" title="Add new illustration">＋</button>

<!-- Categories panel -->
<div class="cat-panel" id="catPanel">
  <div class="cat-sheet">
    <div class="cat-sheet-hdr">
      <button class="icon-btn" id="closeCat" style="background:var(--card);color:var(--text)">✕</button>
      <h2>Categories</h2>
    </div>
    <div class="cat-search">
      <input type="search" id="catSearch" placeholder="Filter categories…">
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-hdr">
      <button class="icon-btn" id="closeModal" style="background:var(--card);color:var(--text)">✕</button>
      <h2 id="modalTitle">Details</h2>
      <button class="icon-btn" id="editToggle" style="background:var(--accent);color:#fff" title="Edit">✎</button>
    </div>
    <div class="sheet-body" id="viewBody"></div>
    <div class="sheet-body" id="editBody" style="display:none">
      <div class="field"><label>Number (unique)</label><input id="f_id" type="number" min="1" step="1"></div>
      <div class="field"><label>Category / Topic</label><input id="f_topic" list="topicList" placeholder="Pick existing or type new"><datalist id="topicList"></datalist>
        <p class="field-hint" id="topicHint">Uses existing categories when the name matches</p></div>
      <div class="field"><label>Title</label><input id="f_title"></div>
      <div class="field"><label>Description</label><textarea id="f_text"></textarea></div>
      <div class="field"><label>Bible reference (BSI Telugu)</label>
        <input id="f_ref" list="bookList" placeholder="e.g. యోహాను 3:16">
        <datalist id="bookList"></datalist>
        <p class="field-hint">Book names follow the BSI Telugu Bible (బైబిల్ సొసైటీ ఆఫ్ ఇండియా)</p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">💾 Save</button>
        <button class="btn btn-danger" id="delBtn">🗑 Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="menuPanel">
  <div class="panel-box">
    <h3>⚙️ Settings</h3>
    <p class="sub">Tools, backup, and options</p>
    <div class="jump-row">
      <input type="number" id="jumpInput" min="1" max="1010" placeholder="Go to #…">
      <button class="btn btn-primary" id="jumpBtn" style="flex:0 0 auto;padding:11px 16px">Go</button>
    </div>
    <button class="btn btn-ghost" id="loadBibleBtn">📖 Load BSI Bible JSON</button>
    <button class="btn btn-ghost" id="backupBtn">💾 Backup (choose location)</button>
    <button class="btn btn-ghost" id="restoreBtn">📂 Restore (choose file)</button>
    <button class="btn btn-ghost" id="iconBtn">🎨 Download app icon</button>
    <button class="btn btn-ghost" id="resetBtn" style="color:#dc2626">♻️ Reset all changes</button>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" id="closeMenu">Close</button></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
const SERMON_DATA = [
{id:1,topic:"ఆరంభము",title:"లేచి నిలువుము",text:"ఇశ్రాయేలు ఆయిలో ఓడిపోయిన తరువాత యెహోషువ తన బట్టలు చింపుకొని ప్రభువు ఒడంబడిక పెట్టె ముందు సాష్టాంగపడ్డాడు. అప్పుడు ప్రభువు అతనితో, \"లేచి నిలువుము, నీవు ఎందుకు ముఖముపై పడియున్నావు?\" అన్నాడు.",ref:"యెహోషువ 7:10"},
{id:2,topic:"ఆరంభము",title:"వారు మాట్లాడుటకు మిగిలిపోయారు",text:"రూబేను గోత్రమును గూర్చి దెబోరా పాడింది: \"రూబేను ప్రాంతములలో విభేదములు, వాదములు ఉన్నవి. మీరు కాపరి కొట్టములలో ఎందుకు పండుకొని, కేవలము కాపరి మాటలకే చెవియొగ్గి ఉన్నారు?\" యుద్ధ పిలుపు వినిపించినప్పుడు రూబేనీయులు సైనిక బలగమును సంఘటితము చేయలేదు, కానీ ఉత్సాహముగల చర్చలను నిర్వహించారు — బహుశా నేటి ఫలితము లేని కమిటీ సమావేశములకు ప్రతిరూపము.",ref:"న్యాయాధిపతులు 5:15-16"},
{id:3,topic:"ఆరంభము",title:"చర్చ ప్రాణాంతకము అయినప్పుడు",text:"పౌలు వాదించిన తరువాత ఫేస్తు, అగ్రిప్పలు \"ఆ విషయమును చర్చించుటకు వెనుకకు తిరిగారు\" — మరియు వారు చర్చ అనే బిందువు నుండి ఎన్నడూ ముందుకు కదలలేదు.",ref:"అపొస్తలుల కార్యములు 26:31"},
{id:4,topic:"ఆరంభము",title:"పూర్తి చేయవలసిన పని",text:"అనేక మంచి పనులు సంకల్పము, ఉత్సాహముతో ప్రారంభమై నిష్క్రియత్వమునకు దిగజారిపోతాయి. పౌలు కొరింథీయులకు, \"మీరు ఈ విషయములో ఏదైనా చేయుటకు మాత్రమే కాక, చేయాలని కోరుకొనుటకు కూడా మొదటివారు, అది గత సంవత్సరమే. ఇప్పుడు దానిని పూర్తి చేయుడి\" అని సలహా ఇచ్చాడు.",ref:"2 కొరింథీయులు 8:10-11"},
{id:5,topic:"ఆరంభము",title:"మాటలా లేక క్రియలా?",text:"మాటలు సులభముగా వస్తాయి; క్రియలు నెమ్మదిగా. ఒక రైతు తన కుమారులను ద్రాక్ష తోటలో పని చేయమని అడిగాడు. మొదటివాడు 'సరే' అన్నాడు కానీ వెళ్ళలేదు; రెండవవాడు 'నేను వెళ్ళను' అన్నాడు కానీ తరువాత మనస్సు మార్చుకొని వెళ్ళాడు. \"మనము మాటలతోను, నాలుకతోను ప్రేమించక, క్రియతోను\" ప్రేమించుదము.",ref:"మత్తయి 21:28-31; 1 యోహాను 3:18"},
{id:6,topic:"ఆరంభము",title:"పరాయి క్రియలు",text:"భక్తిపూర్వకముగా ప్రభువు నామమును పలుకుతూ, వారి క్రియలు ఆయన చిత్తమునకు పరాయివిగా ఉన్నవారిని గూర్చి యిర్మీయా, \"నీవు ఎల్లప్పుడూ వారి పెదవులపై ఉన్నావు, కానీ వారి హృదయముల నుండి చాలా దూరముగా ఉన్నావు\" అన్నాడు.",ref:"యిర్మీయా 12:2"},
{id:7,topic:"ఆరంభము",title:"విశ్వాసమును క్రియగా మార్చుట",text:"యేసు రెండు ఇళ్ళను వివరించాడు: బలమైన పునాది లేని ఒకటి వరద నీటిని తట్టుకోలేకపోయింది, బండపై స్థిరముగా నిర్మించిన మరొకటి జలప్రవాహములు వచ్చినప్పుడు కదలలేదు.",ref:"లూకా 6:46-49"},
{id:8,topic:"వయస్సు",title:"నేటి పరిధులకు ఆవల",text:"ఏ జీవితము ఎన్నడూ పూర్తికాదు. \"యెహోషువ వృద్ధుడు, బాగా వృద్ధాప్యము చెందినప్పుడు, నిత్యుడు అతనితో, 'నీవు వృద్ధుడవు, ఇంకా చాలా భూమి ఆక్రమించబడవలసియున్నది' అన్నాడు.\" \"క్రొత్త ప్రపంచమును వెతకుటకు ఇంకా ఆలస్యము కాలేదు.\"",ref:"యెహోషువ 13:1"},
{id:9,topic:"వయస్సు",title:"కొనసాగు నమ్మకము",text:"ఎనభై ఐదేళ్ళ కాలేబు, ఇంకా దేవుని ఆధారపు శక్తిపై నమ్మకముతో, తాను దానవులను చూచిన ప్రాంతమునే క్లెయిమ్ చేసాడు. \"కాబట్టి ఇప్పుడు ఈ పర్వతమును నాకు ఇమ్ము.\"",ref:"యెహోషువ 14:12"},
{id:10,topic:"వయస్సు",title:"అనుభవజ్ఞులైన సలహాదారులు",text:"లేవీయులు సేవా సంవత్సరములు పూర్తి చేసిన తరువాత, వారు \"తమ సహోదరులకు సన్నిధి గుడారములో సేవ చేయుటకు\" నియమింపబడ్డారు — క్రొత్త తరము క్రైస్తవులకు సలహాదారులు, ఉపదేశకులు, ప్రోత్సాహకులు.",ref:"సంఖ్యాకాండము 8:26"},
{id:11,topic:"బలిపీఠము",title:"సవాలు చేయు బలిపీఠములు",text:"\"అబ్రాము ... బేతేలు వరకు ... తాను మొదట చేసిన బలిపీఠము ఉన్న స్థలమునకు వెళ్ళాడు; అక్కడ అబ్రాము ప్రభువు నామమును ప్రార్థించాడు.\" తిరిగి రావడము ద్వారా ఆత్మ ఇంకా ముందున్న ప్రమాదములకు, సవాళ్ళకు సిద్ధమవుతుంది.",ref:"ఆదికాండము 13:1,3-4"},
{id:12,topic:"బలిపీఠము",title:"జీవిత ప్రాధాన్యత",text:"ఇస్సాకు \"[బెర్షెబాలో] బలిపీఠమును కట్టి ప్రభువు నామమును ప్రార్థించి, అక్కడ తన గుడారము వేసాడు.\" క్రొత్త ఇంటిని స్థిరపరచుటకు ముందు దేవుని ఆహ్వానించు జీవితము ఆశీర్వదింపబడుతుంది.",ref:"ఆదికాండము 26:25"},
{id:13,topic:"బలిపీఠము",title:"వ్యక్తిగత పెట్టుబడి",text:"దావీదు అరవ్నాతో, \"లేదు, నేను దానిని ఒక ధరకు కొనుక్కొందును; నా దేవుడైన ప్రభువుకు నాకు ఏమియు ఖర్చు కాని దహనబలులు అర్పింపను\" అన్నాడు.",ref:"2 సమూయేలు 24:24"},
{id:14,topic:"బలిపీఠము",title:"మొదట బలిపీఠము",text:"వలసవాదులు తమ భయంకరమైన పనిని ఎలా ప్రారంభించారు? \"వారు దాని స్థలములో బలిపీఠమును స్థాపించారు.\"",ref:"ఎజ్రా 3:3"},
{id:15,topic:"బలిపీఠము",title:"శాశ్వత జ్ఞాపిక",text:"రూబేనీయులు, గాదీయులు, మనష్షే సగం గోత్రము యొర్దాను దగ్గర బలిపీఠమును నిర్మించారు, తరువాతి తరములకు వారి విశ్వాసమును గుర్తు చేయుటకు.",ref:"యెహోషువ 22:10-29"},
{id:16,topic:"మహత్తాకాంక్ష",title:"వారు కీర్తిని వెతికారు",text:"\"రండి, మనము ఒక పట్టణమును, ఆకాశమును తాకు ఒక గోపురమును కట్టుకొందము; మనకు ఒక పేరు సంపాదించుకొందము.\" \"ప్రభువు ఇల్లు కట్టనియెడల, దానిని కట్టువారు వ్యర్థముగా శ్రమపడుదురు.\"",ref:"ఆదికాండము 11:4; కీర్తనలు 127:1"},
{id:17,topic:"మహత్తాకాంక్ష",title:"ఆశయమునకు సాధనములు",text:"అబీమెలెకు మోసపూరిత ప్రచార పద్ధతులను ఉపయోగించి, యోతాము తప్ప అతని సహోదరులందరినీ నిర్దయుడుగా చంపాడు.",ref:"న్యాయాధిపతులు 9:1-6"},
{id:18,topic:"కోపము",title:"కోపము యొక్క అధిక ధర",text:"మోషే రెండుసార్లు తన కర్రతో ఒక బండను కొట్టి, \"తిరుగుబాటుదారులారా, వినుడి; ఈ బండ నుండి మీకు నీరు తీసుకొని రావాలా?\" అని అరిచాడు. అతని కోపము, అవిశ్వాసము అతనికి ఎంతో నష్టము కలిగించాయి.",ref:"సంఖ్యాకాండము 20:10"},
{id:19,topic:"కోపము",title:"అపవాది పాదు",text:"\"కోపము తో పడుకోకుడి — అపవాదికి ఆ విధమైన పాదు ఇవ్వకుడి.\"",ref:"ఎఫెసీయులు 4:27"},
{id:20,topic:"కోపము",title:"మూసిన తలుపులు",text:"అపరిమిత కుమారుని సహోదరుడు, తండ్రి ఆహ్వానించిన తరువాత కూడా, \"అతను కోపగించి లోపలికి వెళ్ళుటకు నిరాకరించాడు.\" కోపము సమృద్ధ జీవితమునకు తెరచు తలుపులను ఎల్లప్పుడూ గట్టిగా మూసివేస్తుంది.",ref:"లూకా 15:28"},
{id:21,topic:"ఎదురుచూపు",title:"కల అతని హృదయములో ఉంది",text:"\"నా తండ్రి దావీదు హృదయములో ఇశ్రాయేలు దేవుడైన ప్రభువు నామమునకు ఒక మందిరమును కట్టవలెనని ఉండెను.\" దావీదు అంత గొప్ప కలను cherishe చేసినందుననే సొలొమోను దానిని ఫలప్రదముగా మార్చగలిగాడు.",ref:"1 రాజులు 8:17-18"},
{id:22,topic:"ఎదురుచూపు",title:"బంగారు క్షణము కొరకు వేచియుండుట",text:"దానియేలు బంగారు క్షణము కొరకు మూడు వారములు తనను తాను సిద్ధము చేసుకొన్నాడు. సిద్ధత, ఆశ ఊహించని, సిద్ధముగా లేని వారికి నిరాకరింపబడిన దానిని దానియేలుకు తీసుకొని వచ్చాయి.",ref:"దానియేలు 10:7"},
{id:23,topic:"ఎదురుచూపు",title:"ఖర్చును లెక్కించుట",text:"\"మీలో ఎవడైనను ఒక గోపురమును కట్టాలని యుంచుకొని, దానిని పూర్తి చేయుటకు తనకు సరిపోతుందా అని మొదట కూర్చొని ఖర్చును లెక్కించడా?\" విలువైనది ఏదైనా గంభీరమైన ముందు ఆలోచన, త్యాగములు అవసరము.",ref:"లూకా 14:28"},
{id:24,topic:"ఎదురుచూపు",title:"ఆశతో జీవించుట",text:"వృద్ధ ప్రవక్త్రి అన్నా \"యెరూషలేము విడుదల కొరకు ఆశతో ఎదురుచూచు వారందరితో ఆయనను గూర్చి మాట్లాడుతూ ఉండేది.\"",ref:"లూకా 2:38"},
{id:25,topic:"ఎదురుచూపు",title:"సంతోషముతో స్వీకరించబడెను",text:"గదరేనులు యేసును వెళ్ళమని వేడుకొన్నారు, కానీ కపెర్నహూములో \"ప్రజలు ఆయనను సంతోషముతో స్వీకరించారు, ఎందుకంటే వారందరూ ఆయన కొరకు ఎదురుచూచుచున్నారు.\"",ref:"లూకా 8:40"},
{id:26,topic:"ఎదురుచూపు",title:"హృదయములు పరలోకము వైపు",text:"\"గలిలయ మనుష్యులారా, మీరు ఎందుకు ఆకాశము వైపు చూచుచు నిలిచియున్నారు?\" క్రీస్తు తిరిగి రాక కొరకు క్రైస్తవుని ఎదురుచూపు విశ్వాసమునకు ఆధారము.",ref:"అపొస్తలుల కార్యములు 1:11"},
{id:27,topic:"రూపము",title:"ప్రభువు ఏమి చూచును",text:"ప్రభువు, \"అతని ముఖము, అతని ఎత్తు చూడకుము; మనుష్యుడు బాహ్య రూపమును చూచును, ప్రభువు హృదయమును చూచును\" అన్నాడు. క్రీస్తు, \"రూపము ప్రకారము తీర్పు తీర్చకుడి\" అన్నాడు.",ref:"1 సమూయేలు 16:6-7; యోహాను 7:24"},
{id:28,topic:"రూపము",title:"వినికిడి చే కాదు",text:"\"ఆయన రూపము ప్రకారము తీర్పు తీర్చడు, వినికిడి చే నిర్ణయించడు.\"",ref:"యెషయా 11:3"},
{id:29,topic:"రూపము",title:"మోసపూరిత రూపములు",text:"\"దుష్టులు ఎందుకు వర్ధిల్లుతారు?\" బహుశా రూపములు మోసము చేయవచ్చు. \"అన్యాయముతో గొప్ప ఆదాయము కంటే నీతితో కొంచెము మేలు.\"",ref:"యిర్మీయా 12:2; సామెతలు 16:8"},
{id:30,topic:"రూపము",title:"తప్పుడు ముఖములు",text:"\"మీరు గిన్నె, పళ్ళెము వెలుపలి భాగమును శుభ్రము చేస్తారు, లోపల మాత్రము దోచుకొనుట, స్వార్థపరతతో నిండియున్నది.\"",ref:"మత్తయి 23:25"},
{id:31,topic:"రూపము",title:"ముఖవర్చస్సు భక్తి",text:"యేసు ముఖవర్చస్సు భక్తిని ఖండించి, మనిషి లోపల పవిత్రుడుగా ఉండుట బాహ్య శుచిత్వపు ప్రకటనల గురించి అతిగా ఆందోళన చెందుట కంటే మేలని చెప్పాడు.",ref:"లూకా 11:38-40"},
{id:32,topic:"కృతజ్ఞత",title:"అవగాహనతో మాట్లాడుట",text:"గిద్యోను \"మీ పోలికలో నేను ఇప్పుడు ఏమి చేసాను?\" అని అడిగాడు. వారి పూర్వ విజయముల పట్ల అతని నిజమైన కృతజ్ఞత అంత గొప్పది, ఎఫ్రాయిమీయుల కోపము చల్లారింది.",ref:"న్యాయాధిపతులు 8:2"},
{id:33,topic:"కృతజ్ఞత",title:"ఆలస్యమైన ప్రశంస",text:"మొర్దెకై గత కాలములో రాజు ప్రాణమును రక్షించినందుకు తగిన ప్రశంస ఎన్నడూ పొందలేదని రాజు గుర్తు చేసుకొన్నాడు. అందుచేత హామాను నాశనము చేయాలని వెతికిన వానిని రాజు గౌరవించుటకు సంతోషించాడు.",ref:"ఎస్తేరు 5:9-6:11"},
{id:34,topic:"కృతజ్ఞత",title:"ప్రతిఫలము అక్కరలేదు",text:"కుష్ఠురోగము నుండి స్వస్థత పొందిన నయమాను ప్రతిఫలము ఇవ్వ ప్రయత్నించాడు. ఎలీషా, \"నేను సేవించు సర్వశక్తిమంతుడైన ప్రభువు జీవము తోడుగా, నేను ఏదియు తీసుకొనను\" అన్నాడు.",ref:"2 రాజులు 5:15-16"},
{id:35,topic:"కృతజ్ఞత",title:"కృతజ్ఞత ఎవరికి చెల్లించాలి",text:"\"మీ గురించి ఆలోచించిన ప్రతిసారీ నా దేవునికి కృతజ్ఞతలు చెప్పుచున్నాను, మీ అందరి కొరకు ప్రార్థన చేయు ప్రతిసారీ సంతోషముతో చేస్తాను.\"",ref:"ఫిలిప్పీయులు 1:3-5"},
{id:36,topic:"వాదన",title:"దేవునితో వాదన",text:"\"నేను సర్వశక్తిమంతునితో మాట్లాడుదును, దేవునితో వాదించాలని కోరుకొనుచున్నాను.\" ఎందుకు కాదు? మరెవరూ నిజముగా ప్రాముఖ్యము కాదు.",ref:"యోబు 13:3"},
{id:37,topic:"వాదన",title:"అగౌరవపు మట్టి",text:"\"తన సృష్టికర్తతో వాదించువానికి శ్రమ! మట్టి కుమ్మరవానితో, 'నీవు ఏమి చేయుచున్నావు?' అనునా?\"",ref:"యెషయా 45:9"},
{id:38,topic:"వాదన",title:"అతను వాదమును నివారించాడు",text:"ఇస్సాకు తన క్లెయిమును వదులుకొన్నాడు. మూడవ బావి త్రవ్వుట వాదించబడలేదు. \"ఇప్పుడు ప్రభువు మనకు విశాల స్థలము ఇచ్చాడు, మనము దేశములో వర్ధిల్లుదుము\" అన్నాడు.",ref:"ఆదికాండము 26:22"},
{id:39,topic:"వాదన",title:"ప్రత్యర్థి సద్భావన",text:"\"నీవు, అతను న్యాయస్థానమునకు వెళ్ళు మార్గములో ఉండగానే అతనితో త్వరగా సమాధానపడుము.\"",ref:"మత్తయి 5:25-26"},
{id:40,topic:"వాదన",title:"వారు క్రీస్తును గూర్చి సణుగుకొన్నారు",text:"\"జన సమూహములలో ఆయనను గూర్చి బహు సణుగుడు జరిగెను; కొందరు ఆయన మంచివాడనిరి, మరికొందరు కాదు, ఆయన జనులను మోసపరచుచున్నాడనిరి.\"",ref:"యోహాను 7:12"},
{id:41,topic:"గర్వము",title:"గొప్పలు చెప్పుకొను కలలు కనువాడు",text:"యోసేపు తన కలలను తన సహోదరులకు చెప్పినప్పుడు, వారు అతనికి బలహీన వినయస్థులుగా నమస్కరించుచున్నట్లు చిత్రించిన గర్విష్ఠి ప్రగల్భములు యాకోబు కుటుంబములో దుర్భావన తీవ్రతరము చేసింది.",ref:"ఆదికాండము 37:5-11"},
{id:42,topic:"గర్వము",title:"అతిగా పోషించుట యొక్క పరిణామము",text:"\"అదోనీయా ... తనను తాను హెచ్చించుకొని, 'నేను రాజునగుదును' అన్నాడు.\" \"అతని తండ్రి ఎప్పుడూ, 'నీవు ఎందుకు ఇలా చేసావు?' అని చెప్పుటలో అతనిని అసంతృప్తి పరచలేదు.\"",ref:"1 రాజులు 1:5-6"},
{id:43,topic:"గర్వము",title:"బోడి మనుష్యులు",text:"\"వారు అంత గర్విష్ఠులు, అంత ధిక్కారముగలవారు, అంత అహంకారులు, అంత బోడివారు, అంత గొంతెత్తి మాట్లాడువారు.\"",ref:"యెషయా 16:6"},
{id:44,topic:"గర్వము",title:"గర్విష్ఠుల పతనము",text:"\"అతను అధికారము పొందినప్పుడు, అతను గర్విష్ఠుడయ్యాడు, అది అతనిని నాశనము చేసింది.\" \"నీవు గద్దవలె నిన్ను నీవు హెచ్చించుకొన్నను, అక్కడ నుండి నేను నిన్ను దించుదును.\"",ref:"2 దినవృత్తాంతములు 26:16; ఓబద్యా 1:4"},
{id:45,topic:"గర్వము",title:"మూర్ఖపు గొడ్డలి",text:"\"గొడ్డలి కట్టెను కొట్టువానిపై గొప్పలు చెప్పునా? రంపము రంపపు వానిని నిందించునా?\"",ref:"యెషయా 10:15"},
{id:46,topic:"అవగాహన",title:"అంశమును మిస్ చేయుట",text:"సౌలు తన పినతండ్రితో, \"ఏమి, గాడిదలు దొరికాయని అతను మాకు చెప్పాడు!\" అన్నాడు. రాజ్య విషయము గూర్చి అతను ఏమీ చెప్పలేదు.",ref:"1 సమూయేలు 10:15-16"},
{id:47,topic:"అవగాహన",title:"ఆధ్యాత్మిక సంకోచము",text:"\"నీవు [నిత్యుడు] క్రియలో ఉన్నావు, వారు ఏమీ చూడరు.\"",ref:"యెషయా 26:11"},
{id:48,topic:"అవగాహన",title:"అవసరము యొక్క అవగాహన",text:"\"పేద సహోదరుడు దేవుడు తనను నిజమైన సంపదకు పిలిచినందుకు సంతోషించవచ్చు. ధనవంతుడు దేవుడు తన ఆధ్యాత్మిక పేదరికమును చూపినందుకు సంతోషించవచ్చు.\"",ref:"యాకోబు 1:9-10"},
{id:49,topic:"అవగాహన",title:"నేను నిన్ను చూచితిని",text:"\"ఫిలిప్పు నీతో మాట్లాడక ముందే, అంజూరపు చెట్టు క్రింద నేను నిన్ను చూచితిని.\"",ref:"యోహాను 1:47-48"},
{id:50,topic:"అవగాహన",title:"ఏ స్పర్శ గుర్తించబడకుండా పోదు",text:"పన్నెండు సంవత్సరములు అనారోగ్యముచే పీడింపబడిన ఒక స్త్రీ సంకోచముగా ఆయన వస్త్రపు అంచును తాకింది. యేసు తిరిగి, \"నన్ను ఎవరు తాకారు?\" అన్నాడు.",ref:"లూకా 8:45"},
{id:51,topic:"పతనము",title:"అతని భార్యలు అతని హృదయమును తిప్పారు",text:"\"సొలొమోను వృద్ధుడైనప్పుడు ... అతని భార్యలు అతని హృదయమును ఇతర దేవతల వైపు తిప్పారు.\"",ref:"1 రాజులు 11:1,4"},
{id:52,topic:"పతనము",title:"దేవుడు లేకుండా బలహీనుడు",text:"సమ్సోను శక్తిహీనుడయ్యాడు, ఎందుకంటే \"ప్రభువు తన నుండి వెళ్ళిపోయాడని అతనికి తెలియదు.\"",ref:"న్యాయాధిపతులు 16:20"},
{id:53,topic:"వర్తకము",title:"విరుద్ధ ప్రార్థనలు",text:"యాకోబు యొక్క ప్రార్థనలో \"నీ సమస్త కృపలలో, సమస్త సత్యములలో నేను అల్పమైనదానికైనా అర్హుడను కాను\" అన్నాడు.",ref:"ఆదికాండము 32:10"},
{id:54,topic:"వర్తకము",title:"తొందరపాటు ప్రమాణము",text:"యెఫ్తా దేవునితో వర్తకము చేసి, \"నేను అమ్మోనీయుల నుండి సమాధానముతో తిరిగి వచ్చినప్పుడు, నా ఇంటి తలుపుల నుండి నన్ను ఎదుర్కొనుటకు బయటకు వచ్చేది ఏదైనను ప్రభువుదే అవుతుంది\" అని ప్రమాణము చేసాడు.",ref:"న్యాయాధిపతులు 11:30-31"},
{id:55,topic:"అందము",title:"స్వల్పకాలిక అందము",text:"అబ్షాలోము అందమును గూర్చి — \"అతని అరికాలి నుండి తల వరకు అతనిలో ఎటువంటి కళంకము లేదు.\" కానీ అతను ఎంత గర్వపడే తల జుట్టే చివరకు అతని పతనమును తీసుకొని వచ్చింది.",ref:"2 సమూయేలు 14:25; 18:9"},
{id:56,topic:"అందము",title:"వాడని అందము",text:"\"మీ అందము విస్తారమైన కేశాలంకరణపై, ఆభరణములు ధరించుటపై ఆధారపడకూడదు, కానీ అంతర్గత వ్యక్తిత్వముపై — ప్రశాంతమైన, సౌమ్యమైన ఆత్మ యొక్క వాడని అందముపై.\"",ref:"1 పేతురు 3:3-5"},
{id:57,topic:"అందము",title:"మారువేషపు అందవికారము",text:"యెజెబెలు, \"తన కళ్ళకు కాటుక పెట్టుకొని, తన తలను అలంకరించుకొంది\", కానీ ఏ టాయిలెట్రీ ఆమె అంతర్గత అందవికారమును మారువేషము చేయలేదు.",ref:"2 రాజులు 9:30"},
{id:58,topic:"అందము",title:"అందము యొక్క మర్యాదలు",text:"రాణి వష్తి తన నిరాకరణ తన కిరీటము, స్థానమును కోల్పోవడము తీసుకొని వస్తుందని ఆమెకు తెలిసినప్పటికీ, పట్టుబట్టి నిరాకరించింది.",ref:"ఎస్తేరు 1:10-12"},
{id:59,topic:"ఆరంభము",title:"చిన్న వాటి దినము",text:"\"చిన్న వాటిని తృణీకరించువారు సంతోషించెదరు\" — పని పూర్తయినప్పుడు, వారు \"జెరుబ్బాబెలు చేతులలో తుది సీసపు త్రాడును చూచెదరు.\"",ref:"జెకర్యా 4:10"},
{id:60,topic:"ఆరంభము",title:"నీటితో తడిపిన తోటలు",text:"దేవుని సహాయముతో జీవితము మరల \"నీటితో తడిపిన తోట\" వలె ఉండవచ్చు.",ref:"యెషయా 58:11"},
{id:61,topic:"దానము",title:"అవసరముగలవారికి అంచు",text:"\"నీ భూమి పంట కోసినప్పుడు, నీ పొలము మూలలను పూర్తిగా కోయకూడదు.\" మిగిలిన పంట రైతు తన శ్రమల యొక్క సరైన ఫలముగా క్లెయిమ్ చేయవచ్చు, కానీ ఆ అంచు అవసరముగలవారికి పక్కన పెట్టబడింది.",ref:"లేవీయకాండము 19:9"},
{id:62,topic:"దానము",title:"చల్లని సాంత్వన",text:"\"ఒక సహోదరుడు గానీ సహోదరి గానీ ... తినుటకు ఆహారము లేకుండా ఉండగా, మీలో ఒకడు, 'క్షేమముగా ఉండుము' అని చెప్పి, వారి శారీరక అవసరములను తీర్చుటకు ఏమియు ఇవ్వకపోతే, దానిలో ఏమి ప్రయోజనము?\"",ref:"యాకోబు 2:15-16"},
{id:63,topic:"దానము",title:"మంచితనము కొరకు మంచితనము",text:"\"మీరు దానము చేసినప్పుడు, మీ కుడి చేయి చేయునది మీ ఎడమ చేతికి తెలియనివ్వకుడి.\"",ref:"మత్తయి 6:2-4"},
{id:64,topic:"దానము",title:"విశాల హృదయము",text:"పేతురు అన్యజాతి కొర్నేలిని, \"నిజముగా దేవుడు పక్షపాతి కాడని నేను గ్రహించుచున్నాను; ప్రతి జాతిలోను ఆయనకు భయపడి నీతిని అనుసరించువాడు ఆయనకు అంగీకారుడు\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 10:34-35"},
{id:65,topic:"బైబిలు",title:"పునరుద్ధరించబడిన గ్రంథము",text:"చాలా కాలము నిర్లక్ష్యము చేయబడి, దాదాపు పూర్తిగా మరచిపోయిన ధర్మశాస్త్రపు ప్రాచీన గ్రంథము యోషీయా ముందుకు తీసుకురాబడి, గొప్ప మత సంస్కరణలలో ఒకటి నిర్మించిన పునాది శిలగా చేయబడింది.",ref:"2 రాజులు 22:8-10"},
{id:66,topic:"బైబిలు",title:"గ్రంథ దహనము",text:"యిర్మీయా గ్రంథమును రాజు యెహోయాకీము ముక్క ముక్కగా కత్తిరించి, నిప్పులో విసిరివేసాడు.",ref:"యిర్మీయా 36:20-23"},
{id:67,topic:"బైబిలు",title:"బైబిలు వ్యాఖ్యానకర్తల కొరకు",text:"\"వారు దేవుని ధర్మశాస్త్రపు గ్రంథము నుండి చదివి, వారు వెళ్ళుచుండగా అనువదించి, అర్థమును వివరించారు, తద్వారా ప్రజలు చదివినది అర్థము చేసుకొన్నారు.\"",ref:"నెహెమ్యా 8:8"},
{id:68,topic:"బైబిలు",title:"వాక్యపు కరువు",text:"దేవుడు కరువును — రొట్టె లేక నీటి కరువు కాదు, ప్రభువు వాక్యములను వినుట యొక్క కరువును — ముందుగా చెప్పాడు.",ref:"ఆమోసు 8:12"},
{id:69,topic:"బైబిలు",title:"వెయ్యి నాలుకలు",text:"పెంతెకొస్తు అద్భుతము బైబిలు పదములు వెయ్యికి పైగా భాషలలోకి అనువదించబడు దినమును ముందుగా సూచించింది.",ref:"అపొస్తలుల కార్యములు 2:8"},
{id:70,topic:"బైబిలు",title:"జీవితపు అద్దము",text:"\"వాక్యమును విని, దానిని గూర్చి ఏమియు చేయని మనిషి, అద్దములో తన స్వంత ముఖపు ప్రతిబింబమును పట్టుకొనువాని వలె ఉన్నాడు.\"",ref:"యాకోబు 1:23-25"},
{id:71,topic:"బైబిలు",title:"దేవుని నుండి ఏదైనా వాక్యమా?",text:"రాజు సిద్కియా యిర్మీయాను చెరసాల నుండి తీసుకొని వచ్చి, \"ప్రభువు నుండి ఏదైనా వాక్యము ఉందా?\" అని అడిగాడు.",ref:"యిర్మీయా 37:17"},
{id:72,topic:"నింద",title:"సైనికులే చేసారు",text:"సౌలు బలహీనముగా నిందను తన సైనికులపై వేసి, \"ప్రజలు దోపిడీలో నుండి ... బలి అర్పించుటకు తీసుకొన్నారు\" అన్నాడు.",ref:"1 సమూయేలు 15:21"},
{id:73,topic:"నింద",title:"ఇతరులను నిందించుట",text:"మేకపోతు ఆచారము మన పాపములకు బాధ్యతను తిరస్కరించి, హేతువాదము ద్వారా నిందను ఇతరులపై వేయు మన ప్రవృత్తిని సూచిస్తుంది.",ref:"లేవీయకాండము 16:7-22"},
{id:74,topic:"ఆశీర్వాదము",title:"నన్ను కూడా ఆశీర్వదించుము!",text:"ఇస్సాకుకు ఎసావు, \"ఓ నా తండ్రీ, నన్ను, నన్ను కూడా ఆశీర్వదించుము!\" అన్నాడు.",ref:"ఆదికాండము 27:38"},
{id:75,topic:"ఆశీర్వాదము",title:"ఇంటి ఆశీర్వాదము",text:"\"ప్రభువు ఓబేదెదోమును, అతని సర్వ కుటుంబమును ఆశీర్వదించెను.\"",ref:"2 సమూయేలు 6:11"},
{id:76,topic:"ఆశీర్వాదము",title:"సాతాను ప్రశ్న",text:"\"నీవు అతని చుట్టూ, అతని ఇంటి చుట్టూ, అతనికి ఉన్న సమస్తము చుట్టూ కంచె వేయలేదా?\"",ref:"యోబు 1:10"},
{id:77,topic:"ఆశీర్వాదము",title:"శాపముల నుండి ఆశీర్వాదములకు",text:"\"నీ దేవుడైన ప్రభువు నీ ప్రయోజనము కొరకు శాపమును ఆశీర్వాదముగా మార్చాడు, ఎందుకంటే నీ దేవుడైన ప్రభువు నిన్ను ప్రేమించాడు.\"",ref:"ద్వితీయోపదేశము 23:5"},
{id:78,topic:"ఆశీర్వాదము",title:"దేవుడు అతనిని ఆశీర్వదించాడు",text:"\"ఆ దినము నుండి ప్రభువు ఆత్మ దావీదుపై వచ్చింది. ... కానీ ప్రభువు ఆత్మ సౌలు నుండి వెళ్ళిపోయింది.\"",ref:"1 సమూయేలు 16:13-14"},
{id:79,topic:"ఆశీర్వాదము",title:"సమృద్ధ ఫలము",text:"\"నీ ద్వారా భూమిపైనున్న సమస్త కుటుంబములు ఒకరినొకరు ఆశీర్వదించుకొందురు.\"",ref:"ఆదికాండము 12:3"},
{id:80,topic:"సహోదరత్వము",title:"అతని సహోదరుని కాపాడువాడు",text:"కయీను, \"నేను నా సహోదరుని కాపాడువాడనా?\" అని జవాబిచ్చాడు. అతని ప్రశ్నే అతని ఆరోపణ.",ref:"ఆదికాండము 4:9-10"},
{id:81,topic:"సహోదరత్వము",title:"లోతైన బంధుత్వము",text:"ఫరో రాజభవనములో పెరిగిన మోషే, అయినప్పటికీ తన సహోదరుల పట్ల లోతైన బంధుత్వమును అనుభవించాడు.",ref:"నిర్గమకాండము 2:11"},
{id:82,topic:"సహోదరత్వము",title:"కానీ వారు సహోదరులు",text:"ఎదోమ్, ఇశ్రాయేలు సహోదరులు కాబట్టి, హృదయశూన్యమైన తిరస్కరణ రెట్టింపు క్రూరమైనది.",ref:"సంఖ్యాకాండము 20:17"},
{id:83,topic:"సహోదరత్వము",title:"వింత తర్కము",text:"యూదా, \"అతను మన సహోదరుడు, మన స్వంత శరీరము!\" అన్నాడు.",ref:"ఆదికాండము 37:26-27"},
{id:84,topic:"సహోదరత్వము",title:"తన సహోదరులతో గుర్తింపు",text:"ఊరియా తన సహోదరుల జీవితములతో తనను తాను అంతగా గుర్తించుకొన్నాడు, వారికి నిరాకరించబడిన ప్రత్యేకతలను అతను అంగీకరించలేదు.",ref:"2 సమూయేలు 11:11"},
{id:85,topic:"సహోదరత్వము",title:"బానిస కంటే ఎక్కువ",text:"పౌలు ఓనేసిమును, \"ఇక బానిసగా కాదు, బానిస కంటే ఎక్కువ — ప్రియమైన సహోదరుడుగా\" స్వీకరించమని అడిగాడు.",ref:"ఫిలేమోనుకు 16"},
{id:86,topic:"సహోదరత్వము",title:"సహోదరుడు సౌలు",text:"అననీయా పౌలును \"సహోదరుడు సౌలు\" అని పలకరించాడు.",ref:"అపొస్తలుల కార్యములు 9:13,15,17"},
{id:87,topic:"సహోదరత్వము",title:"వంతెన",text:"యూదుల పెద్దలు, \"అతను మన జాతిని ప్రేమించుచున్నాడు, మనకు ఒక సమాజమందిరమును కట్టించాడు\" అన్నారు.",ref:"లూకా 7:5"},
{id:88,topic:"సహోదరత్వము",title:"భారము మోసేవారు",text:"\"వారు ప్రజల భారమును నీతో మోసెదరు, తద్వారా నీవు ఒంటరిగా మోయకూడదు.\"",ref:"సంఖ్యాకాండము 11:17"},
{id:89,topic:"సహోదరత్వము",title:"కఠినమైన కాడి",text:"రెహబాము తన తండ్రి సలహాదారుల మాట వినలేదు: \"అతను తన స్వంత వయస్సు గల ఒక బృందపు సలహాను అంగీకరించాడు.\"",ref:"1 రాజులు 12:4,7"},
{id:90,topic:"సహోదరత్వము",title:"నీ భారమును ప్రభువుపై వేయుము",text:"హిజ్కియా ఉత్తరమును \"ప్రభువు మందిరములోనికి వెళ్ళి, ప్రభువు ముందు దానిని విస్తరించాడు.\"",ref:"2 రాజులు 19:14"},
{id:91,topic:"సహోదరత్వము",title:"అమూల్యమైన సరుకు",text:"కొన్ని వస్తువులు భారము మోసే జంతువులకు అప్పగించుటకు చాలా అమూల్యమైనవి. మంచి కాపరి తప్పిపోయిన గొర్రెను తన భుజముపై ఎత్తుకొన్నాడు.",ref:"సంఖ్యాకాండము 7:9"},
{id:92,topic:"అవకాశము",title:"అనుకోకుండా కాదు",text:"అహాబు పతనము అనుకోకుండా కాదు, కానీ అతని ప్రవక్త మీకాయా ద్వారా పలుకబడిన దేవుని చిత్తము ప్రకారము.",ref:"1 రాజులు 22:34"},
{id:93,topic:"అవకాశము",title:"సేవ కొరకు సందర్భములు",text:"ఒక యాజకుడు, ఒక లేవీయుడు, ఒక సమరయుడు అతను పడియున్న స్థలము గుండా \"అనుకోకుండా\" వెళ్ళారు.",ref:"లూకా 10:31"},
{id:94,topic:"అవకాశము",title:"దేవుడా లేక అవకాశమా?",text:"\"అది అతని హస్తము కాదు, అది మనకు సంభవించిన ఒక అవకాశము అని మేము తెలుసుకొందుము.\"",ref:"1 సమూయేలు 6:9"},
{id:95,topic:"అవకాశము",title:"నాయకుని ఎన్నుకొనుట",text:"\"ప్రభువా, సమస్త మనుష్యుల హృదయములను ఎరిగినవాడా, ఈ ఇద్దరిలో నీవు ఎన్నుకొన్నది ఎవరో చూపించుము.\"",ref:"అపొస్తలుల కార్యములు 1:24"},
{id:96,topic:"అవకాశము",title:"మనుష్యులు దేవుని నుండి తిరిగినప్పుడు",text:"\"కానీ మీరు ... నిత్యుని విడిచిపెట్టారు, అదృష్టానికి బల్లలను విస్తరించి, విధికి పానార్పణలు పోసారు.\"",ref:"యెషయా 65:11"},
{id:97,topic:"పిల్లలు",title:"ఒక బిడ్డ వాగ్దానము",text:"ఏ బిడ్డ వాగ్దానము లేకుండా లేడు. జీవపు ప్రభువును గూర్చి కొందరు హీనముగా మాట్లాడారు: \"అతను వడ్రంగి కుమారుడు మాత్రమే.\"",ref:"మత్తయి 13:55"},
{id:98,topic:"పిల్లలు",title:"తల్లి స్పందన",text:"బిడ్డ యొక్క నిజమైన తల్లి, \"ఓ నా ప్రభువా, ఆమెకు జీవముగల బిడ్డను ఇమ్ము, ఏ విధముగాను చంపకుము\" అన్నది.",ref:"1 రాజులు 3:26"},
{id:99,topic:"పిల్లలు",title:"దేవుడు ఎన్నుకొన్న బాలుడు",text:"బేత్లెహేములో గొర్రెలు కాచుచున్న బాలుడు దావీదు, ఇశ్రాయేలు శత్రువు బెదిరింపులను నిశ్శబ్దము చేయుటకు దేవుడు నియమించినవాడు.",ref:"1 సమూయేలు 17:8-11"},
{id:100,topic:"పిల్లలు",title:"రాజ్యపు పిల్లలు",text:"యేసు, \"చిన్న పిల్లలను నా దగ్గరకు రానివ్వుడి ... వారిని ఆటంకపరచకుడి; ఎందుకంటే దేవుని రాజ్యము బాల్యులైన వారిదే\" అని జవాబిస్తాడు.",ref:"లూకా 18:16"},
{id:101,topic:"పిల్లలు",title:"నా నామములో",text:"\"ఎవరైనా ఈ బిడ్డను నా నామములో స్వీకరించిన యెడల, నన్ను స్వీకరిస్తాడు.\"",ref:"మార్కు 9:37"},
{id:102,topic:"పిల్లలు",title:"బిడ్డ పెరిగాడు",text:"\"బాలుడు సమూయేలు పెరిగి, ప్రభువు తోడు, మనుష్యుల తోడు కూడా కృపను పొందాడు.\"",ref:"1 సమూయేలు 2:18,21,26"},
{id:103,topic:"పిల్లలు",title:"ఆడుకొనుటకు సురక్షిత స్థలములు",text:"ప్రభువు \"వీధులు ... బాలురతో, బాలికలతో నిండి ఉంటాయి\" అనే ఒక సమాజమును చిత్రించాడు.",ref:"జెకర్యా 8:5"},
{id:104,topic:"పిల్లలు",title:"పక్షపాతము",text:"\"ఇస్సాకు ఎసావును ప్రేమించాడు ... కానీ రిబ్కా యాకోబును ప్రేమించింది.\"",ref:"ఆదికాండము 25:28"},
{id:105,topic:"ఎన్నిక",title:"ప్రభువు పక్షము",text:"\"ప్రభువు పక్షములో ఉన్నవారు ఎవరు? నా దగ్గరకు రండి\" అన్నాడు మోషే. లేవీ కుమారులందరూ అతని దగ్గరకు చేరారు.",ref:"నిర్గమకాండము 32:26"},
{id:106,topic:"ఎన్నిక",title:"ఎన్నికతో ఎదుర్కొనుట",text:"\"ఇదిగో, ఈ రోజు నేను మీ ముందు ఆశీర్వాదమును, శాపమును ఉంచుచున్నాను.\"",ref:"ద్వితీయోపదేశము 11:26-28"},
{id:107,topic:"ఎన్నిక",title:"రహస్య ప్రత్యామ్నాయములు",text:"దావీదుకు మూడు ఎన్నికలు అందించబడ్డాయి: ఏడు సంవత్సరముల కరువు, మూడు నెలల పారిపోవుట, లేక మూడు రోజుల మహమ్మారి.",ref:"2 సమూయేలు 24:13"},
{id:108,topic:"ఎన్నిక",title:"వింత ఎన్నిక",text:"\"ఈ మనిషిని కాదు, బరబ్బాను\" అని అరిచారు. బరబ్బా ఒక దొంగ.",ref:"యోహాను 18:39-40"},
{id:109,topic:"క్రీస్తు",title:"క్రైస్తవము అంటే క్రీస్తు",text:"\"క్రీస్తు అదృశ్య దేవుని దృశ్య వ్యక్తీకరణ. ... ఆయన సమస్త సృష్టి క్రమమునకు మొదటి సూత్రము, ఆధార సూత్రము.\"",ref:"కొలొస్సయులు 1:15,17"},
{id:110,topic:"క్రీస్తు",title:"ఆయన మిషన్",text:"\"దేవుని కుమారుడు అపవాది కార్యకలాపములను రద్దు చేయు స్పష్ట ఉద్దేశముతో భూమికి వచ్చాడు.\"",ref:"1 యోహాను 3:8"},
{id:111,topic:"క్రీస్తు",title:"పరిమితులు అసాధ్యము",text:"\"యేసు చేసిన అనేక ఇతర కార్యములు ఉన్నవి, అవి ఒక్కొక్కటిగా రాయబడిన యెడల, లోకము కూడా కలిగియుండలేదు.\"",ref:"యోహాను 21:25"},
{id:112,topic:"క్రీస్తు",title:"ఆయన ఆలోచనలను పంచుకొనుట",text:"\"మన ఆలోచనలు క్రీస్తు ఆలోచనలు.\"",ref:"1 కొరింథీయులు 2:16"},
{id:113,topic:"క్రీస్తు",title:"మనము ఆయనను తెలుసుకొంటామా?",text:"\"ఫిలిప్పూ, మనము ఇంత కాలము కలిసి ఉన్నప్పటికీ, నీవు నన్ను తెలుసుకోలేదా?\"",ref:"యోహాను 14:9"},
{id:114,topic:"క్రీస్తు",title:"క్రీస్తు సహచరులు",text:"ఇశ్రాయేలు పెద్దలు పేతురు, యోహానులను యేసు పూర్వ సహచరులు అని గుర్తించారు.",ref:"అపొస్తలుల కార్యములు 4:13"},
{id:115,topic:"క్రీస్తు",title:"ఆయన ఆకర్షణ",text:"\"ఇంత పట్టణమంతా అక్కడ, తలుపు దగ్గర గుమిగూడింది.\"",ref:"మార్కు 1:33"},
{id:116,topic:"క్రీస్తు",title:"క్రీస్తు మనలను ఎదుర్కొన్నప్పుడు",text:"\"అకస్మాత్తుగా పట్టణమంతా యేసును కలవుటకు బయలుదేరింది, వారు ఆయనను చూచిన వెంటనే, ఆయన తమ పొరుగు ప్రాంతమును విడిచి వెళ్ళమని వేడుకొన్నారు.\"",ref:"మత్తయి 8:34"},
{id:117,topic:"క్రీస్తు",title:"బయటకు నెట్టబడెను",text:"\"స్వస్థత పొందిన మనిషికి ఆయన ఎవరో తెలియదు; ఎందుకంటే యేసు గుర్తింపబడకుండా వెళ్ళిపోయాడు.\"",ref:"యోహాను 5:13"},
{id:118,topic:"క్రీస్తు",title:"ఆయన దాగియుండలేడు",text:"\"ఆయన దాగియుండలేడు.\"",ref:"మార్కు 7:24"},
{id:119,topic:"క్రీస్తు",title:"ఆయన చొరవ",text:"\"జక్కయ్యా ... ఈ రోజు నేను నీ అతిథిగా ఉండాలి.\"",ref:"లూకా 19:5"},
{id:120,topic:"క్రీస్తు",title:"సిగ్గుపడినవారు ధన్యులు",text:"\"నాలో ఏదీ అసహ్యకరము కానివాడు ధన్యుడు!\"",ref:"మత్తయి 11:6"},
{id:121,topic:"క్రీస్తు",title:"మనము ఆయనతో ప్రయాణము చేసెదము",text:"\"[యేసు] వారితో, 'అవతలి ఒడ్డుకు వెళ్ళుదము' అన్నాడు. ... ఆయనతో వేరే చిన్న పడవలు కూడా ఉన్నవి.\"",ref:"మార్కు 4:35-36"},
{id:122,topic:"క్రైస్తవుడు",title:"క్రీస్తు బానిసలు",text:"\"అంతియొకయలో శిష్యులకు మొదట 'క్రైస్తవులు' అనే పేరు ఇవ్వబడింది.\"",ref:"అపొస్తలుల కార్యములు 11:26"},
{id:123,topic:"క్రైస్తవుడు",title:"క్రీస్తులో పెట్టుబడి",text:"\"పరలోక రాజ్యము పొలములో దాచబడిన నిధి వలె ఉంది.\"",ref:"మత్తయి 13:44"},
{id:124,topic:"క్రైస్తవుడు",title:"లోకమును తలక్రిందులు చేయువారు",text:"\"ఈ మనుష్యులు ... లోకమును తలక్రిందులు చేసారు.\"",ref:"అపొస్తలుల కార్యములు 17:6"},
{id:125,topic:"క్రైస్తవుడు",title:"పరిశుద్ధుల పరిపాలన",text:"\"పరిశుద్ధులు లోకమును నిర్వహించవలెనని మీకు తెలియదా?\"",ref:"1 కొరింథీయులు 6:2"},
{id:126,topic:"క్రైస్తవుడు",title:"పరస్పర సంబంధ జీవితములు",text:"\"దేవుడు నన్ను సాంత్వన పరచిన సాంత్వనతో ఏ బాధలో ఉన్నవారినైనా సాంత్వన పరచగలను.\"",ref:"2 కొరింథీయులు 1:4"},
{id:127,topic:"క్రైస్తవుడు",title:"అత్యధికముగా లెక్కించునది",text:"\"సున్నతి ఏమియు లెక్కించబడదు, సున్నతి లేకపోవుట ఏమియు లెక్కించబడదు; దేవుని ఆజ్ఞలకు విధేయతయే సమస్తము.\"",ref:"1 కొరింథీయులు 7:19"},
{id:128,topic:"క్రైస్తవుడు",title:"సమస్తము లేక ఏమియు లేదు",text:"మనము క్రైస్తవులము — లేక కాదు.",ref:"ప్రకటన 3:15-16"},
{id:129,topic:"క్రైస్తవుడు",title:"క్రీస్తు వారిని జ్ఞాపకము చేసుకొంటాడు",text:"\"నేను అతనికి ఒక తెల్ల రాయిని ఇస్తాను, దానిపై క్రొత్త పేరు వ్రాయబడి ఉంటుంది.\"",ref:"ప్రకటన 2:17"},
{id:130,topic:"చర్చి",title:"సరిహద్దు స్థావరము",text:"\"మనము పరలోక స్థావరము.\"",ref:"ఫిలిప్పీయులు 3:20"},
{id:131,topic:"చర్చి",title:"నీ నామమునకు ఒక మందిరము",text:"\"నా దేవుడైన ప్రభువు నామమునకు ఒక మందిరమును కట్టాలని నేను ప్రతిపాదించుచున్నాను.\"",ref:"1 రాజులు 5:5"},
{id:132,topic:"చర్చి",title:"చర్చిని కొలుచుట",text:"\"లేచి దేవుని మందిరమును, బలిపీఠమును, అక్కడ ఆరాధించువారిని కొలువుము.\"",ref:"ప్రకటన 11:1"},
{id:133,topic:"చర్చి",title:"మిస్ అయిన అవకాశము",text:"యోతాము \"నిత్యుని కళ్ళలో సరైనది చేసాడు ... తప్ప అతను నిత్యుని మందిరములోనికి తన మార్గమును చేసుకోలేదు.\"",ref:"2 దినవృత్తాంతములు 27:2"},
{id:134,topic:"చర్చి",title:"సహవాస వ్యక్తీకరణ",text:"\"వారు అపొస్తలుల బోధ వినుటకు, సాధారణ జీవితమును పంచుకొనుటకు, రొట్టె విరుచుటకు, ప్రార్థన చేయుటకు నిరంతరము కలిసారు.\"",ref:"అపొస్తలుల కార్యములు 2:42,46-47"},
{id:135,topic:"చర్చి",title:"సమస్త ప్రజలకు మందిరము",text:"\"నా మందిరము సమస్త ప్రజలకు ప్రార్థనా మందిరమని పిలువబడుతుంది.\"",ref:"యెషయా 56:7"},
{id:136,topic:"చర్చి",title:"ముందు పరుగెత్తువారు లేరు",text:"\"క్రీస్తు చర్చికి శిరస్సు.\" \"దియొత్రెఫెసు, తనను తాను మొదటి స్థానములో ఉంచుకోవడానికి ఇష్టపడువాడు.\"",ref:"ఎఫెసీయులు 5:23; 3 యోహాను 9"},
{id:137,topic:"చర్చి",title:"మనము సురక్షితమా?",text:"\"నా నామమును ధరించు ఈ మందిరములో వచ్చి నిలిచి, 'మేము సురక్షితము' అని చెప్పుకొనే ఇశ్రాయేలు ప్రజలను ప్రభువు ఖండించాడు.\"",ref:"యిర్మీయా 7:9-11"},
{id:138,topic:"చర్చి",title:"కనీస అవసరములు",text:"\"మిత్రుడా ... వివాహ వస్త్రములు లేకుండా ఇక్కడికి ఎలా వచ్చావు?\"",ref:"మత్తయి 22:12"},
{id:139,topic:"చర్చి",title:"ఆయన స్వభావమునకు అనుకూలము",text:"యేసు తన స్వభావమునకు అత్యంత అనుకూలమైన స్థలములో ఉన్నాడు — దేవాలయములో, పండితులతో.",ref:"లూకా 2:42-49"},
{id:140,topic:"చర్చి",title:"చర్చి గోడలకు ఆవల",text:"సొలొమోను దేవుడు నాలుగు నిటారు గోడలకు పరిమితము కాలేడని గ్రహించాడు. \"ఆకాశము, ఆకాశముల ఆకాశము ఆయనను కలిగియుండలేనప్పుడు...\"",ref:"2 దినవృత్తాంతములు 2:5-6"},
{id:141,topic:"అంకితభావము",title:"అంతర్గత అంకితభావము లేదు",text:"సొలొమోను రాజ్యపు బాహ్య వైభవము అంత గొప్పది, కానీ దేవుని పట్ల అంతర్గత అంకితభావము లేకపోవుటచే, అతని రాజ్యము తన మెరుపును కోల్పోయింది.",ref:"1 రాజులు 10:6-7"},
{id:142,topic:"అంకితభావము",title:"వారు తమను తాము అంకితము చేసుకొన్నారు",text:"\"మీరు మాసిదోనియ, అఖయలలో విశ్వాసులందరికీ ఆదర్శముగా మారారు.\"",ref:"1 థెస్సలొనీకయులు 1:7-8"},
{id:143,topic:"అంకితభావము",title:"ఏ స్పందనతో?",text:"సువార్త ప్రకటనను విన్న ప్రతి ఒక్కరూ శాశ్వతముగా సమృద్ధి చేయబడరు — నేలల ఉపమానము.",ref:"లూకా 8:4-8"},
{id:144,topic:"అంకితభావము",title:"నీ వాక్యము ప్రకారము",text:"మరియ, \"ఇదిగో ప్రభువు దాసి; నీ వాక్యము ప్రకారము నాకు జరుగును గాక\" అన్నది.",ref:"లూకా 1:38"},
{id:145,topic:"సాధారణ విషయములు",title:"మన్నా మాత్రమే",text:"ఇశ్రాయేలీయులు, \"మా కళ్ళ ముందు ఈ మన్నా తప్ప ఏమియు లేదు\" అని ఫిర్యాదు చేసారు.",ref:"సంఖ్యాకాండము 11:6"},
{id:146,topic:"సాధారణ విషయములు",title:"వచ్చి చూడుము",text:"\"నజరేతు నుండి ఏదైనా మంచి రాగలదా?\" ఫిలిప్పు జవాబు: \"వచ్చి చూడుము.\"",ref:"యోహాను 1:46"},
{id:147,topic:"సాధారణ విషయములు",title:"యోసేపు కుమారుడు",text:"\"ఇతడు యోసేపు కుమారుడు కాదా?\" వారు అడిగారు.",ref:"లూకా 4:22"},
{id:148,topic:"సాధారణ విషయములు",title:"తృణీకరించబడెను",text:"\"యేసు మహిమపరచబడినప్పుడు, అప్పుడు వారు జ్ఞాపకము చేసుకొన్నారు.\"",ref:"యోహాను 12:16"},
{id:149,topic:"సాధారణ విషయములు",title:"స్పష్టమైనది మిస్ చేయుట",text:"\"ఈ వాస్తవములలో ఏదీ అతనికి తెలియదని నేను నమ్మను, ఎందుకంటే ఇది ఏ మూలనో జరిగిన వ్యాపారము కాదు.\"",ref:"అపొస్తలుల కార్యములు 26:26"},
{id:150,topic:"కరుణ",title:"తండ్రి హృదయము",text:"\"ఆదాముకును, అతని భార్యకును ప్రభువైన దేవుడు చర్మపు వస్త్రములు చేయించి వారిని కట్టెను.\"",ref:"ఆదికాండము 3:21"},
{id:151,topic:"కరుణ",title:"శిశువు ఏడ్చినప్పుడు",text:"జాతి గానీ, రంగు గానీ ఫరో కుమార్తెను శిశువు ఏడ్చినప్పుడు కరుణించకుండా ఆపలేవని మోషే తల్లికి తెలుసు.",ref:"నిర్గమకాండము 2:5-6"},
{id:152,topic:"కరుణ",title:"కరుణలో వృద్ధి",text:"యోసేపు ఐగుప్తు కరువు బలుల పశువులు, భూమి, శ్రమ కొరకు రొట్టె, విత్తనమును మార్పిడి చేసాడు.",ref:"ఆదికాండము 47:14-26"},
{id:153,topic:"కరుణ",title:"క్రైస్తవుని స్పందన",text:"\"ఎవరు బలహీనుడు, నేను బలహీనుడను కాను? ఎవరు అభ్యంతరపరచబడ్డారు, నేను మండిపోను?\"",ref:"2 కొరింథీయులు 11:29"},
{id:154,topic:"కరుణ",title:"కాపరి సంతోషిస్తాడు",text:"మంచి కాపరి పాపి పశ్చాత్తాపపడిన ప్రతిసారీ సంతోషిస్తాడు.",ref:"లూకా 15:4-10"},
{id:155,topic:"కరుణ",title:"ఇది చేయనివ్వుము",text:"యేసు, \"ఇది చేయనివ్వుము!\" అన్నాడు, ఆ చెవిని తాకి స్వస్థపరచాడు.",ref:"లూకా 22:49-51"},
{id:156,topic:"ఫిర్యాదు",title:"ప్రభువు మాతో ఉన్న యెడల",text:"\"ప్రభువు మాతో ఉన్న యెడల, ఇదంతా మాకు ఎందుకు సంభవించింది?\"",ref:"న్యాయాధిపతులు 6:13-14"},
{id:157,topic:"ఫిర్యాదు",title:"దేవుని ఖండన",text:"\"మీ మాటలు నా మీద కఠినముగా ఉన్నాయి.\"",ref:"మలాకీ 3:13-15"},
{id:158,topic:"ఫిర్యాదు",title:"నన్ను మారా అని పిలువుము",text:"\"నన్ను నయోమి అని పిలువకుడి, నన్ను మారా అని పిలువుడి: సర్వశక్తిమంతుడు నాతో బహు చేదుగా వ్యవహరించాడు.\"",ref:"రూతు 1:20-21"},
{id:159,topic:"ఫిర్యాదు",title:"గుర్రములతో పోటీ",text:"\"నీవు కాలి నడకను మనుష్యులతో పరుగెత్తి, వారు నిన్ను ఓడించిన యెడల, గుర్రములతో ఎలా పోటీ చేస్తావు?\"",ref:"యిర్మీయా 12:5"},
{id:160,topic:"రాజీ",title:"రెండు గురువులకు సేవ",text:"\"వారు నిత్యుని ఆరాధించారు, వారు తమ స్వంత దేవతలను కూడా సేవించారు.\"",ref:"2 రాజులు 17:33"},
{id:161,topic:"రాజీ",title:"ఒక దేవుడు లేక మరొకడు",text:"\"ఇదిగో ఓ ఇశ్రాయేలూ, నిన్ను ఐగుప్తు దేశము నుండి తీసుకొని వచ్చిన నీ దేవతలు.\"",ref:"1 రాజులు 12:28"},
{id:162,topic:"నమ్మకము",title:"అనుభవము ఆధారముగా",text:"\"సింహపు నఖముల నుండి, ఎలుగుబంటి నఖముల నుండి నన్ను రక్షించిన ప్రభువు, ఈ ఫిలిష్తీయుని చేతి నుండి నన్ను రక్షిస్తాడు.\"",ref:"1 సమూయేలు 17:37"},
{id:163,topic:"నమ్మకము",title:"రాత్రిలో పాటలు",text:"\"మనలను సంతోష గీతములు రాత్రిలో ఇచ్చు నా సృష్టికర్త దేవుడు ఎక్కడ?\"",ref:"యోబు 35:10"},
{id:164,topic:"నమ్మకము",title:"మనము కడుతాము",text:"\"పరలోక దేవుడు, ఆయన మాకు విజయము ఇస్తాడు; కాబట్టి ఆయన సేవకులమైన మనము కట్టుట ప్రారంభిస్తాము.\"",ref:"నెహెమ్యా 2:20"},
{id:165,topic:"నమ్మకము",title:"మనలో దేవుని నమ్మకము",text:"\"ఇదిగో అతనికి ఉన్న సమస్తము నీ అధికారములో ఉంది.\" దేవుడు మనలో సమానమైన నమ్మకమును కలిగి ఉంటాడా?",ref:"యోబు 1:12"},
{id:166,topic:"నమ్మకము",title:"విశ్వాసము నుండి పుట్టిన ప్రశాంతత",text:"\"సభలో కూర్చున్న వారందరూ ... అతని ముఖము దేవదూత ముఖము వలె ఉన్నట్లు చూచారు.\"",ref:"అపొస్తలుల కార్యములు 6:15"},
{id:167,topic:"ప్రతిష్ఠ",title:"అతని చేతిలో కర్ర",text:"\"నీ చేతిలో ఏమి ఉంది?\" మోషే, \"ఒక కర్ర\" అన్నాడు.",ref:"నిర్గమకాండము 4:2"},
{id:168,topic:"ప్రతిష్ఠ",title:"నేను ఇక్కడ ఉన్నాను",text:"\"ఇదిగో నేను ఉన్నాను; నన్ను పంపుము.\"",ref:"యెషయా 6:8"},
{id:169,topic:"ప్రతిష్ఠ",title:"నా కాళ్ళు మాత్రమే కాదు",text:"\"ప్రభువా, నా కాళ్ళు మాత్రమే కాదు, నా చేతులు, నా తల కూడా.\"",ref:"యోహాను 13:9"},
{id:170,topic:"ప్రతిష్ఠ",title:"దేవునిచే చేయబడిన సూచన",text:"\"నిజమైన యూదుడు హృదయములో దేవునికి చెందినవాడు.\"",ref:"రోమీయులు 2:29"},
{id:171,topic:"సంతృప్తి",title:"ముందుకు వెళ్ళు సమయము",text:"\"మీరు ఈ కొండపై చాలా కాలము నివసించారు: తిరిగి, మీ ప్రయాణమును ప్రారంభించుడి.\"",ref:"ద్వితీయోపదేశము 1:6,8"},
{id:172,topic:"సంతృప్తి",title:"ఉన్నట్లే ఉండుట",text:"\"సీయోనులో సుఖముగా ఉన్నవారికి ... శ్రమ!\"",ref:"ఆమోసు 6:1"},
{id:173,topic:"సంతృప్తి",title:"సేవకు అవకాశము",text:"\"నేను వినయముగా జీవించుటకు తెలుసు; సమృద్ధిలో జీవించుటకు కూడా తెలుసు.\"",ref:"ఫిలిప్పీయులు 4:12-13"},
{id:174,topic:"మార్పిడి",title:"ఒక క్రొత్త హృదయము",text:"\"ప్రభువు ఆత్మ నీపై వచ్చును, నీవు ... మరొక మనిషిగా మార్చబడతావు.\"",ref:"1 సమూయేలు 10:6,9"},
{id:175,topic:"మార్పిడి",title:"గురువు స్పర్శ",text:"\"నేను మనుష్యులను చూచుచున్నాను; కానీ వారు నడచు చెట్ల వలె కనబడుచున్నారు.\"",ref:"మార్కు 8:24-25"},
{id:176,topic:"మార్పిడి",title:"స్వీకరించుటకు సిద్ధము",text:"\"వారు వాక్యమును స్వీకరించుటకు పూర్తిగా సిద్ధముగా ఉండి ... రోజువారీ ధర్మశాస్త్రమును అధ్యయనము చేసారు.\"",ref:"అపొస్తలుల కార్యములు 17:11"},
{id:177,topic:"నిశ్చయత",title:"మన పితరుల దేవుడు",text:"\"నేను నీ తండ్రి దేవుడను, అబ్రహాము దేవుడను, ఇస్సాకు దేవుడను, యాకోబు దేవుడను.\"",ref:"నిర్గమకాండము 3:4,6"},
{id:178,topic:"నిశ్చయత",title:"అతని నిశ్చయతల కారణముగా",text:"దానియేలు \"రాజు కూరుషు మొదటి సంవత్సరము వరకు తన స్థానమును నిలుపుకొన్నాడు.\"",ref:"దానియేలు 1:21"},
{id:179,topic:"నిశ్చయత",title:"నీవు cherishe చేసే నిరీక్షణ",text:"\"నీవు cherishe చేసే నిరీక్షణకు కారణము అడిగే ఎవరికైనా సమాధానము చెప్పుటకు ఎల్లప్పుడూ సిద్ధముగా ఉండుము.\"",ref:"1 పేతురు 3:15"},
{id:180,topic:"నిశ్చయత",title:"దాదాపు ఒప్పించబడ్డాడా?",text:"అగ్రిప్ప, \"దాదాపు నన్ను క్రైస్తవునిగా ఒప్పించుచున్నావు\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 26:28"},
{id:181,topic:"సహకారము",title:"ప్రతి వ్యక్తి ముఖ్యము",text:"\"మీ సహోదరులు యుద్ధమునకు వెళ్తారు, మీరు ఇక్కడ కూర్చుంటారా?\"",ref:"సంఖ్యాకాండము 32:6-7"},
{id:182,topic:"సహకారము",title:"హృదయములు, హస్తములు కలిసి",text:"\"ఈ మనుష్యులు ఓడలో ఉండకపోతే, మీరు రక్షింపబడలేరు.\"",ref:"అపొస్తలుల కార్యములు 27:30-31"},
{id:183,topic:"సహకారము",title:"కీడు కొరకు, మేలు కొరకు సహకారము",text:"\"ప్రతివాడూ తన పొరుగువానికి సహాయము చేస్తాడు, తన సహోదరునితో, 'ధైర్యము తెచ్చుకో!' అని చెప్పుతాడు.\"",ref:"యెషయా 41:6-7"},
{id:184,topic:"సహకారము",title:"అనేక మంది అవసరము",text:"\"నేను నిపుణుడైన మాస్టర్-బిల్డర్ వలె ఇంటి పునాదిని వేసాను; ఈ పునాదిపై మరొకడు కట్టుట మిగిలియున్నది.\"",ref:"1 కొరింథీయులు 3:10"},
{id:185,topic:"సహకారము",title:"యేసు నామములో",text:"\"అతనిని ఆపకూడదు. మీకు వ్యతిరేకముగా లేని మనిషి మీ పక్షములో ఉన్నాడు.\"",ref:"లూకా 9:50"},
{id:186,topic:"ధైర్యము",title:"మంచి ధైర్యము కలిగియుండుడి",text:"\"మంచి ధైర్యము కలిగియుండుడి, మన ప్రజల కొరకు, మన దేవుని పట్టణముల కొరకు పురుషుల వలె పోరాడుదము.\"",ref:"2 సమూయేలు 10:9,11-12"},
{id:187,topic:"ధైర్యము",title:"భక్తి వ్యక్తీకరణ",text:"ఓబద్యా \"వారిని ఒక గుహలో దాచి, రొట్టె, నీటితో పోషించాడు.\"",ref:"1 రాజులు 18:4"},
{id:188,topic:"ధైర్యము",title:"నేను వెళ్ళను",text:"\"నేను వంటి మనుష్యుడు పారిపోవలెనా? నేను లోపలికి వెళ్ళను.\"",ref:"నెహెమ్యా 6:11"},
{id:189,topic:"ధైర్యము",title:"పక్కపక్కన నిలుచుట",text:"\"పౌలు [వారిని] చూచినప్పుడు, దేవునికి కృతజ్ఞతలు చెప్పి, ధైర్యము తెచ్చుకొన్నాడు.\"",ref:"అపొస్తలుల కార్యములు 28:15"},
{id:190,topic:"విమర్శ",title:"ప్రవక్తకు గౌరవము",text:"\"ఒక ప్రవక్త తన స్వదేశములో, తన స్వంత ఇంటిలో తప్ప గౌరవము లేకుండా ఉండడు.\"",ref:"మత్తయి 13:57"},
{id:191,topic:"విమర్శ",title:"దూషించు సహచరులు",text:"\"మీరు ఇక వారితో కలిసి అదే అతిగా తినుట, త్రాగుట, దుర్వ్యయములలో మునిగిపోకపోవుట పరదేశీయులకు ఆశ్చర్యము కలిగిస్తుంది.\"",ref:"1 పేతురు 4:4"},
{id:192,topic:"సిలువ",title:"సిలువ లేకుండా కిరీటము లేదు",text:"\"సిలువ లేకుండా కిరీటము లేదు\" అనే మాటలు క్రైస్తవ అనుభవములో చెరగని విధముగా వ్రాయబడ్డాయి.",ref:"అపొస్తలుల కార్యములు 26:29"},
{id:193,topic:"సిలువ",title:"యేసు మధ్యలో",text:"\"వారు ఆయనను సిలువ వేసారు, ఆయనతో ఇద్దరిని, ఒకరిని ఒక వైపు, మరొకరిని మరొక వైపు, యేసును మధ్యలో.\"",ref:"యోహాను 19:18"},
{id:194,topic:"సిలువ",title:"సిలువ సవాలు",text:"రహస్య శిష్యుడు యేసుకు సరైన ఖననము ఇవ్వడానికి అనుమతి అడగుటకు \"ధైర్యము సంపాదించాడు.\"",ref:"మార్కు 15:43"},
{id:195,topic:"సిలువ",title:"పూర్వసూచన",text:"పిలాతు క్రీస్తు సిలువపై శాసనము మూడు భాషలలో — హెబ్రీ, లాటిన్, గ్రీకు — \"నజరేతు యేసు యూదుల రాజు\" అనే మాటలను ప్రకటించమని ఆజ్ఞాపించాడు.",ref:"యోహాను 19:19"},
{id:196,topic:"సిలువ",title:"ఉత్సుకతగల ప్రేక్షకులు",text:"\"వారు ఆయనను సిలువ వేసారు. ... కూర్చొని అక్కడ ఆయనను చూచారు.\"",ref:"మత్తయి 27:35-36"},
{id:197,topic:"సిలువ",title:"బోధ ఒత్తిడి",text:"\"నేను మీతో ఉన్నప్పుడు యేసు క్రీస్తు, ఆయన సిలువ తప్ప మిగిలిన సమస్తమును మరచిపోవాలని నిర్ణయించుకొన్నాను.\"",ref:"1 కొరింథీయులు 2:1-2"},
{id:198,topic:"ఉత్సుకత",title:"అగౌరవపు తొంగిచూచుట",text:"ప్రభువు \"బేత్షెమెషు మనుష్యులను కొట్టాడు, ఎందుకంటే వారు ప్రభువు ఒడంబడిక పెట్టెలోనికి చూచారు.\"",ref:"1 సమూయేలు 6:19"},
{id:199,topic:"మరణము",title:"అప్పు తీసుకొన్న సంవత్సరములు",text:"\"నేను నీ దినములకు పదిహేను సంవత్సరములు కలుపుదును\" అని దేవుడు హిజ్కియాకు చెప్పాడు.",ref:"2 రాజులు 20:6"},
{id:200,topic:"మరణము",title:"ఇంటి ఖననము",text:"యాకోబు యోసేపు చేత ప్రమాణము చేయించుకొని, తన శరీరము తన పితరుల దేశమునకు తిరిగి తీసుకొని వెళ్ళి, తన స్వజనుల మధ్య ఖననము చేయవలెనని కోరాడు.",ref:"ఆదికాండము 47:29-31"},
{id:201,topic:"మోసము",title:"వక్రమైన అర్థములు",text:"అబ్రహాము, \"అయినప్పటికీ ఆమె నిజముగా నా సహోదరి\" అని చెప్పి తన అపరాధమును పెంచాడు.",ref:"ఆదికాండము 20:12"},
{id:202,topic:"మోసము",title:"ఆమె కొరకు నేను చనిపోవచ్చు",text:"ఇస్సాకు, \"ఆమె కొరకు నేను చనిపోవచ్చునని\" అన్నాడు.",ref:"ఆదికాండము 26:9"},
{id:203,topic:"మోసము",title:"లాభము కొరకు అవకాశము",text:"గెహజీ, వ్యక్తిగత లాభము కొరకు అవకాశమును పట్టుకొని, నయమాను వెంబడించాడు.",ref:"2 రాజులు 5:25-26"},
{id:204,topic:"మోసము",title:"మోసపు మార్గము",text:"దావీదు ఫిలిష్తీయ రాజు ఆకీషును, తాను యూదులతో పోరాడుటలో చేరాడని నమ్మించాడు.",ref:"1 సమూయేలు 27:10-11"},
{id:205,topic:"మోసము",title:"చీకటిలో పని చేయుట",text:"\"తమ ప్రణాళికలను నిత్యుని నుండి దాచి, చీకటిలో పని చేసి, 'ఎవరూ చూడరు, తెలియరు!' అని ఆలోచించు మనుష్యులకు శ్రమ!\"",ref:"యెషయా 29:15"},
{id:206,topic:"మోసము",title:"అంతా బాగుంది",text:"\"అంతా బాగుంది, అంతా బాగుంది\" అని కూర్చున్నారు, \"అంతా బాగా లేనప్పుడు.\"",ref:"యిర్మీయా 6:14"},
{id:207,topic:"మోసము",title:"అబద్ధ దావా",text:"పేతురు అననీయాతో, \"నీవు మనుష్యులకు కాదు, దేవునికి అబద్ధము చెప్పావు\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 5:1-4"},
{id:208,topic:"నిర్ణయము",title:"నేను వెళ్తాను",text:"రిబ్కా వెంటనే, నిస్సందేహముగా, \"నేను వెళ్తాను\" అని జవాబిచ్చింది.",ref:"ఆదికాండము 24:58"},
{id:209,topic:"నిర్ణయము",title:"మూర్ఖ నిర్ణయము",text:"చెట్లు చివరకు పనికిరాని ముళ్ళ పొద రాజుగా పేరు పెట్టుకొనుటకు దాని అభ్యర్థనలకు లొంగిపోయాయి.",ref:"న్యాయాధిపతులు 9:7-15"},
{id:210,topic:"నిర్ణయము",title:"ఇప్పుడు లేక ఎన్నడూ",text:"\"మేము మళ్ళీ వినుతాము\" అన్నారు. కానీ రెండవ అవకాశము ఎన్నడూ ఇవ్వబడలేదు.",ref:"అపొస్తలుల కార్యములు 17:32"},
{id:211,topic:"నిర్ణయము",title:"సగం సగం",text:"\"నేను రెండు మనస్సుల మనుష్యులను ద్వేషిస్తాను.\"",ref:"కీర్తనలు 119:113"},
{id:212,topic:"నిర్ణయము",title:"విధిగత నిర్ణయము లేకపోవుట",text:"పిలాతు, \"మీరు ఆయనను తీసుకొని సిలువ వేయుడి: నేను ఆయనలో తప్పు కనుగొనలేదు\" అన్నాడు.",ref:"యోహాను 19:6"},
{id:213,topic:"ఆగుట",title:"మార్గమధ్యలో విశ్రాంతి",text:"\"మేఘము సన్నిధి గుడారము మీద ఎక్కువ కాలము ఆగినప్పుడు ... ఇశ్రాయేలీయులు ... ప్రయాణము చేయలేదు.\"",ref:"సంఖ్యాకాండము 9:19"},
{id:214,topic:"ఆలస్యము",title:"అతను ఎంతో ధర చెల్లించాడు",text:"యాకోబు తన ప్రయాణమును ఆలస్యము చేసి, ఒక అన్యజాతి ప్రజల దగ్గర గుడారము వేసాడు. షెకెము అతని ప్రియమైన కుమార్తె దీనాను అపవిత్రము చేసాడు.",ref:"ఆదికాండము 33:18-19"},
{id:215,topic:"ఆలస్యము",title:"ఉన్నత దావాలు",text:"\"వెళ్ళుము, కానీ నేను నీ కొరకు ఏమి చేసానో ఆలోచించుము!\"",ref:"1 రాజులు 19:20"},
{id:216,topic:"ఆలస్యము",title:"దేవుని ఆలస్యములు",text:"యేసు తన స్నేహితుడు లాజరు గూర్చి వినినప్పుడు, ఆయన ఉన్న చోటనే రెండు రోజులు ఉండెను.",ref:"యోహాను 11:6"},
{id:217,topic:"ఆలస్యము",title:"నాకు సమయము ఉన్నప్పుడు",text:"ఫెలిక్సు, \"నాకు సమయము ఉన్నప్పుడు నిన్ను పిలిపిస్తాను\" అన్నాడు.",ref:"అపొస్తలుల కార్యములు 24:25"},
{id:218,topic:"ఆలస్యము",title:"ఇప్పుడే సమయము",text:"\"ఇప్పుడే అంగీకరింపదగిన సమయము; ఇదిగో, ఇప్పుడే రక్షణ దినము.\"",ref:"2 కొరింథీయులు 6:2"},
{id:219,topic:"నిరాశ",title:"దేవుడు బాలునితో ఉన్నాడు",text:"\"దేవుడు బాలునితో ఉన్నాడు.\"",ref:"ఆదికాండము 21:20"},
{id:220,topic:"నిరాశ",title:"ఇళ్ళు, తోటలు",text:"\"ఇళ్ళు కట్టుకొనుడి ... తోటలు వేయుడి.\"",ref:"యిర్మీయా 29:5"},
{id:221,topic:"నిరాశ",title:"ఎవరు పట్టించుకుంటారు?",text:"\"ఎవరూ అతనికి ఏమియు ఇవ్వలేదు.\"",ref:"లూకా 15:16"},
{id:222,topic:"కష్టము",title:"అతను ఏమి చేయగలడు?",text:"\"కానీ దావీదు తన దేవుడైన నిత్యునిపై ఆధారపడి, ధైర్యము తెచ్చుకొన్నాడు.\"",ref:"1 సమూయేలు 30:6"},
{id:223,topic:"కష్టము",title:"నేను నీతో ఉన్నాను",text:"\"నేను నీతో ఉన్నాను, నిన్ను రక్షించుటకు, ప్రభువు చెప్పుచున్నాడు.\"",ref:"యిర్మీయా 1:18-19"},
{id:224,topic:"కష్టము",title:"మంచు దినమున",text:"\"బెనాయా ... ఒక మంచు దినమున గొయ్యిలో ఒక సింహమును చంపాడు.\"",ref:"1 దినవృత్తాంతములు 11:22"},
{id:225,topic:"కష్టము",title:"ఎన్నుకోని సిలువలు",text:"\"వారు కురేనీయుడు అనే ఒక మనిషిని, సీమోనును కనుగొన్నారు: అతనిని ఆయన సిలువను మోయుటకు బలవంతము చేసారు.\"",ref:"మత్తయి 27:32"},
{id:226,topic:"కష్టము",title:"దేవునికి వ్యతిరేకముగా పోరాడుట",text:"\"ముల్లు మీద తన్నుకొనుట నీకు కష్టము.\"",ref:"అపొస్తలుల కార్యములు 26:14"},
{id:227,topic:"అసమ్మతి",title:"సంబంధిత సలహా",text:"\"యువొదియాను, సింతుకేను ప్రభువులో ఏకముగా ఉండమని నేను వేడుకొనుచున్నాను.\"",ref:"ఫిలిప్పీయులు 4:2-3"},
{id:228,topic:"అసమ్మతి",title:"ఆడుకొను పిల్లల వలె",text:"ఒక సమూహము \"వివాహము\" ఆడమని పిలుస్తుంది, కానీ వారు నిరాకరించి, \"అంత్యక్రియలు\" ఆడాలని కోరుకుంటారు, వారి అవివేక అసమ్మతుల కారణముగా అసలు ఆడలేకపోతారు.",ref:"లూకా 7:31-32"},
{id:229,topic:"శిష్యత్వము",title:"మనుష్యులను పట్టు జాలరులు",text:"\"నన్ను అనుసరించుడి, నేను మిమ్ములను మనుష్యులను పట్టు జాలరులుగా చేస్తాను.\"",ref:"మార్కు 1:17"},
{id:230,topic:"శిష్యత్వము",title:"నీవు ఎవరు?",text:"\"నేను ఎడారిలో 'ప్రభువు మార్గమును సమముము' అని అరచు ఒక స్వరము.\"",ref:"యోహాను 1:22-23"},
{id:231,topic:"శిష్యత్వము",title:"క్రీస్తు చేయు తేడా",text:"\"ఆయన యెరూషలేములో ప్రవేశించినప్పుడు, మొత్తము పట్టణము కంపించింది.\"",ref:"మత్తయి 21:10"},
{id:232,topic:"శిష్యత్వము",title:"ఒక మిషన్ అప్పగించబడెను",text:"\"గురువా, మేము నిన్ను ఒక ప్రయోజనము కోరాలనుకుంటున్నాము.\"",ref:"మార్కు 10:35"},
{id:233,topic:"శిష్యత్వము",title:"సమస్త విషయములలో క్రొత్తది",text:"\"ఎవరూ సంకోచించని బట్ట ముక్కను పాత కోటుపై కుట్టరు.\"",ref:"మత్తయి 9:16"},
{id:234,topic:"శిష్యత్వము",title:"రహస్యముగా శిష్యుడు",text:"అరిమతయా యోసేపు తన వెలుగును కొలిమి క్రింద దాచాడు.",ref:"యోహాను 19:38"},
{id:235,topic:"శిష్యత్వము",title:"భేదపు గుర్తు",text:"\"నా శరీరముపై నా యజమాని, ప్రభువైన యేసు ముద్రలను మోస్తున్నాను.\"",ref:"గలతీయులు 6:17"},
{id:236,topic:"శిష్యత్వము",title:"కృత్రిమ శిష్యత్వము",text:"\"మేము అనేకుల వలె దేవుని వాక్యమును విక్రయించువారము కాము.\"",ref:"2 కొరింథీయులు 2:17"},
{id:237,topic:"నిరుత్సాహము",title:"నేను ఒక్కడే మిగిలితిని",text:"\"నేను, నేను ఒక్కడే మిగిలితిని.\" కానీ ప్రభువు, \"నేను ఇశ్రాయేలులో ఏడు వేలమందిని మిగిల్చియున్నాను.\"",ref:"1 రాజులు 19:10,18"},
{id:238,topic:"నిరుత్సాహము",title:"దానవులు, మిడతలు",text:"\"అక్కడ మేము దానవులను చూచాము ... మేము మా స్వంత కళ్ళలో మిడతల వలె ఉన్నాము.\"",ref:"సంఖ్యాకాండము 13:33"},
{id:239,topic:"నిరుత్సాహము",title:"వదిలివేయుట",text:"\"ఓ, నాకు ఎడారిలో బాటసారుల బస స్థలము ఉంటే, నేను నా ప్రజలను విడిచి వెళ్ళిపోతాను!\"",ref:"యిర్మీయా 9:2"},
{id:240,topic:"నిరుత్సాహము",title:"ఆమె హృదయము కోల్పోయింది",text:"షెబా రాణిలో \"ఇక ఆత్మ లేదు.\"",ref:"1 రాజులు 10:4-5"},
{id:241,topic:"నిరుత్సాహము",title:"వ్యర్థ హెచ్చరికలు",text:"\"అప్పుడు మీ ప్రమాణములను స్థిరపరచుడి, మీ ప్రమాణములను నెరవేర్చుడి!\"",ref:"యిర్మీయా 44:16-17,25"},
{id:242,topic:"మారువేషము",title:"దాగుట అసాధ్యము",text:"\"రండి, యరొబాము భార్య; నీవు ఎందుకు మరొకరిగా నటించుచున్నావు?\"",ref:"1 రాజులు 14:6"},
{id:243,topic:"మారువేషము",title:"ఎందోరులో సౌలు",text:"సౌలు తనను తాను మారువేషము చేసుకొన్నాడు.",ref:"1 సమూయేలు 28:8"},
{id:244,topic:"మారువేషము",title:"యుద్ధ వస్త్రము",text:"\"నేను మారువేషము ధరించి యుద్ధములో ప్రవేశిస్తాను; కానీ నీవు నీ రాజ వస్త్రములు ధరించుము.\"",ref:"1 రాజులు 22:30"},
{id:245,topic:"మారువేషము",title:"స్వార్థపు ప్రయోజనములు",text:"స్వార్థపు ఎఫెసు వ్యాపారస్థులు ఒక అల్లరిని ప్రేరేపించి, వారి దేవత అపఖ్యాతి పాలవుతున్నదని దావా వేసారు.",ref:"అపొస్తలుల కార్యములు 19:23-29"},
{id:246,topic:"సందేహము",title:"ఉచ్చు వేయుట",text:"ప్రభువు \"సిరియను సైన్యమును రథముల ధ్వని, గుర్రముల ధ్వని, గొప్ప సైన్యపు ధ్వని వినునట్లు చేసాడు.\"",ref:"2 రాజులు 7:6"},
{id:247,topic:"సందేహము",title:"నిజముగా అంత మంచిదా",text:"జెకర్యా దేవదూత మాటలను నమ్మలేదు. అతని అవిశ్వాస కారణముగా, దేవదూత మాటలు నిజము అయ్యేవరకు మాట్లాడు అవకాశము నిరాకరించబడింది.",ref:"లూకా 1:18-20"},
{id:248,topic:"సందేహము",title:"అతను ధైర్యము కోల్పోయాడు",text:"\"అల్ప విశ్వాసీ! ఏది నిన్ను ఇలా ధైర్యము కోల్పోయేలా చేసింది?\"",ref:"మత్తయి 14:29-31"},
{id:249,topic:"సందేహము",title:"జీవితపు సమాధానములు",text:"\"క్రీస్తు ఇచ్చు శాంతి మీ హృదయములలో సమస్త ప్రశ్నలను పరిష్కరించును గాక.\"",ref:"కొలొస్సయులు 3:15"},
{id:250,topic:"సందేహము",title:"షరతులతో కూడిన విశ్వాసము",text:"\"సందేహముల మధ్య ఊగిసలాడువాడు సముద్రపు ఉప్పెన వలె, గాలిచే నడిపింపబడి, ఇటు అటు కొట్టుకొనిపోతాడు.\"",ref:"యాకోబు 1:6"},
{id:251,topic:"విధి",title:"మేము మా విధిని చేసాము",text:"\"మేము అయోగ్యులైన సేవకులము; మేము మా విధిని మాత్రమే చేసాము.\"",ref:"లూకా 17:10"},
{id:252,topic:"ప్రోత్సాహము",title:"వ్యతిరేక గాలులు",text:"\"[శిష్యులు] ఎదురు గాలికి వ్యతిరేకముగా తెడ్లు వేయుచున్నట్లు చూచి, [యేసు] వారి వైపు వచ్చాడు.\"",ref:"మార్కు 6:48"},
{id:253,topic:"ప్రోత్సాహము",title:"విశ్వాసపు ప్రోత్సాహము",text:"\"మీ విశ్వాసపు ప్రభావము ద్వారా నేను కూడా ప్రోత్సాహము పొందుటకు మీ మధ్య ఉండాలని కోరుచున్నాను.\"",ref:"రోమీయులు 1:11-12"},
{id:254,topic:"ఉత్సాహము",title:"మేము సమర్థులము",text:"\"నేను త్రాగు గిన్నెను మీరు త్రాగగలరా?\" \"మేము సమర్థులము.\"",ref:"మత్తయి 20:22"},
{id:255,topic:"ఉత్సాహము",title:"అతని ఉత్సాహము ఎక్కడ ఉంది",text:"పేతురు \"సముద్రములోనికి దూకాడు.\"",ref:"యోహాను 21:7"},
{id:256,topic:"ఉత్సాహము",title:"ఒక విషయము మాత్రమే",text:"\"ఆత్మలు మీకు లోబడుచున్నవని సంతోషించకుడి; బదులుగా మీ పేర్లు పరలోకములో వ్రాయబడియున్నవని సంతోషించుడి.\"",ref:"లూకా 10:17,20"},
{id:257,topic:"ఉత్సాహము",title:"నిర్మల సత్యము",text:"\"నేను పిచ్చివాడను కాను, మహోన్నతుడా ... నేను చెప్పుచున్నది నిర్మల సత్యము.\"",ref:"అపొస్తలుల కార్యములు 26:24-25"},
{id:258,topic:"ఉత్సాహము",title:"స్వల్పకాలిక ఉత్సాహము",text:"\"దేవతలు మనుష్యుల రూపములో మా దగ్గరకు దిగి వచ్చారు.\"",ref:"అపొస్తలుల కార్యములు 14:11"},
{id:259,topic:"సమానత్వము",title:"తప్పుడు ప్రమాణములు",text:"\"నా సహోదరులారా ... మీరు ఎన్నడూ స్నాబరీ చూపకూడదు.\"",ref:"యాకోబు 2:1-4"},
{id:260,topic:"సమానత్వము",title:"క్రీస్తు అందరిలో జీవించును",text:"\"దేవుని క్రొత్త మనిషిలో గ్రీకు, హెబ్రూ, యూదుడు, అన్యజాతి, విదేశీయుడు, అనాగరికుడు, బానిస, స్వేచ్ఛావంతుడు మధ్య భేదము లేదు. క్రీస్తే సమస్తము.\"",ref:"కొలొస్సయులు 3:10-11"},
{id:261,topic:"తప్పించుకొనుట",title:"దేవుని నుండి తప్పించుకొనుట లేదు",text:"యాకోబు, \"నిశ్చయముగా ప్రభువు ఈ స్థలములో ఉన్నాడు, నాకు తెలియదు\" అన్నాడు.",ref:"ఆదికాండము 28:16"},
{id:262,topic:"తప్పించుకొనుట",title:"నీవు ఇక్కడ ఏమి చేయుచున్నావు?",text:"\"ఎలీయా, నీవు ఇక్కడ ఏమి చేయుచున్నావు?\"",ref:"1 రాజులు 19:9"},
{id:263,topic:"తప్పించుకొనుట",title:"దూరముగా",text:"\"పేతురు దూరముగా అనుసరించి ... కూర్చున్నాడు.\"",ref:"లూకా 22:54-55"},
{id:264,topic:"తప్పించుకొనుట",title:"ఒక బుట్టలో తప్పించుకొనుట",text:"\"శిష్యులు అతనిని రాత్రి తీసుకొని వెళ్ళి, గోడ గుండా ఒక బుట్టలో దించారు.\"",ref:"అపొస్తలుల కార్యములు 9:25"},
{id:265,topic:"ఉదాహరణ",title:"జాతులకు సాక్ష్యము",text:"\"మీరు ... ఒక జ్ఞానము గల, అవగాహన గల ప్రజలు.\"",ref:"ద్వితీయోపదేశము 4:6"},
{id:266,topic:"ఉదాహరణ",title:"నగ్నముగా, బోసి కాళ్ళతో",text:"యెషయా మూడు సంవత్సరములు యెరూషలేము వీధులలో నగ్నముగా, బోసి కాళ్ళతో నడిచాడు.",ref:"యెషయా 20:2-3"},
{id:267,topic:"ఉదాహరణ",title:"బలహీన సహోదరులను బలపరచుట",text:"\"ఇక్కడ నేను మీ ఉదాహరణగా ఉండనివ్వండి.\"",ref:"ఫిలిప్పీయులు 3:17"},
{id:268,topic:"ఉదాహరణ",title:"సరైనది, తప్పు",text:"\"మీ హక్కు వినియోగము బలహీనునికి అభ్యంతరకరముగా మారకూడదని చూసుకోండి.\"",ref:"1 కొరింథీయులు 8:9-11"},
{id:269,topic:"సాకు",title:"\"మంచి\" కారణములు",text:"హవ్వ ఆ ఫలము ఆహారముగా ఆకర్షణీయమని, సౌందర్యాత్మకముగా ఆకర్షణీయమని, నిర్దిష్ట జ్ఞానపు మూలమని హేతువాదము చేసింది.",ref:"ఆదికాండము 3:6"},
{id:270,topic:"సాకు",title:"ఇంకొకరిని పంపుము",text:"మోషే, \"ఓ నా ప్రభువా, దయచేసి మరొకరిని పంపుము\" అని వేడుకొన్నాడు.",ref:"నిర్గమకాండము 4:13"},
{id:271,topic:"సాకు",title:"వాయిదా అంటే మరణము",text:"\"చనిపోయినవారు తమ చనిపోయినవారిని పాతిపెట్టనివ్వుము: కానీ నీవు వెళ్ళి దేవుని రాజ్యమును ప్రకటించుము.\"",ref:"లూకా 9:59-60"},
{id:272,topic:"అనుభవము",title:"నిరూపించబడిన ఆయుధములు",text:"దావీదు \"ఏరు నుండి ఐదు నున్నని రాళ్ళను ఏరుకొని ... ఫిలిష్తీయుని సమీపించాడు.\"",ref:"1 సమూయేలు 17:38-40"},
{id:273,topic:"అనుభవము",title:"విజయము అనుభవము తెస్తుంది",text:"\"నన్ను క్రీస్తు ప్రేమ నుండి ఏది వేరు చేయగలదు?\"",ref:"రోమీయులు 8:35,38-39"},
{id:274,topic:"అనుభవము",title:"మార్గదర్శక స్తంభములు",text:"\"మార్గ స్తంభములను నిలబెట్టుము, మార్గదర్శక స్తంభములను నిలబెట్టుము.\"",ref:"యిర్మీయా 31:21"},
{id:275,topic:"అనుభవము",title:"మనము విడిచిపెట్టాలా?",text:"\"మరణము వరకు నమ్మకముగా ఉండుము, నేను నీకు జీవ కిరీటమును ఇస్తాను.\"",ref:"ప్రకటన 2:10"},
{id:276,topic:"దోపిడీ",title:"దోపిడీ చేయుట లేక బలపరచుట",text:"ఏసావు, \"ఈ రోజు నీ జన్మ హక్కును నాకు అమ్ముము\" అన్నాడు.",ref:"ఆదికాండము 25:30-31"},
{id:277,topic:"దోపిడీ",title:"రెట్టింపు ప్రమాణము",text:"\"కానీ ఇశ్రాయేలు ప్రజలలో సొలొమోను ఎవరినీ బానిసలుగా చేయలేదు.\"",ref:"1 రాజులు 9:22"},
{id:278,topic:"దోపిడీ",title:"దేవుని నిర్దోష పిల్లలు",text:"\"వారు నిజాయితీపరులను డబ్బుకు, అవసరముగలవారిని ఒక జత చెప్పులకు అమ్ముతారు.\"",ref:"ఆమోసు 2:6"},
{id:279,topic:"దోపిడీ",title:"పందులు లేక మనుష్యులు?",text:"ప్రజలు \"ఆయనను తమ ప్రాంతము నుండి బయటకు వెళ్ళమని వేడుకోవడం ప్రారంభించారు.\"",ref:"మార్కు 5:17"},
{id:280,topic:"దోపిడీ",title:"లాభములు లేక వ్యక్తిత్వము?",text:"పౌలు ఆ అమ్మాయి నుండి దుష్టాత్మను వెళ్ళగొట్టినప్పుడు, ఆమె యజమానులు కోపగించి, అపొస్తలుడు చెరసాలలో వేయబడుటకు కారణమయ్యారు.",ref:"అపొస్తలుల కార్యములు 16:16-24"},
{id:281,topic:"వైఫల్యము",title:"మూడు రకముల వైఫల్యము",text:"\"ఎందుకంటే అతను మనలో లెక్కింపబడి, ఈ పరిచర్యలో తన వాటాను పొందాడు.\"",ref:"అపొస్తలుల కార్యములు 1:17"},
{id:282,topic:"వైఫల్యము",title:"తండ్రిగా వైఫల్యము",text:"\"ఓ నా కుమారుడా అబ్షాలోము, నా కుమారుడా, నా కుమారుడా అబ్షాలోము!\"",ref:"2 సమూయేలు 18:33"},
{id:283,topic:"వైఫల్యము",title:"విరిగిన ఓడలు",text:"\"యెహోషాపాతు ... తర్షీషు ఓడలను చేయించాడు: కానీ అవి వెళ్ళలేదు; ఎందుకంటే ఓడలు ఎజ్యోన్గెబెరులో విరిగిపోయాయి.\"",ref:"1 రాజులు 22:48"},
{id:284,topic:"వైఫల్యము",title:"బలహీనమైన మేకులు",text:"\"సురక్షిత స్థలములో బిగించబడిన మేకు వదులవుతుంది.\"",ref:"యెషయా 22:25"},
{id:285,topic:"వైఫల్యము",title:"జీవించాడు, మరణించాడు",text:"\"అతను ఇరవై మూడు సంవత్సరములు ఇశ్రాయేలును న్యాయము తీర్చి, మరణించి, షామీరులో ఖననము చేయబడ్డాడు.\"",ref:"న్యాయాధిపతులు 10:2"},
{id:286,topic:"విశ్వాసము",title:"ధైర్యవంతమైన సాహసము",text:"\"విశ్వాసముతో అబ్రహాము ... తాను ఎక్కడికి వెళ్తున్నాడో తెలియకుండానే ఇంటిని విడిచి వెళ్ళాడు.\"",ref:"హెబ్రీయులు 11:8"},
{id:287,topic:"విశ్వాసము",title:"దేవునికి వంతెన",text:"దానియేలు కలను చెప్పుటకు, దాని అర్థమును వివరించుటకు సమర్థుడయ్యాడు, ఎందుకంటే అతని విశ్వాసము దేవుని సన్నిధిలోనికి ఒక వంతెన అయినందున.",ref:"దానియేలు 2:11"},
{id:288,topic:"విశ్వాసము",title:"అయినను రాదు",text:"\"మా దేవుడు ... మమ్మును రక్షింపగలడు ... అయినను రాదు, ఓ రాజా, తెలిసికొనుము, మేము నీ దేవతలను సేవింపము.\"",ref:"దానియేలు 3:17-18"},
{id:289,topic:"విశ్వాసము",title:"విశ్వాసపు ప్రతిఫలము",text:"\"శిష్యులు తమ బసకు తిరిగి వెళ్ళారు. కానీ మరియ సమాధి దగ్గర నిలిచి ... ఏడ్చింది.\"",ref:"యోహాను 20:10-11"},
{id:290,topic:"విశ్వాసము",title:"నేను అర్హుడను కాను",text:"\"ప్రభువా, నిన్ను శ్రమపరచుకోకుము: ఎందుకంటే నేను నా కప్ప క్రిందకు నీవు రావలసినవాడను కాను.\"",ref:"లూకా 7:6"},
{id:291,topic:"విశ్వాసము",title:"మీ విశ్వాసము ఎక్కడ?",text:"యేసు, \"మీ విశ్వాసము ఎక్కడ?\" అని అడిగాడు.",ref:"లూకా 8:24-25"},
{id:292,topic:"విశ్వాసము",title:"విశ్వాసము నిలబడకపోతే",text:"\"మీ విశ్వాసము నిలబడకపోతే, మీరు ఎన్నడూ నిలబడలేరు.\"",ref:"యెషయా 7:9"},
{id:293,topic:"విశ్వాసము",title:"బోధించుట, ఆచరించుట",text:"ఎజ్రా, \"దేవుని అనుగ్రహము ఆయనను వెతికేవారందరి పట్ల దయగలది\" అని చెప్పాడు.",ref:"ఎజ్రా 8:22"},
{id:294,topic:"విశ్వాసము",title:"గురి తప్పుట",text:"\"సంబంధిత క్రియలు లేకుండా నీ విశ్వాసమును నాకు నిరూపించుము, నేను నా క్రియల ద్వారా నా విశ్వాసమును నీకు నిరూపిస్తాను.\"",ref:"యాకోబు 2:18"},
{id:295,topic:"విశ్వాసము",title:"నీ విశ్వాసము ప్రకారము",text:"\"నీ విశ్వాసము ప్రకారము నీకు జరుగును గాక.\"",ref:"మత్తయి 9:29"},
{id:296,topic:"ఉపవాసము",title:"యెషయా సలహా",text:"\"ఇదే నా ఎన్నుకొన్న ఉపవాసమా ... ఆకలిగొన్నవారితో మీ ఆహారమును పంచుకొనుట.\"",ref:"యెషయా 58:6-8"},
{id:297,topic:"ఉపవాసము",title:"నటీనటుల వలె కాదు",text:"\"మీరు ఉపవాసము చేసినప్పుడు, ఆ దుఃఖకరమైన నటీనటుల వలె కనబడకుడి!\"",ref:"మత్తయి 6:16-18"},
{id:298,topic:"తండ్రి",title:"కీడు వారసత్వము",text:"\"[ఆమోన్] ... తన తండ్రి మనష్షే చేసినట్లు చేసాడు.\"",ref:"2 రాజులు 21:20-22"},
{id:299,topic:"తండ్రి",title:"అబ్షాలోముతో మృదువుగా వ్యవహరించుడి",text:"\"నా కొరకు ఆ యువకునితో, అబ్షాలోముతో, మృదువుగా వ్యవహరించుడి.\"",ref:"2 సమూయేలు 18:5"},
{id:300,topic:"తండ్రి",title:"తండ్రి నమూనా",text:"\"సమస్త విషయములలో నిన్ను నీవు మాదిరిగా చూపించుము.\"",ref:"తీతుకు 2:7"},
{id:301,topic:"తండ్రి",title:"నజరేతు యోసేపు",text:"\"మీలో ఏ తండ్రి, తన కుమారుడు ఒక చేప అడిగినప్పుడు, చేపకు బదులుగా ఒక పామును ఇస్తాడు?\"",ref:"లూకా 11:11-12"},
{id:302,topic:"తండ్రి",title:"అబ్రహాము పిల్లలు",text:"\"మీరు అబ్రహాము పిల్లలైతే, అబ్రహాము చేసినది చేస్తారు.\"",ref:"యోహాను 8:39"},
{id:303,topic:"తండ్రి",title:"అతిగా పోషించు తండ్రి కాదు",text:"\"ప్రభువు ప్రేమించువానిని శిక్షిస్తాడు.\"",ref:"హెబ్రీయులు 12:6"},
{id:304,topic:"తండ్రి",title:"దేవుని క్రమశిక్షణలు",text:"\"నేను అతనికి తండ్రిగా ఉంటాను, అతను నాకు కుమారుడుగా ఉంటాడు.\"",ref:"2 సమూయేలు 7:14"},
{id:305,topic:"భయము",title:"భయపడకుడి",text:"\"ఈ గొప్ప సమూహమును చూచి భయపడకుడి, భ్రమపడకుడి; యుద్ధము మీది కాదు, దేవునిది.\"",ref:"2 దినవృత్తాంతములు 20:15,17"},
{id:306,topic:"భయము",title:"ప్రభువు అప్పగించాడు",text:"\"లేవండి; ప్రభువు మిద్యాను సైన్యమును మీ చేతికి అప్పగించాడు.\"",ref:"న్యాయాధిపతులు 7:11,15"},
{id:307,topic:"భయము",title:"అసమంజస ఆందోళనలు",text:"\"దావీదు తనతో తాను, 'సౌలు చేత ఏదో ఒక రోజు నేను చంపబడతాను' అన్నాడు.\" కానీ అతను చంపబడలేదు.",ref:"1 సమూయేలు 27:1"},
{id:308,topic:"భయము",title:"అతను ప్రాణము కొరకు పారిపోయాడు",text:"ఎలీయా \"భయముతో లేచి తన ప్రాణము కొరకు పారిపోయాడు.\"",ref:"1 రాజులు 19:3"},
{id:309,topic:"భయము",title:"దేవుడు మీ కొరకు పోరాడును",text:"\"వారిని చూచి భయపడకుడి, భయపడకుడి. మీ ముందుగా వెళ్ళు మీ దేవుడైన ప్రభువు, మీ కొరకు పోరాడతాడు.\"",ref:"ద్వితీయోపదేశము 1:28-30"},
{id:310,topic:"భయము",title:"సముద్రము ఇక లేదు",text:"\"మొదటి ఆకాశము, మొదటి భూమి గతించెను, సముద్రము ఇక లేదు.\"",ref:"ప్రకటన 21:1"},
{id:311,topic:"భయము",title:"అతను ప్రజలకు భయపడ్డాడు",text:"\"నేను పాపము చేసాను ... ఎందుకంటే నేను ప్రజలకు భయపడి, వారి స్వరమును అనుసరించాను.\"",ref:"1 సమూయేలు 15:24"},
{id:312,topic:"భయము",title:"భయపడు నిర్ణయము",text:"\"నీవు ఆయనను వెళ్ళనిస్తే, నీవు కైసరు మిత్రుడవు కాదు.\"",ref:"యోహాను 19:12"},
{id:313,topic:"సహవాసము",title:"ఏకమనస్సు గలవారు",text:"\"భయపడకుము ... నేనే నీతో ఉన్నాను ... ఈ పట్టణములో నాకు చెందినవారు అనేకులు ఉన్నారు.\"",ref:"అపొస్తలుల కార్యములు 18:9-10"},
{id:314,topic:"సహవాసము",title:"దూరము, ప్రియము",text:"\"మీ కొరకు, లవొదికియలో ఉన్నవారి కొరకు, నన్ను ఎన్నడూ కలవని వారందరి కొరకు నా ఆందోళన ఎంత లోతైనదో.\"",ref:"కొలొస్సయులు 2:1"},
{id:315,topic:"సహవాసము",title:"మనకు సహవాసము అవసరము",text:"ఎపఫ్రా, \"మీ కొరకు తన ప్రార్థనలలో ఎల్లప్పుడూ కుస్తీ పోటీ చేస్తూ.\"",ref:"కొలొస్సయులు 4:12"},
{id:316,topic:"సహవాసము",title:"ఇద్దరిద్దరుగా",text:"\"ప్రభువు డెబ్బై మంది ఇతర శిష్యులను నియమించి, వారిని ఇద్దరిద్దరుగా ముందు బృందాలుగా పంపాడు.\"",ref:"లూకా 10:1"},
{id:317,topic:"అంతిమత",title:"పాచికలు విసిరివేయబడ్డాయి",text:"\"నేను వ్రాసినది వ్రాసాను.\"",ref:"యోహాను 19:22"},
{id:318,topic:"మరచిపోవుట",title:"గతము గతమే",text:"మనష్షే: \"దేవుడు ... నా సమస్త శ్రమను, నా తండ్రి ఇంటికి సంబంధించిన సమస్త దుఃఖమును మరచిపోయేలా చేసాడు.\"",ref:"ఆదికాండము 41:51"},
{id:319,topic:"మరచిపోవుట",title:"జ్ఞాపక శిలలు",text:"ఇశ్రాయేలీయులు యొర్దాను దాటిన తరువాత, యెహోషువ పన్నెండు జ్ఞాపక శిలలను నిలబెట్టాడు.",ref:"యెహోషువ 4:1-9"},
{id:320,topic:"మరచిపోవుట",title:"మరచిపోయిన ఒడంబడికలు",text:"బబులోనీయులచే ముట్టడించబడినప్పుడు, హెబ్రీ యజమానులు సమస్త బానిసలను విడుదల చేయుట ద్వారా దేవుని అనుగ్రహమును వెతికారు; కానీ సంక్షోభము గడిచిన తరువాత, యజమానులు తమ సహోదరులపై మరల బానిసత్వమును విధించారు.",ref:"యిర్మీయా 34:8-16"},
{id:321,topic:"మరచిపోవుట",title:"అతని పని మిగిలింది",text:"\"అయినప్పటికీ ఆ పేద మనిషిని ఎవరూ జ్ఞాపకము చేసుకోలేదు.\"",ref:"ప్రసంగి 9:15"},
{id:322,topic:"క్షమాపణ",title:"ఉత్సాహపూర్వక పాపి",text:"ఎక్కువ ఋణపడినవాడు తన ప్రయోజకుని ఎక్కువ ఉత్సాహముతో ప్రేమించాడు.",ref:"లూకా 7:41-43"},
{id:323,topic:"క్షమాపణ",title:"యేసు అర్థము చేసుకొన్నాడు",text:"యేసు, ఆమె వ్యర్థ జీవితము పట్ల పశ్చాత్తాపమును అర్థము చేసుకొన్నాడు, ఆమెను క్షమించి, సమాధానముతో వెళ్ళమని చెప్పాడు.",ref:"లూకా 7:36-50"},
{id:324,topic:"క్షమాపణ",title:"పాక్షిక సమాధానము",text:"దావీదు పూర్ణ క్షమాపణ స్థాయికి, లేక \"మా ఋణములను మనము క్షమించినట్లు మా ఋణములను క్షమించుము\" అనే మన ప్రభువు ప్రమాణమునకు తనను తాను తీసుకొని రాలేకపోయాడు.",ref:"2 సమూయేలు 14:24"},
{id:325,topic:"క్షమాపణ",title:"లెక్కలు ఉంచుకొనుట",text:"\"గురువా, నా సహోదరుడు నన్ను ఎన్నిసార్లు ద్రోహము చేసినను నేను క్షమించవలెను?\" యేసు డెబ్బది రెట్లు ఏడు సూచించాడు.",ref:"మత్తయి 18:21-22"},
{id:326,topic:"క్షమాపణ",title:"తండ్రి, కుమారులు",text:"\"నేను యోసేపును; నా తండ్రి ఇంకా బ్రతికి ఉన్నాడా?\"",ref:"ఆదికాండము 45:3"},
{id:327,topic:"క్షమాపణ",title:"అతను తెరిచిన తలుపులు",text:"బర్నబా క్షమించి, పౌలు నిజమైన మార్పిడిని గుర్తించు సిద్ధత ఇరవై శతాబ్దములు మూయలేని తలుపులను తెరిచింది.",ref:"అపొస్తలుల కార్యములు 9:26-27"},
{id:328,topic:"క్షమాపణ",title:"రెండవ అవకాశము",text:"బర్నబా భిన్నముగా ఆలోచించి, కుప్రు ప్రయాణములో మార్కును తోడుగా అంగీకరించాడు.",ref:"అపొస్తలుల కార్యములు 15:37-39"},
{id:329,topic:"స్వాతంత్ర్యము",title:"జన్మహక్కులను వర్తకము చేయుట",text:"\"ఇలా తేలికగా ఏసావు తన జన్మహక్కును విలువ కట్టాడు.\"",ref:"ఆదికాండము 25:34"},
{id:330,topic:"స్వాతంత్ర్యము",title:"ఆకర్షణీయ ఆఫర్లు",text:"\"నాతో సమాధానము చేసుకోండి, నాకు లొంగిపోండి.\"",ref:"యెషయా 36:16-17"},
{id:331,topic:"స్వాతంత్ర్యము",title:"స్వాతంత్ర్యమును అభినందించువారు",text:"యెహోయాకీను విడుదల చేయబడి, \"తన చెరసాల వస్త్రములను తీసివేసాడు.\"",ref:"యిర్మీయా 52:33"},
{id:332,topic:"స్వాతంత్ర్యము",title:"స్వాతంత్ర్యపు క్రమశిక్షణలు",text:"\"ఐగుప్తులో సమాధులు లేకపోవుటచే, అరణ్యములో చనిపోవుటకు మమ్మును తీసుకొని వచ్చావా?\"",ref:"నిర్గమకాండము 14:11-12"},
{id:333,topic:"స్వాతంత్ర్యము",title:"సమూయేలు హెచ్చరికలు",text:"\"కాదు; కానీ మాకు ఒక రాజు ఉండాలి.\"",ref:"1 సమూయేలు 8:19-20"},
{id:334,topic:"స్వాతంత్ర్యము",title:"నేను స్వతంత్రుడిగా జన్మించాను",text:"\"కానీ నేను స్వతంత్రుడిగా జన్మించాను.\"",ref:"అపొస్తలుల కార్యములు 22:25,28"},
{id:335,topic:"స్నేహము",title:"హృదయములు కలిపినవి",text:"\"నా హృదయము నీ హృదయముతో ఏకముగా ఉన్నట్లు నీ హృదయము నాతో ఏకముగా ఉన్నదా?\"",ref:"2 రాజులు 10:15"},
